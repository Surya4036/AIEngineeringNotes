.progress .lbl b{color:var(--amber2);font-weight:600;font-family:var(--mono)}
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:6px}

.strip span.done{background:var(--amber)}

.progress .reset{margin-top:10px;background:none;border:0;color:var(--fg3);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:rgba(140,136,128,.5)}

/* main column + top bar */

.btn:hover{background:#2b3035;border-color:#3b4147}

.btn:disabled:hover{background:var(--bg3);border-color:var(--line)}
.btn.icon{padding:7px 10px;font-size:16px;line-height:1}

/* the page frame */
#frameWrap{flex:1;position:relative}
#frame{display:block;width:100%;border:0;background:var(--bg);min-height:calc(100vh - var(--topbar));opacity:1;transition:opacity .18s}
#frame.loading{opacity:0}
@media (prefers-reduced-motion:reduce){#side,#main,#frame,.strip span{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);color:var(--fg2);padding:8px 14px;border-radius:10px;font-size:14px;display:none;z-index:30}
</style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 1 map — build the RAG pipeline with RAGAS evaluation</title>
<style>
/* ===== Week-1 shared palette (copy this block to every page) ===== */
:root{
  --bg:#121416;         /* page background */
  --bg2:#1a1d20;        /* card background */
  --bg3:#23272b;        /* inset / code background */
  --line:#2f343a;       /* hairline borders */
  --fg:#e8e6e1;         /* primary text  (contrast on --bg ≈ 13:1) */
  --fg2:#b4b0a8;        /* secondary text (≈ 8:1) */
  --fg3:#8c8880;        /* tertiary text  (≈ 5:1) */
  --amber:#f2a83b;      /* THE one accent */
  --amber2:#ffd089;     /* lighter amber for text on dark */
  --amber-dim:rgba(242,168,59,.14);
  --ok:#9fd3a5;         /* soft success (used sparingly, never a theme) */
  --bad:#e08a8a;        /* soft error */
  --radius:14px;
  --maxw:1180px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--amber2);text-decoration-color:rgba(255,208,137,.45)}
a:hover{text-decoration-color:var(--amber2)}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:650;letter-spacing:-.01em}
h1{font-size:clamp(34px,4vw,52px)}
h2{font-size:clamp(26px,2.6vw,34px);margin-top:0}
h3{font-size:21px;color:var(--amber2)}
p{margin:.6em 0}
code,kbd,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--bg3);padding:.1em .4em;border-radius:5px;color:var(--amber2)}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;padding:0 .45em;border-radius:5px;font-size:.85em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171a1d,var(--bg))}
header.top .wrap{padding-top:28px;padding-bottom:36px}
.crumbs{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--fg3);font-size:15px;margin-bottom:22px}
.crumbs .pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--fg2)}
.crumbs .pill.accent{border-color:rgba(242,168,59,.5);color:var(--amber2);background:var(--amber-dim)}
.crumbs a{color:var(--fg2)}
.lede{font-size:21px;color:var(--fg2);max-width:62ch}

section{padding:56px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
.card+.card{margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* analogy strip */
.analogy{display:grid;grid-template-columns:140px 1fr;gap:26px;align-items:start}
.analogy .glyph{font-size:72px;line-height:1;text-align:center;padding-top:6px;filter:saturate(.7)}
.metaphor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.metaphor div{background:var(--bg3);border-radius:10px;padding:12px 14px;font-size:16px}
.metaphor b{color:var(--amber2);display:block;margin-bottom:2px}

/* hook box */
.hook{border-left:4px solid var(--amber);background:var(--amber-dim);padding:20px 24px;border-radius:0 var(--radius) var(--radius) 0}
.hook .eyebrow{margin-bottom:6px}
.hook p{font-size:19px}

/* stepper controls (shared) */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 10px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:10px 18px;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:#2b3035;border-color:#3b4147}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1200}
.btn.primary:hover{background:#ffb84f}
.btn[aria-pressed="true"]{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.btn.attn{animation:pulse 1.4s ease-in-out infinite;border-color:var(--amber)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,168,59,.0)}50%{box-shadow:0 0 0 7px rgba(242,168,59,.28)}}
@media (prefers-reduced-motion:reduce){.btn.attn{animation:none;box-shadow:0 0 0 3px rgba(242,168,59,.4)}}
.counter{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);padding:8px 14px;border-radius:10px;min-width:260px}
.counter b{color:var(--amber2);font-weight:600}
.caption{min-height:3.2em;font-size:19px;color:var(--fg);margin:8px 0 0;padding:14px 18px;background:var(--bg3);border-radius:10px;border:1px solid var(--line)}
.caption .phase{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-right:10px;font-weight:700;vertical-align:middle}
.hint{font-size:15px;color:var(--fg3);margin-top:8px}

/* toggle look */
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:16px;cursor:pointer;user-select:none}
.toggle .track{width:46px;height:26px;border-radius:13px;background:#3a4047;position:relative;transition:background .2s;border:1px solid var(--line)}
.toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cfcbc3;transition:transform .2s}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle input:checked+.track{background:var(--amber)}
.toggle input:checked+.track::after{transform:translateX(20px);background:#1a1200}
.toggle input:focus-visible+.track{outline:3px solid var(--amber);outline-offset:3px}

/* fact boxes */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.fact .k{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.fact .v{font-size:19px;font-weight:600;color:var(--fg)}
.fact .d{font-size:15.5px;color:var(--fg2);margin-top:6px}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--fg2);vertical-align:middle;margin-left:4px;background:var(--bg3)}
.tag.doc{color:var(--amber2);border-color:rgba(242,168,59,.5)}
.tag.unv{color:var(--bad);border-color:rgba(224,138,138,.5)}
.tag.der{color:#b9c8e8;border-color:rgba(185,200,232,.5)}

/* uncertainty */
.uncertain{border:1px dashed rgba(224,138,138,.55);border-radius:var(--radius);padding:22px 26px;background:rgba(224,138,138,.05)}
.uncertain h3{color:var(--bad)}
.uncertain li{margin:.4em 0}

/* quiz */
.quiz .q{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:14px}
.quiz .q p{margin:0 0 10px;font-size:18px}
.quiz .ans{display:none;margin-top:12px;padding:14px 16px;background:var(--bg3);border-radius:10px;color:var(--fg2);font-size:17px;border-left:3px solid var(--amber)}
.quiz .q.open .ans{display:block}
.quiz .q.open .btn{background:var(--amber);color:#1a1200;border-color:var(--amber)}

footer{padding:40px 0 60px;color:var(--fg3);font-size:15px}
.navrow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
/* ===== page-specific: index ===== */
.phasebar{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin:18px 0 6px}
.phasebar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--fg3);text-decoration:none;font-weight:650;font-size:22px;padding:6px 4px;transition:background .15s,border-color .15s}
.phasebar a small{font-size:12px;font-weight:500;letter-spacing:.04em;color:inherit;text-align:center}
.phasebar a.avail{background:var(--amber);border-color:var(--amber);color:#1a1200}
.phasebar a.avail:hover{background:#ffb84f}
.phasebar a.done{background:var(--amber-dim);border-color:rgba(242,168,59,.6);color:var(--amber2)}
.phasebar a.done::after{content:"✓ done";font-size:11.5px;font-weight:600;letter-spacing:.04em}
.ticks{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-top:10px}
.ticks label{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--fg2);cursor:pointer;padding:4px 0}
.ticks input{width:18px;height:18px;accent-color:var(--amber);margin:0}
.progline{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:14px;color:var(--fg2);font-size:16px}
.progline .stat{font-family:var(--mono);color:var(--amber2)}
.bigcard p{font-size:18.5px;color:var(--fg2);margin:0}
.pagerow{display:grid;grid-template-columns:64px 1fr;gap:20px;align-items:start;padding:20px 24px}
.pagerow .num{font-size:40px;font-weight:700;line-height:1;color:var(--amber);font-family:var(--mono);text-align:center;padding-top:4px}
.pagerow h3{margin:0 0 4px;font-size:22px}
.pagerow h3 a{color:var(--amber2)}
.pagerow .desc{margin:0;font-size:17px;color:var(--fg)}
.pagerow .hookline{margin:6px 0 0;font-size:16.5px;color:var(--fg2);font-style:italic}
.pagerow.isdone{border-color:rgba(242,168,59,.5)}
.usegrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.usegrid ul{margin:.4em 0;padding-left:1.2em}
.usegrid li{margin:.4em 0;font-size:17px;color:var(--fg2)}
@media (max-width:900px){.usegrid{grid-template-columns:1fr}.phasebar,.ticks{grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}.phasebar a small{display:none}.pagerow{grid-template-columns:44px 1fr;gap:12px}.pagerow .num{font-size:30px}}
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="crumbs">
      <a href="0-index.html">Week 1 map</a>
      <span class="pill">Index</span>
      <span class="pill accent">Week 1 · Sections 1–5 + RAGAS</span>
      <span class="pill">Running metaphor: the student, the desk, the librarian, the examiner</span>
      <span style="margin-left:auto"><a href="1-foundations.html">Start: 1 · Foundations →</a></span>

    <h1>Week 1 — from "what is a token" to a graded RAG pipeline</h1>
    <p class="lede">Nine interactive pages, one running metaphor: a frozen student, a desk, a librarian and an examiner. Every page computes its numbers live and tells you which claims are documented, derived, common practice or unverified.</p>
    <p class="hint">Keyboard on every page: <kbd>→</kbd> step · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight. URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation.</p>
  </div>
</header>

<section id="outcome">
  <div class="wrap">
    <span class="eyebrow">What you'll be able to explain after this</span>
    <h2>The Week-1 outcome, in one paragraph</h2>
    <div class="card bigcard">
      <p>After Week 1 you can say, from first principles and with a toy example you can compute by hand: why a model never sees letters (BPE tokens, and what they cost); why 'similar' means a small angle, not a short distance (embeddings and cosine); what attention literally computes (Q·Kᵀ/√d_k, softmax, weighted V), why the √d_k is there, what the causal mask does, how multiple heads and N blocks stack, and why RoPE is needed at all; how logits become one token and why temperature 0 is not deterministic; what zero-shot, few-shot, chain-of-thought and ReAct physically put in the context window; how RAG makes the exam open-book in two phases with overlapping chunks and nearest-neighbour retrieval; how RAGAS splits every failure into a librarian bug or a student bug with four computable metrics; and how to run the whole thing as one script and predict which metric moves when you turn one dial.</p>
    </div>
  </div>
</section>

<section id="metaphor">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>One metaphor carries all nine pages</h2>
    <div class="card">
      <div class="metaphor">

const KEY = 'w1-progress';

  try {
    const a = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(a) && a.length === 9) return a.map(Boolean);
  } catch (e) { /* storage blocked or corrupt: fall through */ }

}
function saveProgress(arr, key = KEY) {

});
renderProgress(loadProgress());

(function selftest() {

  if (fails.length) console.error('SELFTEST FAIL: ' + fails.join('; '));

<body>
<header class="top">
  <div class="wrap">
    <div class="crumbs">
      <a href="0-index.html">Week 1 map</a>
      <span class="pill">Page 1 of 9</span>
      <span class="pill accent">Sections 1 · Foundations</span>
      <span class="pill">Running metaphor: the student, the desk, the librarian, the examiner</span>
      <span style="margin-left:auto"><a href="2-tokens.html">Next: Tokens →</a></span>
    </div>
    <h1>Foundations: where the LLM sits, and what "training" actually changes</h1>
    <p class="lede">Four nested words (AI ⊃ ML ⊃ DL ⊃ GenAI), one real difference (hand-written rules vs numbers tuned from data), and two phases that never overlap (training moves the numbers; inference uses them frozen). Every later page assumes you can say these out loud.</p>
    <p class="hint">Keyboard: <kbd>→</kbd> step · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight. URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation, <code>?t=seconds</code> maps onto steps.</p>
  </div>
</header>

<!-- ============ 1. ANALOGY ============ -->
<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>A student, a school, and an exam desk</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">🎓</div>
      <div>
        <p>Picture one <b>student</b>. Everything in Week 1 is about this student.</p>
        <p><b>Training</b> is the years of school: the student reads an enormous library, and each page nudges how they think a little. Nothing is copied into a notebook. What changes is the student's <em>instincts</em>: the settings in their head. In a model, those settings are billions of plain numbers called <b>parameters</b> (or weights).</p>
        <p><b>Inference</b> is exam day. The student's head is now fixed; school is over. You hand them a question, they answer from instinct, and they walk out having learned <em>nothing</em> from your exam. The only thing they can look at while answering is what is physically on the <b>desk</b>: that desk is the <b>context window</b> (page 6 and page 7 live on that desk).</p>
        <p>And the four nested words? They describe <em>what kind of student</em> this is: any clever system (AI) → one that picked up its skills from examples rather than a rulebook (ML) → using very deep stacks of simple arithmetic layers (DL) → and able to <em>write new things</em>, not just sort or label what it sees (GenAI).</p>
        <div class="metaphor">
          <div><b>The student</b>the LLM, with fixed parameters after training</div>
          <div><b>School years</b>training: read data, adjust numbers, repeat</div>
          <div><b>Exam day</b>inference: a forward pass with frozen numbers</div>
          <div><b>The desk</b>the context window: the only thing the student can consult</div>
          <div><b>The librarian</b>RAG (page 7): fetches the right pages onto the desk</div>
          <div><b>The examiner</b>RAGAS (page 8): grades the librarian and the student separately</div>
        </div>
      </div>
    </div>

    <div class="hook" style="margin-top:22px">
      <span class="eyebrow">The layer most people haven't seen</span>
      <p><b>Training does not store facts. It only turns dials.</b> A model that has "read the internet" keeps none of it as text. It keeps ~70 billion numbers that were nudged, page by page, so that the next-word guess got slightly less wrong. At inference time <em>not one</em> of those numbers moves: your prompt is read, an answer is produced, and the model is exactly the same object afterwards. Below you will watch a toy model's three dials move during training, then lock, then score a brand-new email without changing.</p>
    </div>
  </div>
</section>

<!-- ============ 2. NESTING DOLLS ============ -->
<section id="dolls-section">
  <div class="wrap">
    <span class="eyebrow">Interactive 1 · the four nested words</span>
    <h2>AI ⊃ ML ⊃ DL ⊃ GenAI: three yes/no questions decide the ring</h2>
    <p class="lede" style="max-width:none">Step through the rings, then click any example system. It travels inward and stops at the first question it answers "no" to. That stopping rule <em>is</em> the definition of each layer.</p>

    <div class="controls" role="group" aria-label="Nesting dolls animation controls">
      <button class="btn primary" id="dPlay" aria-label="Play nesting dolls animation">▶ Play</button>
      <button class="btn" id="dStep" aria-label="Advance one step">Step ›</button>
      <button class="btn" id="dReset" aria-label="Reset nesting dolls animation">Reset</button>
      <div class="counter" id="dCounter" aria-live="polite">Step 0 of 4</div>
    </div>
    <div class="caption" id="dCaption" aria-live="polite">Press Play or Step to build the picture ring by ring.</div>

    <div class="dolls-layout" style="margin-top:20px">
      <div class="card" style="padding:18px">
        <div class="dolls" id="dolls" aria-label="Four nested rings: AI contains ML contains DL contains GenAI" role="img">
          <div class="ring" id="rAI"><div class="lbl">Artificial Intelligence<small>any system that does something we'd call "smart"</small></div></div>
          <div class="ring" id="rML"><div class="lbl">Machine Learning<small>learns its rules from data instead of being handed them</small></div></div>
          <div class="ring" id="rDL"><div class="lbl">Deep Learning<small>ML built from many stacked layers (a neural network)</small></div></div>
          <div class="ring" id="rGen"><div class="lbl">Generative AI<small>deep models that create new content</small></div></div>
          <div class="doll-dot" id="dollDot"></div>
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:8px">The three gates</h3>
        <div class="gates" id="gates">
          <div class="gate" id="g1"><span class="n">Q1</span><span>Does it <b>learn its behaviour from data</b>, rather than from rules a human typed?</span><span class="ans">—</span></div>
          <div class="gate" id="g2"><span class="n">Q2</span><span>Is the learner a <b>deep stack of layers</b> (a neural network), not a shallow model?</span><span class="ans">—</span></div>
          <div class="gate" id="g3"><span class="n">Q3</span><span>Does it <b>generate new content</b> (text, image, code, audio) rather than label or score an input?</span><span class="ans">—</span></div>
        </div>
        <h3 style="margin:18px 0 4px">Sort a real system</h3>
        <div class="chips" id="chips" role="group" aria-label="Example systems to classify"></div>
        <div class="verdict" id="verdict">Click an example. Watch the dot walk inward and stop at the first "no".</div>
        <p class="hint">Click empty space or press <kbd>Esc</kbd> to clear the highlight.</p>
      </div>
    </div>

    <div class="card" style="margin-top:18px">
      <h3>One real system, all four rings at once <span class="tag">from the notes, §1</span></h3>
      <p style="color:var(--fg2)">A bank's fraud desk is what "AI engineer" work usually looks like: the rings are colleagues, not competitors.</p>
      <div class="flow" id="bankFlow">
        <div data-ring="rAI"><b>AI · hand-written rule</b>Block a card used in two countries within 10 minutes. Nobody learned this; someone typed it.</div>
        <div data-ring="rML"><b>ML · learned scorer</b>A gradient-boosted model scores each transaction 0–1 from ~200 structured features it learned weights for.</div>
        <div data-ring="rDL"><b>DL · perception</b>A convolutional network reads the cheque image and extracts the amount.</div>
        <div data-ring="rGen"><b>GenAI · writes</b>An LLM reads the customer's chat, extracts "unauthorised charge, urgency high" as fields, and drafts the reply a human reviews.</div>
      </div>
      <p class="hint">Hover a box to light its ring above.</p>
    </div>
  </div>
</section>
<!-- ============ 3. RULES VS LEARNING + TRAINING VS INFERENCE ============ -->
<section id="lab-section">
  <div class="wrap">
    <span class="eyebrow">Interactive 2 · the main animation</span>
    <h2>Rules vs learning, then training vs inference, on one spam filter</h2>
    <p class="lede" style="max-width:none">Eight real-looking emails. Left: you write the rules by hand. Right: a two-dial model <em>learns</em> its rules by nudging numbers to shrink its error, then freezes and scores a new email. Every number on screen is computed live from the eight rows.</p>

    <div class="card" style="margin-bottom:20px">
      <h3>The eight emails (shared by both sides)</h3>
      <table class="mails" id="mailTable" aria-label="Eight example emails with features and labels">
        <thead><tr><th>#</th><th>Email text</th><th title="count of spam-list words">x₁ spam-words</th><th title="count of exclamation marks">x₂ "!" count</th><th>Truth</th><th>Rules say</th><th>Model says</th></tr></thead>
        <tbody id="mailBody"></tbody>
      </table>
      <p class="hint">x₁ counts words from the allowlist <code>free money win winner prize offer click cash</code> (case-insensitive, letters only, so <code>Fr33</code> and <code>m0ney</code> do not count). x₂ counts <code>!</code> characters. Both columns are counts of the same thing, so they are comparable units. Click a row to see the model's arithmetic for it.</p>
    </div>

    <div class="lab">
      <!-- LEFT: hand-written rules -->
      <div class="card">
        <span class="eyebrow">Traditional software</span>
        <h3>You write the rules</h3>
        <p style="color:var(--fg2);font-size:16px">Tick a rule to add it. An email is marked spam if <em>any</em> ticked rule fires. Watch the "Rules say" column and the score.</p>
        <div class="rulebox" id="ruleBox">
          <label class="rule"><input type="checkbox" data-rule="r1" checked> <span><code>contains("free") or contains("money")</code></span></label>
          <label class="rule"><input type="checkbox" data-rule="r2"> <span><code>contains("winner") or contains("prize")</code></span></label>
          <label class="rule"><input type="checkbox" data-rule="r3"> <span><code>contains("cash") or contains("click")</code></span></label>
          <label class="rule"><input type="checkbox" data-rule="r4"> <span><code>count("!") &gt;= 2</code></span></label>
          <label class="rule"><input type="checkbox" data-rule="r5"> <span><code>not contains("friday")</code> &nbsp;<span class="hint" style="margin:0">(a patch for one false positive)</span></span></label>
        </div>
        <div class="score" id="ruleScore">4 / 8 <small>correct</small></div>
        <p id="ruleNote" style="color:var(--fg2);font-size:16px;margin-top:10px"></p>
      </div>

      <!-- RIGHT: learned model -->
      <div class="card">
        <span class="eyebrow">Machine learning · one timeline, two phases</span>
        <h3>The model turns its own dials</h3>
        <div class="phasebar" aria-hidden="true"><span id="ph1"></span><span id="ph2"></span></div>
        <div class="phaselbl" aria-hidden="true"><span>Training · dials move</span><span>Inference · dials frozen</span></div>

        <div class="controls" role="group" aria-label="Training and inference animation controls">
          <button class="btn primary" id="tPlay" aria-label="Play training animation">▶ Play</button>
          <button class="btn" id="tStep" aria-label="Advance one step">Step ›</button>
          <button class="btn" id="tReset" aria-label="Reset training animation">Reset</button>
          <div class="counter" id="tCounter" aria-live="polite">Step 0 of 11</div>
        </div>
        <div class="caption" id="tCaption" aria-live="polite"><span class="phase">Training</span>All dials start at 0: the model guesses 50 % spam for every email. Loss = ln 2 = 0.693.</div>

        <div class="weights" aria-label="Model parameters">
          <div class="w" id="w1box"><div class="k">w₁ · spam-words</div><div class="v" id="w1v">0.000</div><div class="bar"><i id="w1bar"></i></div></div>
          <div class="w" id="w2box"><div class="k">w₂ · "!" count</div><div class="v" id="w2v">0.000</div><div class="bar"><i id="w2bar"></i></div></div>
          <div class="w" id="bbox"><div class="k">b · bias</div><div class="v" id="bv">0.000</div><div class="bar"><i id="bbar"></i></div></div>
        </div>
        <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:baseline">
          <div class="score" id="modelScore">4 / 8 <small>correct</small></div>
          <div class="score" style="font-size:22px" id="lossV">loss 0.693 <small>mean cross-entropy</small></div>
          <div class="score" style="font-size:22px" id="epochV">epoch 0 <small>of 24</small></div>
        </div>

        <svg class="plot" id="plot" viewBox="0 0 420 300" role="img" aria-label="Scatter plot of the eight emails by spam-word count and exclamation count, with the learned decision boundary"></svg>
        <p class="hint">Dots: amber = truly spam, blue = truly not. Red outline = currently misclassified. The dashed line is where the model's score is exactly 0.5: <code>w₁·x₁ + w₂·x₂ + b = 0</code>. Shaded side = "spam".</p>

        <div class="math" id="mathBox">Click an email row above to see  z = w₁·x₁ + w₂·x₂ + b  and  p = 1 / (1 + e^(−z))  for it.</div>

        <div class="infer" id="inferBox">
          <label for="newMail" style="display:block;font-size:15px;color:var(--fg2);margin-bottom:6px">Inference: a <b>new</b> email the model has never seen. Edit it; the dials will not move.</label>
          <input type="text" id="newMail" value="WIN a free prize now!!" aria-describedby="inferOut">
          <div class="math" id="inferOut" style="margin-top:8px"></div>
        </div>
      </div>
    </div>

    <div class="grid2" style="margin-top:20px">
      <div class="card">
        <h3>What "learning" was, concretely</h3>
        <p style="color:var(--fg2)">Each epoch the model did one thing: for every email, compare its guess <code>p</code> to the truth <code>y</code>, and move each dial a little against the error.<br>
        <code>w ← w − 0.5 · mean((p − y) · x)</code> <span class="tag der">DERIVED</span><br>
        That is the whole of "training", at toy scale. A real LLM replaces 3 dials with billions and "spam/not" with "which of ~100 k tokens comes next" (page 2 and page 5), but the loop is the same: forward pass → loss → nudge → repeat.</p>
      </div>
      <div class="card">
        <h3>Why the rules side keeps losing</h3>
        <p style="color:var(--fg2)">Every rule you ticked was a pattern a human had to notice first. <code>Fr33 m0ney</code> defeats the word rules forever, and the <code>friday</code> patch is the start of an unmaintainable pile. The learned model never saw a rule; it found that two counts and a threshold separate the data, and would re-find a new threshold if the data changed. That generalisation is the entire reason ML exists. (It also fails on data unlike its training set: there is no magic here, only fitted numbers.)</p>
      </div>
    </div>
  </div>
</section>

<!-- ============ 4. FACTS ============ -->
<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">Parameter / weight</div><div class="v">One learned number</div><div class="d">A model is a pile of numbers set during training and frozen afterwards. "8B", "70B", "1.6T" in a model name are parameter counts. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">70B parameters in 16-bit floats</div><div class="v">≈ 140 GB of weights</div><div class="d">70 × 10⁹ numbers × 2 bytes each = 140 × 10⁹ bytes. This is why a 70B model does not fit on one 80 GB GPU without quantisation. <span class="tag der">DERIVED</span></div></div>
      <div class="fact"><div class="k">Training</div><div class="v">Paid once · weights move</div><div class="d">Weeks or months of GPUs reading data and nudging weights to reduce a loss. The "school years" in the metaphor. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Inference</div><div class="v">Paid per request · weights frozen</div><div class="d">A forward pass with fixed weights. When you use a chat assistant you are always here. The model keeps nothing from the conversation (page 6 shows why that makes the prompt the only memory). <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Neural network</div><div class="v">Layers of multiply-add + a bend</div><div class="d">Each layer multiplies its input by a weight matrix, adds a bias, and applies a simple non-linear function. "Deep" = many such layers stacked. Page 4 shows the specific layer LLMs use. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Foundation model</div><div class="v">Trained once, reused for many tasks</div><div class="d">A large model pre-trained on broad data that you adapt by prompting (page 6), retrieval (page 7), or fine-tuning, instead of training from scratch per task. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Rules vs learning</div><div class="v">Who wrote the if-statement?</div><div class="d">Rules: a human typed the condition. ML: the condition (a threshold on learned weights) fell out of data. Both are "AI" in the widest ring. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Best 1-hour intro</div><div class="v">Karpathy, "Intro to Large Language Models"</div><div class="d"><a href="https://www.youtube.com/watch?v=zjkBMFhNj_g">youtube.com/watch?v=zjkBMFhNj_g</a> <span class="tag doc">DOC</span> (link as given in the notes, §1)</div></div>
    </div>
  </div>
</section>

<!-- ============ 5. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li><b>The rings have fuzzy edges.</b> "GenAI ⊂ DL" is true for every model you will meet in interviews, but older generative methods (n-gram language models, Markov chains) generated text without deep networks. Say "modern GenAI is deep learning", not "all generation is deep learning".</li>
        <li><b>"AI = rules" is shorthand.</b> The outer ring also contains search, planning and logic systems (chess engines, A* route planners). The honest contrast is <em>hand-specified behaviour</em> vs <em>behaviour fitted from data</em>.</li>
        <li><b>Specific parameter counts are model-card facts, not derivations.</b> The notes say Llama 3 70B has 70.6 B parameters; treat that figure as <span class="tag unv">UNVERIFIED</span> here until you check the model card yourself. The 140 GB arithmetic above is only as good as the 70 B input.</li>
        <li><b>The toy filter is logistic regression, not a neural network.</b> It is ML (ring 2), chosen because three dials are checkable by hand. Deep learning adds more layers between input and output; the training loop is unchanged.</li>
        <li><b>"Inference changes nothing" is true of the weights, not of every production system.</b> Logs, caches and fine-tuning jobs can feed later training. The model object serving your request does not change mid-conversation.</li>
      </ul>
    </div>
  </div>
</section>

<!-- ============ 6. QUIZ ============ -->
<section id="quiz">
  <div class="wrap quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. An interviewer says "so the model memorised Wikipedia." Correct them in two sentences using the dials picture.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Training did not copy any text into the model; it adjusted billions of numeric weights so the next-token guess got less wrong on Wikipedia and everything else. What survives is the dial settings, which is why the model can paraphrase facts fluently and also state them wrongly: there is no stored page to look up. (Page 7 shows how RAG puts the actual page back on the desk.)</div></div>
    <div class="q"><p>2. A gradient-boosted fraud scorer with 200 hand-engineered features: which ring, and why not the next one in?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Machine Learning. It passed gate 1 (its decision thresholds were fitted from labelled transactions) but fails gate 2: gradient-boosted trees are not a deep stack of neural layers. In the bank example it sits beside a convolutional network (DL) and an LLM (GenAI) as colleagues.</div></div>
    <div class="q"><p>3. In the lab, why could the learned model catch <code>Fr33 m0ney inside!!!!</code> when the word rules could not?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">The word rules only fire on exact strings a human anticipated; the obfuscation defeats them. The model learned a positive weight on the "!" count from the other spam rows, so four exclamation marks alone push z above 0 (check: with the final dials, z = w₂·4 + b is positive). It generalised from a feature nobody wrote a rule about.</div></div>
    <div class="q"><p>4. In the inference phase you edited the new email. What changed, and what did not?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">The features x₁, x₂ and the output p changed; w₁, w₂ and b did not move at all. That is the training/inference split: inference is a forward pass with frozen weights, paid per request. Page 6 builds on this: because nothing persists, the prompt is the model's only working memory.</div></div>
    <div class="q"><p>5. Why does a 70B model not fit on an 80 GB GPU in 16-bit precision? Show the arithmetic.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">70 × 10⁹ parameters × 2 bytes per 16-bit number = 140 × 10⁹ bytes ≈ 140 GB, before any activations or KV cache. So it needs at least two such GPUs, or fewer bits per weight (quantisation). The "70B" figure itself is a model-card claim you should verify.</div></div>
    <div class="q"><p>6. Which gate does "speech-to-text" stop at, and what single change would move it one ring inward?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">It passes gates 1 and 2 (learned, deep network) and stops at gate 3: it labels audio with text rather than creating new content, so it is Deep Learning. Make the same kind of network <em>produce</em> speech or free text from a prompt and it becomes Generative AI. Page 5 shows the generation loop that makes the difference.</div></div>
  </div>
</section>

<script>
/* =====================================================================

   ===================================================================== */
const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const REDUCED = STILL || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (STILL) {
  const s = document.createElement('style');

  document.head.appendChild(s);
}
/* ?scrollto=<id>: bring a section to the top (used for headless screenshots; shifts instead of scrolling) */
if (Q.has('scrollto')) window.addEventListener('load', () => {
  const el = document.getElementById(Q.get('scrollto'));
  if (el) { const top = el.getBoundingClientRect().top + window.scrollY; document.body.style.marginTop = (-top) + 'px'; }

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 3) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);

/* Stepper: Play / Step / Reset with "Step N of M — caption".
   steps[k-1] is applied when at step k (1..M); step 0 is the reset state.
   render(k) must be idempotent: it draws the full state for step k.          */
function Stepper(o) {
  const M = o.steps.length;
  let k = 0, timer = null;
  const api = {
    get k() { return k; }, M,
    go(n, {silent = false} = {}) {
      k = clamp(n, 0, M);
      const st = k ? o.steps[k - 1] : null;
      o.counter.innerHTML = `Step <b>${k}</b> of ${M}` + (st && st.short ? ` — ${st.short}` : '');
      o.caption.innerHTML = (st && st.phase ? `<span class="phase">${st.phase}</span>` : '') + (st ? st.caption : o.resetCaption);
      o.render(k, silent);
      if (k >= M) api.pause();
    },
    step() { if (k >= M) return; api.go(k + 1); },
    play() {
      if (STILL) { api.step(); return; }          // ?still: Play degrades to a single Step
      if (timer) { api.pause(); return; }
      if (k >= M) api.go(0);
      o.play.setAttribute('aria-pressed', 'true'); o.play.textContent = '❚❚ Pause';
      api.step();
      timer = setInterval(() => { if (k >= M) api.pause(); else api.step(); }, o.interval || 2200);
    },
    pause() {
      if (timer) clearInterval(timer); timer = null;
      o.play.setAttribute('aria-pressed', 'false'); o.play.textContent = '▶ Play';
    },
    reset() { api.pause(); api.go(0); }
  };
  o.play.addEventListener('click', api.play);
  o.step.addEventListener('click', () => { api.pause(); api.step(); });
  o.reset.addEventListener('click', api.reset);
  api.go(0, {silent: true});
  return api;
}

/* Quiz reveal */
document.querySelectorAll('.quiz .q .btn').forEach(b => b.addEventListener('click', () => {
  const q = b.closest('.q'), open = !q.classList.contains('open');

/* Global "ways back": Esc and click-on-empty-space clear any focused/highlighted state */

/* =====================================================================

const RINGS = ['rAI', 'rML', 'rDL', 'rGen'];

/* example systems: answers to the three gates, in order */

  {name: 'Recommendations by matrix factorisation', a: [true, false], why: 'learned user and item vectors from clicks, with a shallow model, not a deep network.'},
  {name: 'The toy spam filter further down this page', a: [true, false], why: 'three dials fitted from eight emails; one layer, so ML but not deep.'},
  {name: 'Face ID (convolutional network)', a: [true, true, false], why: 'a deep network learned from face images, but its output is a match / no-match label, not new content.'},

  {name: 'ChatGPT / Claude drafting an email', a: [true, true, true], why: 'a deep network, fitted from data, that writes text that did not exist before. The LLM student.'},

function clearGates() {

}
function setGate(i, yes) {
  const g = $(GATE_IDS[i]); g.classList.remove('active'); g.classList.add('answered');
  const a = g.querySelector('.ans'); a.textContent = yes ? 'YES' : 'NO'; a.className = 'ans ' + (yes ? 'yes' : 'no');
}
function moveDot(i) { const [x, y] = DOT_POS[i]; const d = $('dollDot'); d.style.left = `calc(${x}% - 6px)`; d.style.top = `calc(${y}% - 6px)`; d.classList.add('on'); }
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));

}
EXAMPLES.forEach(ex => {

  b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', 'Classify: ' + ex.name);

  $('dReset').classList.remove('attn');

}
clearers.push(clearDollFocus);
$('dReset').addEventListener('click', clearDollFocus);
$('dolls').addEventListener('click', e => { if (e.target === e.currentTarget || e.target.classList.contains('ring')) clearDollFocus(); });

/* bank example: hover lights the matching ring */
document.querySelectorAll('#bankFlow div').forEach(d => {
  const on = () => { if (dolls.k < 4) dolls.go(4); RINGS.forEach(id => { $(id).classList.toggle('lit', id === d.dataset.ring); $(id).classList.toggle('dim', id !== d.dataset.ring); }); d.classList.add('lit'); };

});

/* =====================================================================
   Interactive 2 — rules vs learning, training then inference (main animation)
   ===================================================================== */
const SPAM_WORDS = ['free', 'money', 'win', 'winner', 'prize', 'offer', 'click', 'cash'];
const MAILS = [
  {t: 'FREE MONEY — click now!!!', y: 1},
  {t: 'You are a WINNER! Claim your prize', y: 1},
  {t: 'Cash offer: win big, click here!!', y: 1},
  {t: 'Fr33 m0ney inside!!!!', y: 1},
  {t: 'Lunch is free on Friday, team', y: 0},
  {t: 'Meeting moved to 3pm', y: 0},
  {t: 'Can you review my PR today?', y: 0},
  {t: 'Great job on the demo!', y: 0}
];
/* features are computed from the text, never hard-coded */
function words(t) { return t.toLowerCase().match(/[a-z]+/g) || []; }
function feats(t) { return [words(t).filter(w => SPAM_WORDS.includes(w)).length, (t.match(/!/g) || []).length]; }
MAILS.forEach(m => { const [x1, x2] = feats(m.t); m.x1 = x1; m.x2 = x2; });

const RULES = {
  r1: m => /free|money/i.test(words(m.t).join(' ')),
  r2: m => /winner|prize/i.test(words(m.t).join(' ')),
  r3: m => /\b(cash|click)\b/i.test(words(m.t).join(' ')),
  r4: m => m.x2 >= 2,
  r5: null // modifier: negates spam verdict if "friday" present
};

/* build the table */
const tb = $('mailBody');
MAILS.forEach((m, i) => {
  const tr = document.createElement('tr'); tr.dataset.i = i; tr.tabIndex = 0;
  tr.innerHTML = `<td class="num">${i + 1}</td><td class="txt">${m.t}</td><td class="num">${m.x1}</td><td class="num">${m.x2}</td><td class="truth">${m.y ? 'spam' : 'not spam'}</td><td class="pred" id="rp${i}">—</td><td class="pred" id="mp${i}">—</td>`;
  tr.addEventListener('click', () => selectRow(i));
  tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRow(i); } });
  tb.appendChild(tr);
});

/* ---- left side: hand-written rules ---- */
function rulesVerdict(m, on) {
  let spam = ['r1', 'r2', 'r3', 'r4'].some(r => on[r] && RULES[r](m));
  if (on.r5 && /friday/i.test(m.t)) spam = false;
  return spam;
}
function renderRules() {
  const on = {}; document.querySelectorAll('#ruleBox input').forEach(c => on[c.dataset.rule] = c.checked);
  let correct = 0, missed = [], fp = [];
  MAILS.forEach((m, i) => {
    const s = rulesVerdict(m, on), ok = (s ? 1 : 0) === m.y; if (ok) correct++;
    const td = $('rp' + i); td.textContent = (s ? 'spam' : 'not') + (ok ? ' ✓' : ' ✗'); td.className = 'pred ' + (ok ? 'ok' : 'bad');
    if (!ok && m.y) missed.push(i + 1); if (!ok && !m.y) fp.push(i + 1);
  });
  $('ruleScore').innerHTML = `${correct} / 8 <small>correct · ${Object.values(on).filter(Boolean).length} rule${Object.values(on).filter(Boolean).length === 1 ? '' : 's'} written</small>`;
  let note = '';
  if (missed.length) note += `Missed spam: #${missed.join(', #')}. `;
  if (fp.length) note += `Flagged real mail: #${fp.join(', #')}. `;
  if (correct === 8) note = 'All eight correct, but it took every rule, including a one-off patch for "friday". The ninth email ("Fr33 pr1ze" with one "!") will break it, and a human must notice and type the next rule.';
  else if (!missed.includes(4) && on.r4) note += 'Note that #4 ("Fr33 m0ney") is only caught by the "!" rule. No word rule can ever catch leetspeak you have not seen yet.';
  $('ruleNote').textContent = note;
}
document.querySelectorAll('#ruleBox input').forEach(c => c.addEventListener('change', renderRules));

/* ---- right side: logistic regression trained live ---- */
const LR = 0.5, EPOCHS_PER_STEP = 3, TRAIN_STEPS = 8;    // 24 epochs total
const sig = z => 1 / (1 + Math.exp(-z));
function trainTo(epochs) {                                 // recompute from zero each time → idempotent
  let w1 = 0, w2 = 0, b = 0;
  for (let e = 0; e < epochs; e++) {
    let g1 = 0, g2 = 0, gb = 0;
    MAILS.forEach(m => { const d = sig(w1 * m.x1 + w2 * m.x2 + b) - m.y; g1 += d * m.x1; g2 += d * m.x2; gb += d; });
    w1 -= LR * g1 / 8; w2 -= LR * g2 / 8; b -= LR * gb / 8;
  }
  return {w1, w2, b, epochs};
}
let W = trainTo(0), selectedRow = -1, frozen = false;
function lossOf(w) { return MAILS.reduce((s, m) => { const p = sig(w.w1 * m.x1 + w.w2 * m.x2 + w.b); return s - (m.y * Math.log(p) + (1 - m.y) * Math.log(1 - p)); }, 0) / 8; }

function setBar(id, v, lo, hi) {               // draws a signed bar with zero at the midpoint of [lo,hi]
  const bar = $(id), zero = (0 - lo) / (hi - lo) * 100, pos = clamp((v - lo) / (hi - lo) * 100, 0, 100);
  bar.style.left = Math.min(zero, pos) + '%'; bar.style.width = Math.abs(pos - zero) + '%';
}
function renderModel() {
  $('w1v').textContent = fmt(W.w1); $('w2v').textContent = fmt(W.w2); $('bv').textContent = fmt(W.b);
  setBar('w1bar', W.w1, -2, 2); setBar('w2bar', W.w2, -2, 2); setBar('bbar', W.b, -2, 2);
  ['w1box', 'w2box', 'bbox'].forEach(id => $(id).classList.toggle('locked', frozen));
  let correct = 0;
  MAILS.forEach((m, i) => {
    const p = sig(W.w1 * m.x1 + W.w2 * m.x2 + W.b), s = p >= 0.5, ok = (s ? 1 : 0) === m.y; if (ok) correct++;
    const td = $('mp' + i); td.textContent = `p=${p.toFixed(2)} ${ok ? '✓' : '✗'}`; td.className = 'pred ' + (ok ? 'ok' : 'bad');
  });
  $('modelScore').innerHTML = `${correct} / 8 <small>correct</small>`;
  $('lossV').innerHTML = `loss ${fmt(lossOf(W))} <small>mean cross-entropy</small>`;
  $('epochV').innerHTML = `epoch ${W.epochs} <small>of ${EPOCHS_PER_STEP * TRAIN_STEPS}</small>`;
  drawPlot(); renderMath(); renderInfer();
}

/* scatter plot + boundary, all from W */
const PL = {x0: 46, y0: 16, w: 350, h: 240, xmax: 5, ymax: 5};
const px = x => PL.x0 + x / PL.xmax * PL.w, py = y => PL.y0 + PL.h - y / PL.ymax * PL.h;
function drawPlot() {
  const s = $('plot'); let out = '';
  for (let i = 0; i <= PL.xmax; i++) out += `<line x1="${px(i)}" y1="${PL.y0}" x2="${px(i)}" y2="${PL.y0 + PL.h}" stroke="#2f343a"/><text x="${px(i)}" y="${PL.y0 + PL.h + 14}" text-anchor="middle">${i}</text>`;
  for (let j = 0; j <= PL.ymax; j++) out += `<line x1="${PL.x0}" y1="${py(j)}" x2="${PL.x0 + PL.w}" y2="${py(j)}" stroke="#2f343a"/><text x="${PL.x0 - 8}" y="${py(j) + 4}" text-anchor="end">${j}</text>`;
  out += `<text x="${PL.x0 + PL.w / 2}" y="${PL.y0 + PL.h + 30}" text-anchor="middle">x₁ = spam-word count</text>`;
  out += `<text transform="translate(12 ${PL.y0 + PL.h / 2}) rotate(-90)" text-anchor="middle">x₂ = "!" count</text>`;
  /* boundary w1 x + w2 y + b = 0, clipped to the plot box; shade the spam side */
  if (Math.abs(W.w1) > 1e-9 || Math.abs(W.w2) > 1e-9) {
    const pts = [];
    const tryAdd = (x, y) => { if (x >= -1e-9 && x <= PL.xmax + 1e-9 && y >= -1e-9 && y <= PL.ymax + 1e-9) pts.push([x, y]); };
    if (Math.abs(W.w2) > 1e-9) { tryAdd(0, -W.b / W.w2); tryAdd(PL.xmax, -(W.b + W.w1 * PL.xmax) / W.w2); }
    if (Math.abs(W.w1) > 1e-9) { tryAdd(-W.b / W.w1, 0); tryAdd(-(W.b + W.w2 * PL.ymax) / W.w1, PL.ymax); }
    const uniq = pts.filter((p, i) => pts.findIndex(q => Math.abs(q[0] - p[0]) < 1e-6 && Math.abs(q[1] - p[1]) < 1e-6) === i);
    if (uniq.length >= 2) {
      const [a, c] = uniq;
      /* spam-side polygon: corners of the box where z>0 plus the two boundary points, sorted by angle */
      const corners = [[0, 0], [PL.xmax, 0], [PL.xmax, PL.ymax], [0, PL.ymax]].filter(([x, y]) => W.w1 * x + W.w2 * y + W.b > 0);
      const poly = [...corners, a, c]; const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length, cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
      poly.sort((p, q) => Math.atan2(p[1] - cy, p[0] - cx) - Math.atan2(q[1] - cy, q[0] - cx));
      out += `<polygon class="shade" points="${poly.map(([x, y]) => px(x) + ',' + py(y)).join(' ')}"/>`;
      out += `<line class="boundary" x1="${px(a[0])}" y1="${py(a[1])}" x2="${px(c[0])}" y2="${py(c[1])}"/>`;
    }
  } else {
    out += `<text x="${PL.x0 + PL.w / 2}" y="${PL.y0 + PL.h / 2}" text-anchor="middle" style="font-size:13px;fill:#b4b0a8">all dials at 0 → no boundary yet, p = 0.5 everywhere</text>`;
  }
  /* points (jitter identical coordinates slightly so both are visible) */
  const seen = {};
  MAILS.forEach((m, i) => {
    const key = m.x1 + ',' + m.x2, n = seen[key] = (seen[key] || 0) + 1;
    const p = sig(W.w1 * m.x1 + W.w2 * m.x2 + W.b), wrong = ((p >= 0.5) ? 1 : 0) !== m.y;
    out += `<circle class="pt ${m.y ? 'spam' : 'ham'} ${wrong ? 'wrong' : ''}" cx="${px(m.x1) + (n - 1) * 9}" cy="${py(m.x2)}" r="${i === selectedRow ? 10 : 7}"><title>#${i + 1} ${m.t}</title></circle>`;
    out += `<text x="${px(m.x1) + (n - 1) * 9}" y="${py(m.x2) - 11}" text-anchor="middle" style="fill:#e8e6e1">${i + 1}</text>`;
  });
  s.innerHTML = out;
}

function selectRow(i) {
  selectedRow = (selectedRow === i) ? -1 : i;
  document.querySelectorAll('#mailBody tr').forEach(tr => tr.classList.toggle('sel', +tr.dataset.i === selectedRow));
  $('tReset').classList.toggle('attn', selectedRow >= 0);
  drawPlot(); renderMath();
}
clearers.push(() => { if (selectedRow >= 0) selectRow(selectedRow); });

function renderMath() {
  const box = $('mathBox');
  if (selectedRow < 0) { box.innerHTML = 'Click an email row above to see  z = w₁·x₁ + w₂·x₂ + b  and  p = 1 / (1 + e^(−z))  for it.'; return; }
  const m = MAILS[selectedRow], z = W.w1 * m.x1 + W.w2 * m.x2 + W.b, p = sig(z), pred = p >= 0.5;
  box.innerHTML = `<b>#${selectedRow + 1}</b> "${m.t}"   truth: ${m.y ? 'spam' : 'not spam'}
z = w₁·x₁ + w₂·x₂ + b = ${fmt(W.w1)}·${m.x1} + ${fmt(W.w2)}·${m.x2} + (${fmt(W.b)}) = <b>${fmt(z)}</b>
p = 1 / (1 + e^(−z)) = 1 / (1 + ${fmt(Math.exp(-z))}) = <b>${fmt(p)}</b>  →  ${pred ? 'spam' : 'not spam'} ${((pred ? 1 : 0) === m.y) ? '✓' : '✗'}
error (p − y) = ${fmt(p - m.y)}  → next nudge: w₁ −= 0.5·(p−y)·x₁/8, w₂ −= 0.5·(p−y)·x₂/8, b −= 0.5·(p−y)/8`;
}

function renderInfer() {
  const box = $('inferBox'); box.classList.toggle('show', frozen);
  if (!frozen) return;
  const t = $('newMail').value, [x1, x2] = feats(t), z = W.w1 * x1 + W.w2 * x2 + W.b, p = sig(z);
  $('inferOut').innerHTML = `features from the text: x₁ = ${x1} spam-word${x1 === 1 ? '' : 's'}, x₂ = ${x2} "!"
z = ${fmt(W.w1)}·${x1} + ${fmt(W.w2)}·${x2} + (${fmt(W.b)}) = <b>${fmt(z)}</b>   p = <b>${fmt(p)}</b>  →  <b>${p >= 0.5 ? 'spam' : 'not spam'}</b>
dials before: (${fmt(W.w1)}, ${fmt(W.w2)}, ${fmt(W.b)})   dials after: (${fmt(W.w1)}, ${fmt(W.w2)}, ${fmt(W.b)})   changed: <b>none</b> 🔒`;
}
$('newMail').addEventListener('input', renderInfer);

/* the one timeline: training steps 1–8, inference steps 9–11 */
const trainSteps = [];
for (let s = 1; s <= TRAIN_STEPS; s++) {
  const w = trainTo(s * EPOCHS_PER_STEP), prev = trainTo((s - 1) * EPOCHS_PER_STEP);
  const correct = MAILS.filter(m => ((sig(w.w1 * m.x1 + w.w2 * m.x2 + w.b) >= 0.5) ? 1 : 0) === m.y).length;
  let cap = `Epochs ${(s - 1) * EPOCHS_PER_STEP + 1}–${s * EPOCHS_PER_STEP}: for each of the 8 emails compute p, compare with the truth, nudge every dial against the error. Loss ${fmt(lossOf(prev))} → <b>${fmt(lossOf(w))}</b>; ${correct}/8 correct.`;
  if (s === 1) cap = `Epochs 1–3: the model sees spam rows have more spam-words and more "!", so both weights move up from 0 (w₁ → ${fmt(w.w1)}, w₂ → ${fmt(w.w2)}). Loss ${fmt(lossOf(prev))} → <b>${fmt(lossOf(w))}</b>. The dashed boundary appears.`;
  if (correct === 8 && MAILS.filter(m => ((sig(prev.w1 * m.x1 + prev.w2 * m.x2 + prev.b) >= 0.5) ? 1 : 0) === m.y).length < 8) cap += ' <b>All eight now sit on the right side of the line</b>, including the leetspeak #4, which no word rule could catch.';
  if (s === TRAIN_STEPS) cap += ' Training stops here: more epochs would only sharpen the same boundary.';
  trainSteps.push({phase: 'Training', short: `epoch ${s * EPOCHS_PER_STEP}`, caption: cap, epochs: s * EPOCHS_PER_STEP});
}
trainSteps.push({phase: 'Inference', short: 'freeze', caption: '<b>School is over.</b> The three dials are frozen (🔒). Everything from here on is a forward pass with these exact numbers. This is the state every chat assistant is in when you talk to it.', epochs: TRAIN_STEPS * EPOCHS_PER_STEP, freeze: true});
trainSteps.push({phase: 'Inference', short: 'new email', caption: 'A <b>new email</b> arrives (edit it below). Its features are counted, multiplied by the frozen dials, squashed to a probability. One pass, one answer, paid per request.', epochs: TRAIN_STEPS * EPOCHS_PER_STEP, freeze: true});
trainSteps.push({phase: 'Inference', short: 'nothing changed', caption: '<b>Look at the dials: identical before and after.</b> The model learned nothing from the new email. If you want it to improve, you go back to the training phase with new data. This is why, on page 6, the prompt will be the model\'s only memory.', epochs: TRAIN_STEPS * EPOCHS_PER_STEP, freeze: true});

function renderTrain(k) {
  const st = k ? trainSteps[k - 1] : null;
  W = trainTo(st ? st.epochs : 0); frozen = !!(st && st.freeze);
  const pct1 = Math.round(clamp(k / TRAIN_STEPS, 0, 1) * 100), pct2 = Math.round(clamp((k - TRAIN_STEPS) / (trainSteps.length - TRAIN_STEPS), 0, 1) * 100);
  $('ph1').style.background = `linear-gradient(90deg,var(--amber) ${pct1}%,#2f343a ${pct1}%)`;
  $('ph2').style.background = `linear-gradient(90deg,var(--amber) ${pct2}%,#2f343a ${pct2}%)`;

  renderModel();
}
const trainer = Stepper({
  steps: trainSteps, resetCaption: '<span class="phase">Training</span>All dials start at 0: the model guesses 50 % spam for every email. Loss = ln 2 = 0.693.',
  play: $('tPlay'), step: $('tStep'), reset: $('tReset'), counter: $('tCounter'), caption: $('tCaption'),
  render: renderTrain, interval: 2400
});
$('tReset').addEventListener('click', () => { if (selectedRow >= 0) selectRow(selectedRow); });
renderRules();

/* keyboard: main animation = trainer */
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement.tagName) && e.key !== 'Escape') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); trainer.pause(); trainer.step(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); trainer.pause(); trainer.go(trainer.k - 1); }
  else if (e.key === ' ') { e.preventDefault(); trainer.play(); }
  else if (e.key.toLowerCase() === 'r') { trainer.reset(); clearFocusStates(); }
});

/* URL params: ?step=N jumps the main animation; ?t=seconds maps onto its steps */
if (Q.has('step')) trainer.go(parseInt(Q.get('step'), 10) || 0);
else if (Q.has('t')) trainer.go(Math.floor((parseFloat(Q.get('t')) || 0) / 2.4));
if (Q.has('dolls')) dolls.go(parseInt(Q.get('dolls'), 10) || 0);
if (Q.has('sort')) { const n = clamp(parseInt(Q.get('sort'), 10) || 0, 0, EXAMPLES.length - 1); sortExample(EXAMPLES[n], document.querySelectorAll('.chip')[n]); }

<header class="top">
  <div class="wrap">

    </div>
    <h1>Tokens: the model has never seen a letter</h1>
    <p class="lede">Text is cut into numbered chunks by a stencil built from one rule: glue the most frequent adjacent pair. Watch the rule run on four words, then see why letter-counting and column arithmetic break, and why every bill and every context limit is quoted in chunks.</p>
    <p class="hint">Keyboard: <kbd>→</kbd> step · <kbd>←</kbd> back · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight. URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation, <code>?t=seconds</code> maps onto steps, <code>?view=chunks</code> turns on the chunk view at step 10.</p>

<!-- ============ 1. ANALOGY ============ -->
<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>A stencil between the exam sheet and the student</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">🔠</div>
      <div>
        <p>The <b>student</b> (page 1) never reads the exam sheet directly. Between the sheet and the student sits a <b>stencil</b> cut long before exam day: every piece of text is pushed through it and comes out as a sequence of numbered chunks. Common words fit one hole ("the" becomes one chunk); rare words are pushed through several holes ("antidisestablishmentarianism" becomes many).</p>
        <p>The stencil was cut during the school years by one rule, repeated thousands of times: <em>find the two adjacent pieces that occur together most often, and glue them into one new piece.</em> That rule is <b>Byte-Pair Encoding (BPE)</b>. The <b>desk</b> (context window) is measured in chunks, the bill is measured in chunks, and the student's blind spots, letters and digits, are exactly what the stencil hides.</p>
        <div class="metaphor">
          <div><b>The stencil</b>the tokenizer, frozen after it is built</div>
          <div><b>A hole</b>one token in the vocabulary (typically 32K–128K holes)</div>
          <div><b>Gluing two pieces</b>one BPE merge</div>
          <div><b>The bill</b>tokens × price per million</div>
          <div><b>What the stencil hides</b>letters and digit boundaries</div>
        </div>
      </div>
    </div>

    <div class="hook" style="margin-top:22px">
      <span class="eyebrow">The layer most people haven't seen</span>
      <p><b>The model has never seen a letter.</b> Before any text reaches the student it is cut into tokens by a fixed, frozen stencil (the tokenizer). "strawberry" arrives as a few opaque chunk-IDs, not as ten letters, so "how many r's?" is a question about something the student literally cannot see. Arithmetic breaks the same way: "12345" may be one chunk or several, and the split is decided by frequency in the training text, not by place value. Every price, context limit and speed figure you will ever read is quoted in these chunks.</p>
    </div>
  </div>
</section>

<!-- ============ 2. MAIN ANIMATION: BPE ============ -->
<section id="bpe-section">
  <div class="wrap">
    <span class="eyebrow">Interactive 1 · the main animation</span>
    <h2>Cutting the stencil: BPE merges computed live</h2>
    <p class="lede" style="max-width:none">Four words, each with a frequency. Every pair count on this page is computed by the script from the symbols you see, then the winning pair is glued everywhere. Click any pair in the table to light up where its count comes from.</p>

    <div class="controls" role="group" aria-label="BPE stencil animation controls">
      <button class="btn primary" id="bPlay" aria-label="Play BPE stencil animation">▶ Play</button>
      <button class="btn" id="bStep" aria-label="Advance one step">Step ›</button>
      <button class="btn" id="bReset" aria-label="Reset BPE stencil animation">Reset</button>
      <div class="counter" id="bCounter" aria-live="polite">Step 0 of 12</div>
    </div>
    <div class="caption" id="bCaption" aria-live="polite">Four words and 11 symbols. Press Step to count pairs.</div>

    <div class="bpe-grid">
      <div class="card">
        <div class="cardh"><h3>The corpus, as symbols</h3><span class="meta" id="corpusMeta"></span></div>
        <div class="corpus" id="corpus" role="group" aria-label="The four training words split into symbols"></div>
        <p class="legend"><span class="sym eow" style="min-width:24px;height:24px;font-size:13px" aria-hidden="true">▁</span> = the end-of-word marker <code>&lt;/w&gt;</code>. Grey boxes are single characters; amber boxes are symbols the stencil has learned by gluing.</p>
        <p class="algo"><b>The rule:</b> count every adjacent pair, weighted by word frequency; glue the most frequent pair into a new symbol everywhere; repeat. <b>Tie-break:</b> highest count wins; among equal counts, the pair met first when scanning the words in order (low, lower, newest, widest) left to right.</p>
      </div>
      <div class="card">
        <div class="cardh"><h3>Pair counts (top 6)</h3><span class="meta" id="pairMeta"></span></div>
        <div id="pairBox"></div>

        <p class="hint">Amber = learned by a merge (number = merge order). <span class="tag">COMMON PRACTICE</span> real vocabularies hold typically 32K–128K symbols.</p>
      </div>
    </div>

    <div class="card stage" id="stage" aria-live="polite">
      <div class="panel on" id="stP0"><div class="empty">Steps 9 to 12 run here. First the stencil is frozen, then new text is pushed through it: unseen words, then "strawberry", then digits, then the bill.</div></div>

      <div class="panel" id="stP9">
        <div class="cardh"><h3>Step 9 · push unseen words through the frozen stencil</h3><span class="meta">merges applied in learned order, one left-to-right pass each</span></div>
        <div id="encDemo"></div>
      </div>

      <div class="panel" id="stP10">

        <div class="trow" style="border-top:1px solid var(--line);margin-top:10px"><div class="lbl">this toy stencil<small>6 merges, none apply</small></div><div class="out"><div class="syms" id="strawToy"></div><div class="tr" id="strawToyN"></div></div></div>
      </div>

      <div class="panel" id="stP11">
        <div class="cardh"><h3>Step 11 · digits</h3><span class="meta">illustrative split, not a real tokenizer's output <span class="tag unv">UNVERIFIED</span></span></div>

      <div class="panel" id="stP12">

        <div class="bill" id="billBox"></div>

    </div>

    <div class="card" style="margin-top:18px">

</section>

<!-- ============ 5. FACTS ============ -->
<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">Token</div><div class="v">A chunk, not a word</div><div class="d">Sub-word pieces chosen by frequency. The notes give "Unbelievable" as Un / believ / able (3 tokens) and "cat" as 1; exact splits vary by tokenizer. <span class="tag unv">UNVERIFIED</span></div></div>
      <div class="fact"><div class="k">BPE</div><div class="v">Glue the most frequent adjacent pair; repeat</div><div class="d">Sennrich, Haddow &amp; Birch (2016) adapted BPE to build sub-word vocabularies: <a href="https://arxiv.org/abs/1508.07909">arxiv.org/abs/1508.07909</a>. The Hugging Face quicktour describes the same loop: <a href="https://huggingface.co/docs/tokenizers/quicktour">docs/tokenizers/quicktour</a>. <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">Vocabulary size</div><div class="v">typically 32K–128K</div><div class="d">Fixed when the stencil is built; every text maps into it. This page's toy stencil has <b id="f3n">17</b> symbols after 6 merges. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Rule of thumb</div><div class="v">1 token ≈ 4 characters ≈ ¾ word</div><div class="d"><span id="f4d">100 tokens ≈ 75 English words</span>. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Cost of reading</div><div class="v" id="f5v">5,000 tokens × $3/M = $0.015</div><div class="d">A 10-page PDF is about 5,000 tokens (500 per page). 1M tokens at $3/M is <span id="f5d">$3.00</span> per call. The $3/M figure is illustrative. <span class="tag der">DERIVED</span></div></div>
      <div class="fact"><div class="k">Why letters break</div><div class="v">The input is IDs, not characters</div><div class="d">Letter counting, spelling backwards and digit arithmetic all need something the model does not receive. <span class="tag">COMMON PRACTICE</span></div></div>
    </div>
    <div class="card" style="margin-top:20px">
      <div class="cardh"><h3>The real library, in the documented form</h3><span class="meta">output not asserted <span class="tag doc">DOC</span></span></div>
      <pre class="codeblk" tabindex="0" aria-label="Hugging Face tokenizers quicktour code"><code># pip install tokenizers
# → https://huggingface.co/docs/tokenizers/quicktour   (Hugging Face Tokenizers quicktour)
from tokenizers import Tokenizer
from tokenizers.models import BPE
from tokenizers.trainers import BpeTrainer
from tokenizers.pre_tokenizers import Whitespace

tokenizer = Tokenizer(BPE(unk_token="[UNK]"))
trainer = BpeTrainer(special_tokens=["[UNK]"])
tokenizer.pre_tokenizer = Whitespace()
tokenizer.train(["corpus.txt"], trainer)   # the quicktour trains from a list of files; put "low lower newest widest" in corpus.txt
print(tokenizer.encode("lowest").tokens)   # the exact output depends on the trainer's settings; not asserted here</code></pre>
    </div>
  </div>
</section>

<!-- ============ 6. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li><b>The 4-word corpus is the textbook example.</b> Real tokenizers train on gigabytes and run roughly 30k–100k merges <span class="tag">COMMON PRACTICE</span>. The algorithm is the same; the tie-break rule here (first pair met in corpus order) is one reasonable choice, not a standard. Alphabetical tie-breaking would pick a different sixth merge.</li>
        <li><b>"strawberry = 3 chunks" depends on the tokenizer, and we did not run a real one.</b> Say "a few opaque chunks", not a number, unless you checked at <a href="https://platform.openai.com/tokenizer">platform.openai.com/tokenizer</a>. The <code>#id</code> boxes in step 10 are an illustrative split <span class="tag unv">UNVERIFIED</span>, as is the <code>123 | 45</code> digit split in step 11.</li>
        <li><b>Modern tokenizers are byte-level BPE with pre-tokenization.</b> They start from 256 bytes (so any Unicode text works) and split on spaces and punctuation first. This page skips both.</li>
        <li><b>Prices change and differ by model.</b> Every dollar figure here is <span class="tag der">DERIVED</span> from the illustrative price on the slider; no vendor price is claimed.</li>
        <li><b>Tokens are the main reason letter counting fails, not the only one.</b> Training data and sampling (page 5) also matter.</li>
        <li><b>The code block under "the real library" is the documented quicktour form.</b> Its output is not asserted because it depends on trainer defaults.</li>
      </ul>
    </div>
  </div>
</section>

<!-- ============ 7. QUIZ ============ -->
<section id="quiz">
  <div class="wrap quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. Why can a model that writes flawless prose fail to count the r's in "strawberry"?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">It never receives letters; the tokenizer hands it a few chunk IDs. Any count it gives is a recalled pattern, not an observation. Page 1: inference uses frozen weights, nothing is looked up.</div></div>
    <div class="q"><p>2. In the toy corpus, why was <code>e s</code> merged before <code>l o</code> even though both are common?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Pair counts are frequency-weighted: <code>e s</code> occurs in newest (6) + widest (3) = 9; <code>l o</code> only in low (5) + lower (2) = 7. Highest count goes first.</div></div>
    <div class="q"><p>3. After the 6 merges, how many tokens is "lowest", and why does "newer" take 5?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">2 (<code>low</code>, <code>est&lt;/w&gt;</code>): both pieces were learned. "newer" only gets <code>ne</code>; the rest never co-occurred often enough, so it stays as single characters: <code>ne w e r &lt;/w&gt;</code>.</div></div>
    <div class="q"><p>4. A 1M-token prompt at $3/M: what does it cost per call, and which page fixes this?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">$3.00 per call (1,000,000 ÷ 1,000,000 × 3). Page 7 (RAG): retrieve only the relevant chunks instead of sending everything. The $3/M price is illustrative.</div></div>
    <div class="q"><p>5. An interviewer says "tokens are basically words". Correct them.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Tokens are sub-word pieces chosen by frequency: common words are single tokens, rare words split into several, and numbers split arbitrarily. Prices and context limits are in tokens, so the ratio (about ¾ word per token) matters for cost estimates.</div></div>
    <div class="q"><p>6. Page 1 said training "turns dials". What does training do to the tokenizer?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Nothing: the tokenizer is built once by counting pairs and is frozen before model training starts. The model's weights move; the stencil does not.</div></div>
  </div>
</section>

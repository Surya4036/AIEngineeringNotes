<script>
/* =====================================================================
   Week-1 shared helpers (copy to every page; keep each file self-contained)
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const REDUCED = STILL || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (STILL) {
  const s = document.createElement('style');
  s.textContent = 'html{scroll-behavior:auto!important}*,*::before,*::after{transition:none!important;animation:none!important}';
  document.head.appendChild(s);
}
/* ?scrollto=<id>: bring a section to the top (used for headless screenshots; shifts instead of scrolling) */
if (Q.has('scrollto')) window.addEventListener('load', () => {
  const el = document.getElementById(Q.get('scrollto'));
  if (el) { const top = el.getBoundingClientRect().top + window.scrollY; document.body.style.marginTop = (-top) + 'px'; }
});
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 3) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);

/* Stepper: Play / Step / Reset with "Step N of M — caption".
   steps[k-1] is applied when at step k (1..M); step 0 is the reset state.
   render(k) must be idempotent: it draws the full state for step k.          */
function Stepper(o) {
  const M = o.steps.length;
  let k = 0, timer = null;
  const api = {
    get k() { return k; }, M,
    go(n, {silent = false} = {}) {
      k = clamp(n, 0, M);
      const st = k ? o.steps[k - 1] : null;
      o.counter.innerHTML = `Step <b>${k}</b> of ${M}` + (st && st.short ? ` — ${st.short}` : '');
      o.caption.innerHTML = (st && st.phase ? `<span class="phase">${st.phase}</span>` : '') + (st ? st.caption : o.resetCaption);
      o.render(k, silent);
      if (k >= M) api.pause();
    },
    step() { if (k >= M) return; api.go(k + 1); },
    play() {
      if (STILL) { api.step(); return; }          // ?still: Play degrades to a single Step
      if (timer) { api.pause(); return; }
      if (k >= M) api.go(0);
      o.play.setAttribute('aria-pressed', 'true'); o.play.textContent = '❚❚ Pause';
      api.step();
      timer = setInterval(() => { if (k >= M) api.pause(); else api.step(); }, o.interval || 2200);
    },
    pause() {
      if (timer) clearInterval(timer); timer = null;
      o.play.setAttribute('aria-pressed', 'false'); o.play.textContent = '▶ Play';
    },
    reset() { api.pause(); api.go(0); }
  };
  o.play.addEventListener('click', api.play);
  o.step.addEventListener('click', () => { api.pause(); api.step(); });
  o.reset.addEventListener('click', api.reset);
  api.go(0, {silent: true});
  return api;
}

/* Quiz reveal */
document.querySelectorAll('.quiz .q .btn').forEach(b => b.addEventListener('click', () => {
  const q = b.closest('.q'), open = !q.classList.contains('open');
  q.classList.toggle('open', open);
  b.setAttribute('aria-expanded', String(open));
  b.textContent = open ? 'Hide answer' : 'Show answer';
}));

/* Global "ways back": Esc and click-on-empty-space clear any focused/highlighted state */
const clearers = [];
function clearFocusStates() { clearers.forEach(f => f()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocusStates(); });
document.addEventListener('click', e => {
  if (e.target === document.body || e.target.tagName === 'SECTION' || e.target.classList.contains('wrap')) clearFocusStates();
});

/* =====================================================================
   Page 2 — Tokens: BPE engine (pure functions, no DOM)
   ===================================================================== */
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
const CORPUS = [['low', 5], ['lower', 2], ['newest', 6], ['widest', 3]];   // word, frequency (Sennrich 2016 toy example)
const EOW = '</w>';
const BASE = (() => { const seen = []; CORPUS.forEach(([w]) => [...w].forEach(c => { if (!seen.includes(c)) seen.push(c); })); return seen.concat([EOW]); })();
const BASESET = new Set(BASE);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const nf = n => Math.round(n).toLocaleString('en-US');

function initVocab() { const v = {}; CORPUS.forEach(([w]) => { v[w] = [...w].concat([EOW]); }); return v; }
/* count every adjacent pair, weighted by word frequency; Map keeps first-seen order (used for ties) */
function pairCounts(vocab) {
  const m = new Map();
  CORPUS.forEach(([w, f]) => {
    const s = vocab[w];
    for (let i = 0; i < s.length - 1; i++) {
      const key = s[i] + '\u0001' + s[i + 1];
      if (!m.has(key)) m.set(key, [s[i], s[i + 1], 0]);
      m.get(key)[2] += f;
    }
  });
  return [...m.values()];
}
/* rank: count desc, ties by first-seen index (the spec's tie-break) */
function rankPairs(c) { return c.map((p, i) => ({a: p[0], b: p[1], n: p[2], i})).sort((x, y) => y.n - x.n || x.i - y.i); }
function mergeSeq(s, a, b) {
  const out = []; let i = 0;
  while (i < s.length) {
    if (i < s.length - 1 && s[i] === a && s[i + 1] === b) { out.push(a + b); i += 2; }
    else { out.push(s[i]); i += 1; }
  }
  return out;
}
function applyMerge(vocab, a, b) { const o = {}; Object.keys(vocab).forEach(w => { o[w] = mergeSeq(vocab[w], a, b); }); return o; }
/* which words (and how many times) contain the pair: the arithmetic behind a count */
function contrib(vocab, a, b) {
  return CORPUS.map(([w, f]) => {
    const s = vocab[w]; let occ = 0;
    for (let i = 0; i < s.length - 1; i++) if (s[i] === a && s[i + 1] === b) occ++;
    return {w, f, occ};
  }).filter(x => x.occ > 0);
}
const arith = (vocab, a, b) => { const c = contrib(vocab, a, b); return c.map(x => `${x.w} ×${x.f * x.occ}`).join(' + ') + ' = ' + c.reduce((t, x) => t + x.f * x.occ, 0); };

const RUN = (() => {
  const states = [initVocab()], tables = [], chosen = [];
  for (let m = 0; m < 6; m++) {
    const rk = rankPairs(pairCounts(states[m]));
    tables.push(rk); chosen.push(rk[0]);
    states.push(applyMerge(states[m], rk[0].a, rk[0].b));
  }
  tables.push(rankPairs(pairCounts(states[6])));
  return {states, tables, chosen};
})();
const MERGES = RUN.chosen.map(p => [p.a, p.b]);
const learned = m => MERGES[m][0] + MERGES[m][1];          // name of the symbol made by merge m (0-based)
const vocabSize = m => BASE.length + m;                       // symbols after m merges
const stateFor = k => (k <= 2 ? 0 : k <= 8 ? k - 2 : 6);      // merges applied to the corpus at step k

/* encode a word with the frozen merges, each merge one left-to-right pass; returns tokens + which merges fired */
function encodeTrace(word) {
  let s = [...word.toLowerCase()].concat([EOW]); const used = [];
  MERGES.forEach(([a, b], i) => { const t = mergeSeq(s, a, b); if (t.length !== s.length) { used.push(i); s = t; } });
  return {tokens: s, used};
}
const encode = w => encodeTrace(w).tokens;

/* cost helpers (pure) */
const DESK = 128000;
const cost = (tokens, price) => tokens / 1e6 * price;
const money = v => '$' + (v === 0 || v >= 0.001 ? v.toFixed(3) : v.toFixed(5));
const deskPct = t => Math.min(100, t / DESK * 100);
const deskMult = t => t / DESK;
const words = t => t * 0.75, chars = t => t * 4, pages = t => t / 500;

/* ===== rendering helpers ===== */
const isLearned = s => MERGES.some(m => m[0] + m[1] === s);   // pass-through characters (a, b, y ...) are NOT learned symbols
const symBox = (s, cls = '') => s === EOW
  ? `<span class="sym eow ${cls}" aria-label="end-of-word marker" title="&lt;/w&gt;">▁</span>`
  : `<span class="sym ${isLearned(s) ? 'learned' : ''} ${cls}">${esc(s)}</span>`;
const symTxt = s => esc(s);

let hlPair = null;     // transient: pair whose occurrences are outlined (Esc / click-away / Reset clear it)
let lastK = -1;

function renderCorpus(vocab, hl, freshName, dim, metaTxt) {
  $('corpus').classList.toggle('dim', dim);
  $('corpus').innerHTML = CORPUS.map(([w, f]) => {
    const s = vocab[w], mark = new Set();
    if (hl) for (let i = 0; i < s.length - 1; i++) if (s[i] === hl.a && s[i + 1] === hl.b) { mark.add(i); mark.add(i + 1); }
    const boxes = s.map((x, i) => symBox(x, (mark.has(i) ? 'hl ' : '') + (freshName && x === freshName ? 'fresh' : ''))).join('');
    return `<div class="wordrow"><div class="w"><b>${w}</b><span class="f">×${f}</span></div><div class="syms">${boxes}</div></div>`;
  }).join('');
  $('corpusMeta').innerHTML = metaTxt;
}

function renderPairs(k, anim) {
  const box = $('pairBox');
  if (k < 2) { box.innerHTML = '<div class="empty">No counts yet. Step 2 counts every adjacent pair.</div>'; $('pairMeta').textContent = ''; return; }
  const t = k === 2 ? 0 : k <= 8 ? k - 3 : 6;
  const rk = RUN.tables[t], vocab = RUN.states[t];
  const ch = (k >= 3 && k <= 8) ? RUN.chosen[t] : null;
  const top = rk[0].n;
  const rows = rk.slice(0, 6).map((p, r) => {
    const isCh = ch && p.a === ch.a && p.b === ch.b;
    const tie = p.n === top && !isCh;
    const pressed = hlPair && hlPair.a === p.a && hlPair.b === p.b;
    const badge = isCh ? '<span class="badge win">MERGE</span>' : (tie ? `<span class="badge">${ch ? 'tie · seen later' : 'tie at max'}</span>` : '');
    return `<tr class="${isCh ? 'chosen' : ''} ${anim ? 'rowin' : ''}" style="${anim ? 'animation-delay:' + r * 90 + 'ms' : ''}">` +
      `<td><button class="pairbtn" data-a="${esc(p.a)}" data-b="${esc(p.b)}" aria-pressed="${pressed ? 'true' : 'false'}" aria-label="Highlight where ${esc(p.a)} followed by ${esc(p.b)} occurs in the corpus">${symTxt(p.a)} + ${symTxt(p.b)}</button>${badge}</td>` +
      `<td class="cnt">${p.n}</td><td><div class="pbar" aria-hidden="true"><i style="width:${(p.n / top * 100).toFixed(1)}%;opacity:${(0.35 + 0.65 * p.n / top).toFixed(2)}"></i></div></td>` +
      `<td class="src">${esc(arith(vocab, p.a, p.b))}</td></tr>`;
  }).join('');
  const rest = rk.length - 6;
  box.innerHTML = `<table class="pairs" aria-label="Top six adjacent pairs with counts"><thead><tr><th>Pair</th><th style="text-align:right">Count</th><th>Share of top</th><th>Where it comes from</th></tr></thead><tbody>${rows}</tbody></table>` +
    `<p class="hint">${rk.length} distinct pairs in total; ${rest} more not shown (lowest count ${rk[rk.length - 1].n}).${k >= 9 ? ' The stencil is frozen now: this table is no longer used.' : ''}</p>`;
  $('pairMeta').innerHTML = k >= 9 ? 'after 6 merges' : `before merge ${t + 1}`;
}

function renderVocab(m) {
  let h = BASE.map(s => `<span>${symTxt(s)}</span>`).join('');
  for (let i = 0; i < m; i++) h += `<span class="learned">${i + 1} · ${symTxt(learned(i))}</span>`;
  $('vocab').innerHTML = h;
  $('vocabMeta').innerHTML = `<b>${vocabSize(m)}</b> symbols = ${BASE.length} base + ${m} learned`;
}

function renderBPE(k, o = {}) {
  const m = stateFor(k);
  const showHl = hlPair && k >= 2;
  const tIdx = k === 2 ? 0 : (k >= 3 && k <= 8) ? k - 3 : 6;
  if (showHl) {
    renderCorpus(RUN.states[tIdx], hlPair, null, false, `<b>before</b> merge ${tIdx + 1} · outlines show <code>${symTxt(hlPair.a)}</code> + <code>${symTxt(hlPair.b)}</code> · Esc to return`);
  } else {
    const fresh = (o.anim && k >= 3 && k <= 8) ? learned(k - 3) : null;
    renderCorpus(RUN.states[m], null, fresh, k === 0, `after <b>${m}</b> merge${m === 1 ? '' : 's'}`);
  }
  renderPairs(k, o.anim && k >= 2 && k <= 8);
  renderVocab(m);
}

/* ===== code blocks (one per step range) ===== */
const CODE = [
`# pip install tokenizers   (only needed for the real library further down the page)
# → https://huggingface.co/docs/tokenizers/quicktour
# Plain Python, no library: the BPE loop (Sennrich et al. 2016, https://arxiv.org/abs/1508.07909)
from collections import Counter
corpus = {"low": 5, "lower": 2, "newest": 6, "widest": 3}
vocab = {w: list(w) + ["</w>"] for w in corpus}
def pair_counts(vocab):
    c = Counter()                       # insertion order = first-seen order (used for ties)
    for w, f in corpus.items():
        s = vocab[w]
        for i in range(len(s) - 1): c[(s[i], s[i+1])] += f
    return c
def merge(vocab, pair):
    a, b = pair
    for w, s in vocab.items():
        out, i = [], 0
        while i < len(s):
            if i < len(s) - 1 and s[i] == a and s[i+1] == b: out.append(a + b); i += 2
            else: out.append(s[i]); i += 1
        vocab[w] = out
merges = []
for _ in range(6):
    c = pair_counts(vocab)
    best = max(c, key=lambda p: (c[p], -list(c).index(p)))   # count desc, first-seen first
    merges.append(best); merge(vocab, best)
# merges -> es, est, est</w>, lo, low, ne`,
`# pip install: none (plain Python; the merge loop is the same as in the previous block)
# → https://arxiv.org/abs/1508.07909   (BPE for sub-word units; encoding = replay the learned merges in order)
def encode(word, merges):
    s = list(word) + ["</w>"]
    for a, b in merges:                       # merges in the order they were learned
        out, i = [], 0
        while i < len(s):
            if i < len(s) - 1 and s[i] == a and s[i+1] == b: out.append(a + b); i += 2
            else: out.append(s[i]); i += 1
        s = out
    return s
# encode("lowest", merges)  -> ['low', 'est</w>']                (2 tokens)
# encode("newer", merges)   -> ['ne', 'w', 'e', 'r', '</w>']     (5 tokens)
# encode("slow", merges)    -> ['s', 'low', '</w>']              (3 tokens)`,
`# pip install: none (plain arithmetic; no library needed)
# → price per million tokens differs by vendor and model; $3 is an illustrative number, not a quote
PRICE_PER_MILLION = 3.00   # illustrative [UNVERIFIED for any specific model]
def cost(tokens, price_per_million=PRICE_PER_MILLION):
    return tokens / 1_000_000 * price_per_million
# cost(5_000)     -> 0.015
# cost(1_000_000) -> 3.0`
];
const CODE_META = ['steps 1–8 · the BPE loop', 'steps 9–11 · encode with the frozen merges', 'step 12 · the bill'];
function renderCode(k) {
  const i = k <= 8 ? 0 : k <= 11 ? 1 : 2;
  $('codeTxt').textContent = CODE[i]; $('codeMeta').textContent = CODE_META[i];
}

/* =====================================================================
   Stage panels (steps 9-12), tokenizer box, cost panel
   ===================================================================== */
const tokensHTML = toks => `<div class="syms">${toks.map(t => symBox(t)).join('')}</div>`;
const ENC_DEMO = ['lowest', 'newer', 'slow'];
const STRAW = 'strawberry', STRAW_CHUNKS = [3, 2, 5];          // illustrative split, UNVERIFIED
const DIG = {a: '12345', sa: [3, 2], b: '6789', sb: [2, 2]};     // illustrative splits, UNVERIFIED
const sup = n => String(n).split('').map(c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('');
const rCount = s => [...s].filter(c => c === 'r').length;
const STEP_COST = {tokens: 5000, price: 3.00, tokens2: 1000000};

function renderEncDemo() {
  $('encDemo').innerHTML = ENC_DEMO.map(w => {
    const r = encodeTrace(w);
    const tr = r.used.length ? 'merges used: ' + r.used.map(i => `${i + 1} ${esc(learned(i))}`).join(' · ') : 'no merge applies';
    return `<div class="trow"><div class="lbl">${w}<small>${[...w].length} letters</small></div><div class="out">${tokensHTML(r.tokens)}<div class="tr">${tr}</div></div></div>`;
  }).join('') + `<p class="hint">Words the stencil never saw are still covered: whatever was not glued stays as single characters. <span class="tag">COMMON PRACTICE</span> real byte-level BPE can always fall back to bytes.</p>`;
}

function renderStraw() {
  const chunkView = $('viewToggle').checked;
  const letters = [...STRAW];
  const grid = $('strawGrid');
  grid.className = 'straw ' + (chunkView ? 'chunks' : 'letters');

  let pos = 1;
  STRAW_CHUNKS.forEach((n, j) => { h += `<div class="chunk" style="grid-column:${pos} / span ${n};grid-row:1">#id${'₁₂₃'[j]}</div>`; pos += n; });
  grid.innerHTML = h;
  grid.setAttribute('aria-label', chunkView ? `${STRAW_CHUNKS.length} opaque chunk boxes; the letters are hidden behind them` : `The letters of ${STRAW}, r highlighted`);

    ? `Chunk view: ${STRAW_CHUNKS.length} opaque chunks (${STRAW_CHUNKS.join(' + ')} = ${STRAW_CHUNKS.reduce((a, b) => a + b, 0)} letters hidden). The split is illustrative <span class="tag unv">UNVERIFIED</span>; what the student gets is IDs only.`
    : `Letter view: what <em>you</em> see. Flip the switch to see what the student receives.`;
  $('strawAsk').innerHTML = chunkView
    ? `<span>How many r's in "${STRAW}"?</span><span class="a">?</span><span class="note">not in the input: any answer is recalled from memory, not read</span>`
    : `<span>How many r's in "${STRAW}"?</span><span class="a">${rCount(STRAW)} ✓</span><span class="note">counted by the script from the ${STRAW.length} letters you can see</span>`;
  const t = encodeTrace(STRAW).tokens;
  $('strawToy').innerHTML = t.map(x => symBox(x)).join('');
  $('strawToyN').innerHTML = `<b style="color:var(--amber2)">${t.length}</b> tokens (${STRAW.length} letters + &lt;/w&gt;): none of its pairs was ever glued. A real ~100k-vocabulary stencil would give a few chunks <span class="tag unv">UNVERIFIED which</span>.`;
}

function digitRow(str, split, name) {
  let pos = 0, h = '';
  split.forEach(n => {
    h += '<div class="dch">' + [...str.slice(pos, pos + n)].map((d, i) => `<span>${d}<small>10${sup(str.length - 1 - (pos + i))}</small></span>`).join('') + '</div>';
    pos += n;
  });
  return `<div class="drow"><span class="nm">${name}</span>${h}<span class="hint" style="margin:0">chunks: ${split.join(' + ')} digits</span></div>`;
}
function renderDigits() {
  const A = +DIG.a, B = +DIG.b;
  const bndA = DIG.a.length - DIG.sa[0];
  $('digitsBox').innerHTML =
    digitRow(DIG.a, DIG.sa, 'first number') + digitRow(DIG.b, DIG.sb, 'second number') +
    `<div class="drow"><span class="nm">${DIG.a} × ${DIG.b} =</span><span class="dres" aria-label="result unknown to the student">?</span><span class="hint" style="margin:0">the student sees two chunks per number, not ten place-value columns</span></div>` +
    `<p class="hint" style="margin:0">The first number's chunk boundary falls between 10${sup(bndA)} and 10${sup(bndA - 1)}, so a carry in the tens column crosses a boundary the student cannot see. A calculator tool returns <b style="color:var(--amber2)">${nf(A * B)}</b> (computed by this script, ${DIG.a} × ${DIG.b}). That is why tool use (page 6, ReAct) hands arithmetic off.</p>`;
}

function renderBill() {
  const t = +$('tokSlider').value, p = +$('priceSlider').value;
  const box = (k, v, d) => `<div class="bx"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  $('billBox').innerHTML =
    box('your slider', money(cost(t, p)), `${nf(t)} ÷ 1,000,000 × $${p.toFixed(2)}`) +
    box('a 10-page PDF', money(cost(STEP_COST.tokens, STEP_COST.price)), `${nf(STEP_COST.tokens)} ÷ 1,000,000 × $${STEP_COST.price.toFixed(2)}`) +
    box('one 1M-token call', money(cost(STEP_COST.tokens2, STEP_COST.price)), `${nf(STEP_COST.tokens2)} ÷ 1,000,000 × $${STEP_COST.price.toFixed(2)} · ${deskMult(STEP_COST.tokens2).toFixed(1)} × a 128K desk`);
}

function renderStage(k) {
  const on = (k >= 9 && k <= 12) ? 'stP' + k : 'stP0';
  document.querySelectorAll('#stage .panel').forEach(p => p.classList.toggle('on', p.id === on));
  if (k === 9) renderEncDemo();
  if (k === 10) renderStraw();
  if (k === 11) renderDigits();
  if (k === 12) renderBill();
}

/* ===== tokenizer box ===== */
function renderEnc() {
  const ws = $('encInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean).slice(0, 6);
  if (!ws.length) { $('encOut').innerHTML = '<div class="empty">Type a word above.</div>'; return; }
  let total = 0;
  const rows = ws.map(w => { const t = encode(w); total += t.length; return `<div class="encw">${tokensHTML(t)}<span class="n">${t.length} token${t.length === 1 ? '' : 's'}</span><span class="hint" style="margin:0">for "${esc(w)}" (${[...w].length} letters)</span></div>`; }).join('');
  $('encOut').innerHTML = rows + (ws.length > 1 ? `<div class="hint" style="margin:0">Total: <b style="color:var(--amber2)">${total}</b> tokens for ${ws.length} words.</div>` : '');
}

/* ===== cost panel ===== */
function renderCost() {
  const t = +$('tokSlider').value, p = +$('priceSlider').value;
  $('tokVal').textContent = nf(t); $('priceVal').textContent = '$' + p.toFixed(2);
  $('costBig').textContent = money(cost(t, p));
  $('costArith').textContent = `${nf(t)} ÷ 1,000,000 × $${p.toFixed(2)} = ${money(cost(t, p))}`;
  $('deskPct').textContent = deskPct(t).toFixed(1) + '%';
  $('deskFill').style.width = deskPct(t).toFixed(1) + '%';
  $('deskNote').textContent = t > DESK ? `${deskMult(t).toFixed(1)} × the desk (bar is full)` : t === DESK ? 'exactly one full desk' : '';
  $('deskBar').setAttribute('aria-label', `Share of a 128K-token context window used: ${deskPct(t).toFixed(1)} percent`);
  $('stWords').textContent = nf(words(t)); $('stChars').textContent = nf(chars(t)); $('stPages').textContent = pages(t).toFixed(1);
  if (main && main.k === 12) renderBill();
}

/* =====================================================================
   Main stepper — 12 steps
   ===================================================================== */
const T0 = RUN.tables[0];
const cd = s => `<code>${esc(s)}</code>`;
const mc = m => RUN.chosen[m];
const mergeTxt = m => `${cd(mc(m).a)} + ${cd(mc(m).b)} → ${cd(learned(m))}`;
const r9 = ENC_DEMO.map(w => encodeTrace(w));
const bTrace = encodeTrace(STRAW);
const steps = [
  {short: 'corpus', phase: 'Corpus', caption: `Four words, with how often each appears. The stencil starts with single characters plus an end-of-word marker: <b>${vocabSize(0)}</b> symbols.`},
  {short: 'count pairs', phase: 'Count', caption: `Count every adjacent pair, weighted by the word's frequency. ${cd(T0[0].a + ' ' + T0[0].b)} appears in ${esc(arith(RUN.states[0], T0[0].a, T0[0].b))}. <b>${T0.filter(p => p.n === T0[0].n).length}</b> pairs tie at ${T0[0].n}. Click a pair to see where it occurs.`},
  {short: 'merge 1', phase: 'Merge 1', caption: `Tie-break: the pair seen first in corpus order. Glue ${mergeTxt(0)} everywhere. Vocabulary: <b>${vocabSize(1)}</b>.`},
  {short: 'merge 2', phase: 'Merge 2', caption: `Recount. ${cd(mc(1).a)} + ${cd(mc(1).b)} is now a pair with count ${mc(1).n} → ${cd(learned(1))}. Vocabulary: <b>${vocabSize(2)}</b>.`},
  {short: 'merge 3', phase: 'Merge 3', caption: `${mergeTxt(2)} (${mc(2).n}). The suffix "-est" at the end of a word is now ONE symbol: the stencil found a suffix without being told what a suffix is. Vocabulary: <b>${vocabSize(3)}</b>.`},
  {short: 'merge 4', phase: 'Merge 4', caption: `${mergeTxt(3)} (${mc(3).n}; ${cd('o w')} also has ${RUN.tables[3][1].n} and loses the tie because it is seen later). Vocabulary: <b>${vocabSize(4)}</b>.`},
  {short: 'merge 5', phase: 'Merge 5', caption: `${mergeTxt(4)} (${mc(4).n}). The word "low" is now one symbol plus its end marker. Vocabulary: <b>${vocabSize(5)}</b>.`},
  {short: 'merge 6', phase: 'Merge 6', caption: `${mergeTxt(5)} (${mc(5).n}). Six merges done. Real tokenizers run this loop roughly 30,000–100,000 times <span class="tag">COMMON PRACTICE</span>. Vocabulary: <b>${vocabSize(6)}</b>.`},
  {short: 'encode new words', phase: 'Encode', caption: `Freeze the stencil and push unseen words through it, applying the ${MERGES.length} merges in learned order: ${r9.map((r, i) => `${cd(ENC_DEMO[i])} → ${r.tokens.map(cd).join(' ')} (<b>${r.tokens.length}</b> tokens)`).join('; ')}.`},
  {short: 'strawberry', phase: 'Letters', caption: `${cd(STRAW)} through THIS stencil: <b>${bTrace.tokens.length}</b> single-character tokens (none of its pairs were learned). Through a real 100k-vocabulary stencil it is a few chunks <span class="tag unv">UNVERIFIED which exactly</span>. Either way the student receives chunk IDs, not letters: counting r's is a guess from memory, not a look. Flip the switch below.`},
  {short: 'digits', phase: 'Digits', caption: `Numbers get the same treatment: ${cd(DIG.a)} is split wherever frequency says, not at place values. Column arithmetic needs digit alignment the student never sees. This is why tool use (page 6, ReAct) hands arithmetic to a calculator.`},
  {short: 'the bill', phase: 'Cost', caption: `Every token is billed and every token fills the desk. cost = tokens ÷ 1,000,000 × price. ${nf(STEP_COST.tokens)} tokens at $${STEP_COST.price.toFixed(0)}/M = ${money(cost(STEP_COST.tokens, STEP_COST.price))}; ${nf(STEP_COST.tokens2)} tokens = ${money(cost(STEP_COST.tokens2, STEP_COST.price))} per call, which is why page 7 (RAG) exists <span class="tag der">DERIVED</span>. The price is illustrative <span class="tag unv">UNVERIFIED</span>.`}
];

function renderMain(k, silent) {
  if (k !== lastK) hlPair = null;
  const anim = !silent && !REDUCED && k === lastK + 1;
  renderBPE(k, {anim});
  renderStage(k);
  renderCode(k);
  $('costCard').classList.toggle('lit', k === 12);
  $('bReset').classList.toggle('attn', !!hlPair);
  lastK = k;
}
let main = null;
main = Stepper({
  steps, resetCaption: `Four words and ${vocabSize(0)} symbols. Press Step to count pairs.`,
  play: $('bPlay'), step: $('bStep'), reset: $('bReset'), counter: $('bCounter'), caption: $('bCaption'),
  render: renderMain, interval: 2400
});

/* pair-highlight (transient state): click a pair; Esc / click-away / Reset clear it */
$('pairBox').addEventListener('click', e => {
  const b = e.target.closest('.pairbtn'); if (!b) return;
  const a = b.dataset.a, c = b.dataset.b;
  hlPair = (hlPair && hlPair.a === a && hlPair.b === c) ? null : {a, b: c};
  renderBPE(main.k, {anim: false});
  $('bReset').classList.toggle('attn', !!hlPair);
});
function clearHl() { if (hlPair) { hlPair = null; renderBPE(main.k, {anim: false}); } $('bReset').classList.remove('attn'); }
clearers.push(clearHl);
$('bReset').addEventListener('click', clearHl);
$('viewToggle').addEventListener('change', renderStraw);

$('encInput').addEventListener('input', renderEnc);
['tokSlider', 'priceSlider'].forEach(id => $(id).addEventListener('input', renderCost));
[['preset5k', 5000], ['preset128k', 128000], ['preset1m', 1000000]].forEach(([id, v]) => $(id).addEventListener('click', () => { $('tokSlider').value = v; renderCost(); }));
renderEnc(); renderCost();
/* fact boxes: numbers computed, not typed */
$('f3n').textContent = vocabSize(6);
$('f4d').textContent = `100 tokens ≈ ${words(100)} English words`;
$('f5v').textContent = `${nf(5000)} tokens × $3/M = ${money(cost(5000, 3))}`;
$('f5d').textContent = '$' + cost(1e6, 3).toFixed(2);

/* keyboard: main animation = main */
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement.tagName) && e.key !== 'Escape') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); main.pause(); main.step(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); main.pause(); main.go(main.k - 1); }
  else if (e.key === ' ') { e.preventDefault(); main.play(); }
  else if (e.key.toLowerCase() === 'r') { main.reset(); clearFocusStates(); }
});
/* URL params: ?step=N jumps the main animation; ?t=seconds maps onto its steps; ?view=chunks sets the step-10 toggle */
if (Q.get('view') === 'chunks') { $('viewToggle').checked = true; renderStraw(); }
if (Q.has('step')) main.go(parseInt(Q.get('step'), 10) || 0);
else if (Q.has('t')) main.go(Math.floor((parseFloat(Q.get('t')) || 0) / 2.4));

/* ===== SELFTEST (spec values from _spec/2-tokens.md) ===== */
(function selftest() {
  const fails = [];
  const check = (name, ok) => { if (!ok) fails.push(name); };
  const pk = rk => rk.slice(0, 6).map(p => p.a + '+' + p.b + ':' + p.n).join(', ');
  const E = [
    'e+s:9, s+t:9, t+</w>:9, w+e:8, l+o:7, o+w:7',
    'es+t:9, t+</w>:9, l+o:7, o+w:7, n+e:6, e+w:6',
    'est+</w>:9, l+o:7, o+w:7, n+e:6, e+w:6, w+est:6',
    'l+o:7, o+w:7, n+e:6, e+w:6, w+est</w>:6, w+</w>:5',
    'lo+w:7, n+e:6, e+w:6, w+est</w>:6, w+</w>:5, w+i:3',
    'n+e:6, e+w:6, w+est</w>:6, low+</w>:5, w+i:3, i+d:3'
  ];
  RUN.tables.slice(0, 6).forEach((rk, i) => check('table ' + (i + 1) + ' got [' + pk(rk) + ']', pk(rk) === E[i]));
  check('step-2 top6 array', JSON.stringify(RUN.tables[0].slice(0, 6).map(p => [p.a, p.b, p.n])) === JSON.stringify([['e', 's', 9], ['s', 't', 9], ['t', '</w>', 9], ['w', 'e', 8], ['l', 'o', 7], ['o', 'w', 7]]));
  check('merge order', MERGES.map(m => m[0] + m[1]).join(',') === 'es,est,est</w>,lo,low,ne');
  check('merge counts', RUN.chosen.map(p => p.n).join(',') === '9,9,9,7,7,6');
  check('vocab 11 at step 1', vocabSize(stateFor(1)) === 11);
  check('vocab 17 at step 8', vocabSize(stateFor(8)) === 17);
  check('base symbols', BASE.join(' ') === 'l o w e r n s t i d </w>');
  const W = m => CORPUS.map(([w]) => RUN.states[m][w].join(' ')).join(' | ');
  check('after merge 1', W(1) === 'l o w </w> | l o w e r </w> | n e w es t </w> | w i d es t </w>');
  check('after merge 2', W(2) === 'l o w </w> | l o w e r </w> | n e w est </w> | w i d est </w>');
  check('after merge 3', W(3) === 'l o w </w> | l o w e r </w> | n e w est</w> | w i d est</w>');
  check('after merge 4', W(4) === 'lo w </w> | lo w e r </w> | n e w est</w> | w i d est</w>');
  check('after merge 5', W(5) === 'low </w> | low e r </w> | n e w est</w> | w i d est</w>');
  check('final segmentation', W(6) === 'low </w> | low e r </w> | ne w est</w> | w i d est</w>');
  check('step 6 tie-break: l+o chosen, o+w (same count) not', RUN.chosen[3].a === 'l' && RUN.chosen[3].b === 'o' && RUN.tables[3][1].a === 'o' && RUN.tables[3][1].b === 'w' && RUN.tables[3][1].n === RUN.chosen[3].n);
  const lens = {lowest: 2, newer: 5, widest: 4, low: 2, lower: 4, newest: 3, slow: 3, west: 2, strawberry: 11};
  Object.keys(lens).forEach(w => check('encode ' + w, encode(w).length === lens[w]));
  check('encode lowest tokens', encode('lowest').join('|') === 'low|est</w>');
  check('encode newer tokens', encode('newer').join('|') === 'ne|w|e|r|</w>');
  check('encode slow tokens', encode('slow').join('|') === 's|low|</w>');
  check('cost 5000@3', money(cost(5000, 3)) === '$0.015');
  check('cost 1M@3', money(cost(1e6, 3)) === '$3.000');
  check('cost 128000@3', money(cost(128000, 3)) === '$0.384');
  check('words 5000', words(5000) === 3750);
  check('chars 5000', chars(5000) === 20000);
  check('pages 5000', pages(5000).toFixed(1) === '10.0');
  check('desk 5000', deskPct(5000).toFixed(1) === '3.9');
  check('desk 128000', deskPct(128000).toFixed(1) === '100.0');
  check('desk 1M clamp', deskPct(1e6) === 100 && deskMult(1e6).toFixed(1) === '7.8');
  check('r count', rCount('strawberry') === 3);
  check('12345 x 6789', 12345 * 6789 === 83810205);
  if (fails.length) console.error('SELFTEST FAIL: ' + fails.join('; '));
  else console.log('SELFTEST OK');
})();
<\/script>

<script type="text/plain" id="src-3" data-file="3-embeddings.html" data-title="3 · Embeddings — a word as a coordinate in meaning-space">

<style>

code{background:var(--bg3);padding:.1em .4em;border-radius:5px;color:var(--amber2)}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;padding:0 .45em;border-radius:5px;font-size:.85em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}

/* toggle look */

.tag.unv{color:var(--bad);border-color:rgba(224,138,138,.5)}
.tag.der{color:#b9c8e8;border-color:rgba(185,200,232,.5)}

/* uncertainty */

.uncertain h3{color:var(--bad)}

/* quiz */

    <h1>Embeddings: a word as a coordinate in meaning-space</h1>
    <p class="lede">Each token ID gets a seat in a room: a list of numbers. Words used in the same kinds of sentences sit in the same direction from the centre. To ask "how alike?" we measure the angle between two arrows and ignore their length. Drag the dots and watch the angle, the number and the matrix change.</p>
    <p class="hint">Keyboard: <kbd>→</kbd> step · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight or pair choice. On a dot: arrow keys move it 0.1 (<kbd>Shift</kbd> = 1.0). URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation, <code>?t=seconds</code> maps onto steps.</p>

<!-- ============ 1. ANALOGY ============ -->
<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>A seat in a meaning-room</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">🪑</div>
      <div>
        <p>On page 2 the stencil turned text into chunk IDs. Now every ID is given a <b>seat in a meaning-room</b>: a list of roughly 1,000 to 8,000 numbers, which is just a coordinate in a space with that many dimensions <span class="tag">COMMON PRACTICE</span>.</p>
        <p>The seats were assigned during the school years, so words used in the same sentences end up in the same <em>direction</em> from the centre of the room. The student does not compare words by spelling. They compare <em>where the words sit</em>.</p>
        <p>To ask "how alike are these two?", draw an arrow from the centre to each seat and measure the <b>angle</b> between the arrows. That is <b>cosine similarity</b>. We deliberately ignore how far each seat is from the centre: in practice arrow length carries word frequency and quirks, while direction carries meaning. The librarian on page 7 will find pages by exactly this angle.</p>
        <div class="metaphor">
          <div><b>A seat</b>an embedding vector</div>
          <div><b>The room</b>the embedding space (we draw 2 of the ~1,000 dimensions)</div>
          <div><b>The angle between arrows</b>cosine similarity</div>
          <div><b>Arrow length</b>vector norm (ignored by cosine)</div>
          <div><b>Nearest seats</b>what retrieval returns</div>
        </div>
      </div>
    </div>
    <div class="hook" style="margin-top:22px">
      <span class="eyebrow">The layer most people haven't seen</span>
      <p><b>Cosine similarity throws away length on purpose.</b> Two vectors pointing the same way score 1.0 even if one is twice as long. Two vectors at right angles score 0 even if they are near each other in the room. "Closeness" in embedding search means <em>same direction</em>, not <em>short distance</em>, and below you will see a case where the two measures disagree about which word is nearest.</p>
    </div>
  </div>
</section>

<!-- ============ 3. FACTS ============ -->
<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">Embedding</div><div class="v">One token → ~1,000–8,000 numbers</div><div class="d">A coordinate in meaning-space; the location is learned from which words co-occur. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Cosine similarity</div><div class="v">(a·b) / (|a||b|) ∈ [−1, 1]</div><div class="d">1 = same direction, 0 = perpendicular, −1 = opposite. Worked: <span data-calc="catDogWork"></span>. <span class="tag der">DERIVED</span></div></div>
      <div class="fact"><div class="k">sentence-transformers</div><div class="v"><code>all-MiniLM-L6-v2</code> → 384-d vectors</div><div class="d">Library usage (<code>SentenceTransformer(...)</code>, <code>encode</code>) is in the <a href="https://www.sbert.net/docs/quickstart.html">sentence-transformers quickstart</a> <span class="tag doc">DOC</span>. The model name and 384 come from the notes; the quickstart now demonstrates other models, so check the model card before repeating them <span class="tag unv">UNVERIFIED</span>. The notes' sample outputs (dog~puppy ≈ 0.81, dog~car ≈ 0.12) are expected values, not asserted here <span class="tag unv">UNVERIFIED</span>.</div></div>
      <div class="fact"><div class="k">Why not Euclidean</div><div class="v">Length carries frequency and quirks; direction carries meaning</div><div class="d">Normalise vectors and a plain dot product equals cosine, with less compute (no square roots or divisions at query time). <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">king − man + woman ≈ queen</div><div class="v">Directions encode relations</div><div class="d">A word2vec-era result: <a href="https://arxiv.org/abs/1301.3781">Mikolov et al. 2013, "Efficient Estimation of Word Representations in Vector Space"</a> <span class="tag doc">DOC</span>. See the caveat below about modern sentence embeddings.</div></div>
      <div class="fact"><div class="k">Static vs contextual</div><div class="v">"bank" has ONE seat here</div><div class="d">River bank and bank account share it. Page 4 (attention) is how the meaning gets adjusted per sentence. <span class="tag">COMMON PRACTICE</span></div></div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>The notes' sentence-transformers snippet, verbatim</h3>
      <pre class="codeblk"><code># pip install sentence-transformers
# → https://www.sbert.net/   (sentence-transformers library, wraps many embedding models)
from sentence_transformers import SentenceTransformer, util

# Load a small but capable embedding model (384-dimensional vectors)
model = SentenceTransformer("all-MiniLM-L6-v2")

# Encode three phrases into vectors
# encode() returns a numpy array of shape (num_phrases, embedding_dim)
vecs = model.encode(["dog", "puppy", "car"])

# cos_sim returns a value between -1 and 1
# Higher = more similar in meaning
print("dog ~ puppy:", util.cos_sim(vecs[0], vecs[1]).item())   # expect ~0.81 (very similar)
print("dog ~ car:",   util.cos_sim(vecs[0], vecs[2]).item())   # expect ~0.12 (unrelated)</code></pre>
      <p class="hint">The "expect" values are the notes' numbers, not measured here. <span class="tag unv">UNVERIFIED</span> Run the six lines to get this model's real values.</p>
    </div>
  </div>
</section>

<!-- ============ 4. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li><b>Two dimensions are a cartoon of 384 to 8,192.</b> Intuitions about angles carry over. Intuitions about "crowding" do not: high-dimensional spaces are mostly empty and almost everything is nearly perpendicular.</li>
        <li><b>The six coordinates are invented</b> so the arithmetic is checkable by hand. Real embeddings are not integers, and the notes' scores (0.81, 0.12) are model- and version-specific <span class="tag unv">UNVERIFIED</span>.</li>
        <li><b>Cosine ignores length by design, but some pipelines keep it on purpose</b> (for example dot-product retrieval with unnormalised vectors). Know which your vector database uses; Chroma's <code>hnsw:space</code> setting comes up on page 7.</li>
        <li><b>"Perpendicular = unrelated" is a geometric reading, not a guarantee.</b> Trained spaces are anisotropic: most cosines between real embeddings are positive.</li>
        <li><b>Word-level arithmetic (king − man + woman) is a word2vec-era result.</b> Modern sentence embeddings do not reliably reproduce it.</li>
      </ul>
    </div>
  </div>
</section>

<section id="quiz">

    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. Which word is nearest to <code>cat</code> by cosine, and which by Euclidean distance? Why do they disagree?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Cosine: <b>kitten</b> (<span data-calc="catKitCos"></span>, angle <span data-calc="catKitAng"></span>°). Euclidean: <b>dog</b> (<span data-calc="catDogEu"></span> versus kitten's <span data-calc="catKitEu"></span>). Kitten is twice cat's vector: same direction, longer arrow. Cosine divides the length out; distance does not.</div></div>
    <div class="q"><p>2. Compute cos(dog, car) by hand.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans"><span data-calc="dogCarWork"></span>. Perpendicular: "unrelated", not "opposite".</div></div>
    <div class="q"><p>3. Why does a vector database want normalised vectors?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">With unit length, the dot product <em>is</em> the cosine, so one multiply-add per dimension gives the similarity with no square roots or divisions.</div></div>
    <div class="q"><p>4. Page 2 said the model never sees letters. What does it see instead, after this page?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Token IDs, each mapped by a lookup table to an embedding vector. The vector's direction encodes meaning learned from context.</div></div>
    <div class="q"><p>5. "bank" has one embedding here. What problem does that cause, and which page solves it?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">River bank and bank account get the same seat. Page 4: self-attention mixes in neighbouring tokens so the representation changes with context.</div></div>
    <div class="q"><p>6. The notes print dog~puppy ≈ 0.81 with <code>all-MiniLM-L6-v2</code>. How would you phrase that in an interview?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">"Roughly 0.8 with a small sentence-transformer; the exact value depends on the model and version." Then offer to run the six-line script and read the real number.</div></div>
  </div>
</section>

      o.caption.innerHTML = (st && st.phase ? `<span class="phase">${st.phase}</span>` : '') + (st ? st.caption : o.resetCaption);

    },

    play() {

  };

}

/* =====================================================================
   Embeddings — data and pure maths (no DOM here; SELFTEST uses these)
   ===================================================================== */
const WORDS = ['cat', 'kitten', 'dog', 'car', 'truck', 'banana'];
const DEF = [[2, 1], [4, 2], [3, 2], [-2, 3], [-3, 4], [0.5, -3]];
const IDX = {}; WORDS.forEach((w, i) => IDX[w] = i);
const dotp = (a, b) => a[0] * b[0] + a[1] * b[1];
const norm2 = a => Math.hypot(a[0], a[1]);
const unit = a => { const n = norm2(a); return n ? [a[0] / n, a[1] / n] : [0, 0]; };
const cosine = (a, b) => { const d = norm2(a) * norm2(b); return d ? clamp(dotp(a, b) / d, -1, 1) : NaN; };
const euclid = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const angleDeg = (a, b) => Math.acos(cosine(a, b)) * 180 / Math.PI;
const mapMat = (P, fn) => P.map(a => P.map(b => fn(a, b)));
const cosMat = P => mapMat(P, cosine);
const eucMat = (P, normalised) => mapMat(normalised ? P.map(unit) : P, euclid);
function nearest(P, a, metric, cand, normalised) {
  let best = null, ties = [];
  for (const j of cand) {
    if (j === a) continue;
    const v = metric === 'cos' ? cosine(P[a], P[j])
      : (normalised ? euclid(unit(P[a]), unit(P[j])) : euclid(P[a], P[j]));
    if (Number.isNaN(v)) continue;
    if (best === null || (metric === 'cos' ? v > best + 1e-9 : v < best - 1e-9)) { best = v; ties = [j]; }
    else if (Math.abs(v - best) <= 1e-9) ties.push(j);
  }
  return {idx: ties, val: best};
}
const tr = v => String(+v.toFixed(3));                 // 8.000 -> "8", 2.0 -> "2"
const pc = v => v < 0 ? `(${tr(v)})` : tr(v);          // negatives in parentheses
/* the printed arithmetic for one pair, from the displayed coordinates */
function arith(A, B, na, nb) {
  const dt = dotp(A, B), a = norm2(A), b = norm2(B), den = a * b, c = cosine(A, B);
  return {
    dot: `${na} · ${nb} = ${pc(A[0])}·${pc(B[0])} + ${pc(A[1])}·${pc(B[1])} = ${tr(dt)}`,
    denL: `|${na}| · |${nb}| = ${fmt(a)} × ${fmt(b)} = ${fmt(den)}`,
    cos: Number.isNaN(c) ? 'cosine undefined: one arrow has length 0' : `cos = ${tr(dt)} / ${fmt(den)} = ${fmt(c)}`,
    ang: Number.isNaN(c) ? '' : `angle = acos(${fmt(c)}) = ${angleDeg(A, B).toFixed(1)}°`,
    euc: `Euclidean = √((${pc(A[0])}−${pc(B[0])})² + (${pc(A[1])}−${pc(B[1])})²) = ${fmt(euclid(A, B))}`,
    c, dt, den
  };
}
const D = n => DEF[IDX[n]];
const worked = (n1, n2) => arith(D(n1), D(n2), n1, n2);

/* values shown in fact boxes / quiz, computed from the ORIGINAL coordinates */
const CALC = {
  catDogCos: () => fmt(cosine(D('cat'), D('dog'))),
  catKitCos: () => fmt(cosine(D('cat'), D('kitten'))),
  catKitAng: () => angleDeg(D('cat'), D('kitten')).toFixed(1),
  catDogEu: () => fmt(euclid(D('cat'), D('dog'))),
  catKitEu: () => fmt(euclid(D('cat'), D('kitten'))),
  catDogWork: () => { const r = worked('cat', 'dog'); return `cat·dog = 2·3 + 1·2 = ${tr(r.dt)}; cos = ${tr(r.dt)} / (${fmt(norm2(D('cat')))} × ${fmt(norm2(D('dog')))}) = ${fmt(r.c)}`; },
  dogCarWork: () => { const r = worked('dog', 'car'); return `dog·car = 3·(−2) + 2·3 = ${tr(r.dt)} → cos = ${fmt(r.c)}`; },
  normCatKit: () => fmt(euclid(unit(D('cat')), unit(D('kitten')))),
  normDogCar: () => fmt(euclid(unit(D('dog')), unit(D('car')))),
  normCarBanana: () => fmt(euclid(unit(D('car')), unit(D('banana'))))
};
document.querySelectorAll('[data-calc]').forEach(el => { el.textContent = CALC[el.dataset.calc](); });

/* ===== live state (the only mutable data) ===== */
const POS = DEF.map(p => p.slice());
const state = {k: 0, sel: [IDX.cat, IDX.dog], euc: false, norm: false, badCell: null, picked: false, seen: new Set()};
const defaultSel = () => [IDX.cat, IDX.dog];
const pkey = (i, j) => i < j ? i + '-' + j : j + '-' + i;
const isDirty = () => POS.some((p, i) => Math.abs(p[0] - DEF[i][0]) > 1e-9 || Math.abs(p[1] - DEF[i][1]) > 1e-9);
function visSet(k) {
  if (k >= 5) return new Set([0, 1, 2, 3, 4, 5]);
  if (k === 4) return new Set([IDX.cat, IDX.dog, IDX.kitten]);
  if (k === 3) return new Set([IDX.cat, IDX.dog]);
  if (k === 2) return new Set([IDX.cat]);
  return new Set();
}
const isVis = i => visSet(state.k).has(i);
function stepPairs(k) {
  const P = [];
  if (k >= 6) P.push(pkey(IDX.cat, IDX.dog));
  if (k >= 8) P.push(pkey(IDX.cat, IDX.kitten));
  if (k >= 9) P.push(pkey(IDX.dog, IDX.car), pkey(IDX.car, IDX.banana), pkey(IDX.cat, IDX.car));
  return P;
}
/* live pair numbers for the captions (current coordinates, raw not normalised) */
const live = (a, b) => { const A = POS[IDX[a]], B = POS[IDX[b]]; return {A, B, r: arith(A, B, a, b), ang: angleDeg(A, B), eu: euclid(A, B), c: cosine(A, B)}; };
const co = w => { const p = POS[IDX[w]]; return `(${p[0].toFixed(1)}, ${p[1].toFixed(1)})`; };
const shortDot = (a, b) => { const A = POS[IDX[a]], B = POS[IDX[b]]; return `(${pc(A[0])}·${pc(B[0])} + ${pc(A[1])}·${pc(B[1])})`; };
const dertag = ' <span class="tag der">DERIVED</span>';

const mySteps = [
  {short: 'the room', phase: 'Seats', caption: 'An empty plane: two of the thousand-odd dimensions a real embedding has. The origin is the centre of the room.'},
  {short: 'cat', phase: 'Seats', get caption() { return `<code>cat</code> takes its seat at ${co('cat')}. A seat is just a list of numbers, here two of them.`; }},
  {short: 'dog', phase: 'Seats', get caption() { return `<code>dog</code> sits at ${co('dog')}, close to cat: during training they appeared in the same kinds of sentences.`; }},
  {short: 'kitten', phase: 'Seats', get caption() { return `<code>kitten</code> at ${co('kitten')}: exactly twice cat's coordinates. Same direction, longer arrow. Hold that thought.`; }},
  {short: 'car, truck, banana', phase: 'Seats', caption: 'Three more seats. Vehicles cluster at upper-left; banana sits alone below.'},
  {short: 'two arrows', phase: 'Angle', get caption() { const l = live('cat', 'dog'); return `Draw arrows from the centre to <code>cat</code> and <code>dog</code>. The angle between them is ${l.ang.toFixed(1)}°; cos ${l.ang.toFixed(1)}° = ${fmt(l.c)}. Same direction ≈ same meaning.${dertag}`; }},
  {short: 'cosine = angle', phase: 'Angle', get caption() { const l = live('cat', 'dog'); return `cos = (a·b)/(|a||b|) = ${shortDot('cat', 'dog')}/(${fmt(norm2(l.A))} × ${fmt(norm2(l.B))}) = ${tr(l.r.dt)}/${fmt(l.r.den)} = ${fmt(l.c)}. Length is divided out: only direction survives.${dertag}`; }},
  {short: 'cat vs kitten', phase: 'Compare', get caption() {
    const k = live('cat', 'kitten'), d = live('cat', 'dog');
    return `cat–kitten: cos = ${tr(k.r.dt)}/(${fmt(norm2(k.A))} × ${fmt(norm2(k.B))}) = ${fmt(k.c)}, angle ${k.ang.toFixed(1)}°. Yet their Euclidean distance is ${fmt(k.eu)}, further apart than cat–dog (${fmt(d.eu)}). Distance says "dog is nearer"; cosine says "kitten is identical". Retrieval uses cosine.${dertag}`; }},
  {short: 'perpendicular = unrelated', phase: 'Compare', get caption() {
    const d = live('dog', 'car'), b = live('car', 'banana');
    return `dog–car: ${shortDot('dog', 'car')} = ${tr(d.r.dt)} → cos ${fmt(d.c)}, a ${d.ang.toFixed(1)}° angle. "Unrelated", not "opposite". car–banana is ${fmt(b.c)}: nearly opposite directions.${dertag}`; }},
  {short: 'the full matrix', phase: 'Matrix', get caption() {
    const n = WORDS.length, pairs = n * (n - 1) / 2, ct = live('car', 'truck').c;
    const M = cosMat(POS), cross = [];
    [IDX.car, IDX.truck].forEach(v => [IDX.cat, IDX.kitten, IDX.dog].forEach(a => cross.push(M[v][a])));
    return `All ${pairs} pairs at once. Diagonal = 1. Vehicles score ${fmt(ct)} with each other and between ${fmt(Math.min(...cross))} and ${fmt(Math.max(...cross))} against animals. This matrix is what a vector database (page 7) computes between your question and every stored chunk.${dertag}`; }}
];

/* =====================================================================
   Plot geometry + drawing
   ===================================================================== */
const S = 52, XMIN = -5.5, YMAX = 5.5, OX = (0 - XMIN) * S, OY = YMAX * S, PLOT_R = 3;
const sx = x => (x - XMIN) * S, sy = y => (YMAX - y) * S;
const NS = 'http://www.w3.org/2000/svg';
function svgEl(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const plot = $('plot');
(function buildGrid() {
  const g = $('gridLayer');
  for (let x = -5; x <= 5; x++) svgEl('line', {x1: sx(x), y1: sy(-4), x2: sx(x), y2: sy(5), class: x ? 'gl' : 'ax'}, g);
  for (let y = -4; y <= 5; y++) svgEl('line', {x1: sx(-5), y1: sy(y), x2: sx(5), y2: sy(y), class: y ? 'gl' : 'ax'}, g);
  for (let x = -5; x <= 5; x++) if (x) { const t = svgEl('text', {x: sx(x), y: sy(0) + 15, class: 'tick', 'text-anchor': 'middle'}, g); t.textContent = x; }
  for (let y = -4; y <= 5; y++) if (y) { const t = svgEl('text', {x: sx(0) - 6, y: sy(y) + 4, class: 'tick', 'text-anchor': 'end'}, g); t.textContent = y; }
  const o = svgEl('text', {x: OX - 6, y: OY + 15, class: 'tick', 'text-anchor': 'end'}, g); o.textContent = '0';
})();
$('normCircle').setAttribute('cx', OX); $('normCircle').setAttribute('cy', OY); $('normCircle').setAttribute('r', PLOT_R * S);

const LBL = {cat: [10, 18, 'start'], kitten: [0, -14, 'middle'], dog: [-12, 4, 'end'], car: [-12, 4, 'end'], truck: [0, -14, 'middle'], banana: [12, 4, 'start']};
const lblEls = [], ptEls = [], hitEls = [];
WORDS.forEach((w, i) => {
  lblEls[i] = svgEl('text', {class: 'lbl', 'text-anchor': LBL[w][2]}, $('lblLayer'));
  ptEls[i] = svgEl('circle', {class: 'pt', r: 7}, $('ptLayer'));
  hitEls[i] = svgEl('circle', {class: 'hit', r: 15, tabindex: 0, role: 'button', 'aria-roledescription': 'draggable point', 'data-i': i}, $('hitLayer'));
});

const dispPos = i => {
  if (!state.norm) return POS[i];
  const u = unit(POS[i]); return [u[0] * PLOT_R, u[1] * PLOT_R];
};
const arrowsOn = () => state.k >= 6 || state.picked;
const pairOf = () => state.sel.length === 2 ? state.sel : null;

function drawPlot() {
  const vis = visSet(state.k), show = arrowsOn(), pr = pairOf();
  $('normCircle').style.display = state.norm ? '' : 'none';
  WORDS.forEach((w, i) => {
    const v = vis.has(i), d = dispPos(i), X = sx(d[0]), Y = sy(d[1]);
    ptEls[i].setAttribute('cx', X); ptEls[i].setAttribute('cy', Y);
    ptEls[i].style.opacity = v ? 1 : 0;
    ptEls[i].classList.toggle('sel', state.sel.includes(i) && show);
    hitEls[i].setAttribute('cx', X); hitEls[i].setAttribute('cy', Y);
    hitEls[i].style.display = v ? '' : 'none';
    hitEls[i].setAttribute('aria-label', `${w} at (${POS[i][0].toFixed(1)}, ${POS[i][1].toFixed(1)}). Arrow keys move it by 0.1. Enter picks it for the angle.`);
    const l = lblEls[i];
    l.setAttribute('x', X + LBL[w][0]); l.setAttribute('y', Y + LBL[w][1]);
    l.textContent = `${w} (${POS[i][0].toFixed(1)}, ${POS[i][1].toFixed(1)})`;
    l.style.opacity = v ? 1 : 0;
    l.classList.toggle('dim', !(state.sel.includes(i) && show));
  });
  // arrows
  const A = $('arrA'), B = $('arrB'), wedge = $('wedge'), arc = $('arc'), al = $('arcLbl');
  [A, B, wedge, arc, al].forEach(e => e.style.display = 'none');
  if (!show) return;
  const setArrow = (el, i) => {
    const d = dispPos(i);
    if (!isVis(i) || !norm2(d)) return false;
    el.setAttribute('x1', OX); el.setAttribute('y1', OY); el.setAttribute('x2', sx(d[0])); el.setAttribute('y2', sy(d[1]));
    el.style.display = ''; return true;

    wedge.setAttribute('d', `M${OX},${OY} L${P0[0]},${P0[1]} A${R},${R} 0 0 ${sweep} ${P1[0]},${P1[1]} Z`); wedge.style.display = '';

/* ===== matrix ===== */
const heat = v => `rgba(242,168,59,${(0.08 + 0.92 * clamp(v, 0, 1)).toFixed(3)})`;
function drawMatrix() {
  const euc = state.euc, k = state.k;
  const M = euc ? eucMat(POS, state.norm) : cosMat(POS);
  const dmax = euc ? Math.max(1e-9, ...M.flat()) : 1;
  const pr = pairOf();
  let h = '<table class="mx" aria-label="' + (euc ? 'Euclidean distance' : 'Cosine similarity') + ' between all six words"><thead><tr><th></th>' + WORDS.map(w => `<th scope="col">${w}</th>`).join('') + '</tr></thead><tbody>';
  WORDS.forEach((wi, i) => {
    h += `<tr><th scope="row" class="rh">${wi}</th>`;
    WORDS.forEach((wj, j) => {
      const open = k >= 10 || (isVis(i) && isVis(j) && (i === j || state.seen.has(pkey(i, j))));
      if (!open) { h += '<td aria-label="not yet revealed">·</td>'; return; }
      const v = M[i][j], isSel = pr && ((pr[0] === i && pr[1] === j) || (pr[0] === j && pr[1] === i));
      const isBad = euc && state.badCell && ((state.badCell[0] === i && state.badCell[1] === j) || (state.badCell[0] === j && state.badCell[1] === i)) && i !== j;
      if (Number.isNaN(v)) { h += '<td><span class="cv">n/a</span></td>'; return; }
      const bg = isBad ? 'rgba(224,138,138,.5)' : heat(euc ? 1 - v / dmax : (v + 1) / 2);
      h += `<td class="${isBad ? 'bad' : isSel ? 'sel' : ''}" style="background:${bg}" title="${euc ? 'Euclidean' : 'cosine'}(${wi}, ${wj}) = ${fmt(v)}"><span class="cv">${fmt(v)}</span></td>`;
    });

  });
  $('mat').innerHTML = h + '</tbody></table>';
  $('mxTitle').textContent = euc ? (state.norm ? 'Euclidean distance (unit vectors)' : 'Euclidean distance matrix') : 'Cosine matrix';
  $('mxLegend').textContent = euc ? 'Brighter amber = smaller distance. Red outline = the cell where distance and cosine disagree.' : 'Brighter amber = higher cosine (−1 faint, +1 bright). Outlined cell = the picked pair.';
}

function drawReadouts() {
  const k = state.k, pr = pairOf(), show = arrowsOn();

  else {
    const a = POS[pr[0]], b = POS[pr[1]], c = cosine(a, b);
    po = Number.isNaN(c) ? `cosine(${WORDS[pr[0]]}, ${WORDS[pr[1]]}) is undefined: one arrow has length 0.`

    t += state.norm ? `Euclidean on unit vectors = √(2 − 2·cos) = ${Number.isNaN(r.c) ? 'n/a' : fmt(Math.sqrt(2 - 2 * r.c))}  (matrix and this line agree)` : r.euc;

    const nm = n => n.idx.map(i => WORDS[i]).join(' / ') + (n.idx.length > 1 ? ' (tie)' : '');

  } else nl.textContent = 'The nearest-word readout appears once the arrows do (step 6).';
}

/* ===== chips, toggles, reset positions ===== */
WORDS.forEach((w, i) => {
  const b = document.createElement('button');

  b.setAttribute('aria-pressed', 'false'); b.setAttribute('aria-label', `Pick ${w} for the angle pair`);
  b.addEventListener('click', () => toggleSel(i));

function toggleSel(i) {
  if (!isVis(i)) return;

  if (at >= 0) state.sel.splice(at, 1);
  else { state.sel.push(i); if (state.sel.length > 2) state.sel.shift(); }
  state.picked = true;
  if (state.sel.length === 2) state.seen.add(pkey(state.sel[0], state.sel[1]));
  refreshAll();
}
$('metricToggle').addEventListener('change', e => { state.euc = e.target.checked; refreshAll(); });
$('normToggle').addEventListener('change', e => { state.norm = e.target.checked; refreshAll(); });
function resetPositions() { POS.forEach((p, i) => { p[0] = DEF[i][0]; p[1] = DEF[i][1]; }); refreshAll(); }
$('resetPos').addEventListener('click', resetPositions);
clearers.push(() => { state.sel = defaultSel(); state.picked = false; state.badCell = null; refreshAll(); });

/* ===== dragging + keyboard ===== */
function movePoint(i, x, y) {
  POS[i][0] = clamp(Math.round(x * 10) / 10, -5, 5);
  POS[i][1] = clamp(Math.round(y * 10) / 10, -4, 5);
  refreshAll();
}
function plotPoint(e) {
  const p = plot.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;

  return [m.x / S + XMIN, YMAX - m.y / S];

  hit.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;

    hit.setPointerCapture(e.pointerId); hit.focus({preventScroll: true}); e.preventDefault();

  hit.addEventListener('pointermove', e => {
    if (!drag || drag.i !== i) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 3) drag.moved = true;
    if (!drag.moved) return;

    if (state.norm) { const n = norm2(POS[i]), pn = norm2(p) || 1; p = [p[0] / pn * n, p[1] / pn * n]; }

    else if (e.key === 'ArrowUp') dy = st; else if (e.key === 'ArrowDown') dy = -st;

/* ===== the Stepper ===== */
function renderMain(k) {
  state.k = k;
  if (k === 0) { POS.forEach((p, i) => { p[0] = DEF[i][0]; p[1] = DEF[i][1]; }); state.norm = false; }
  state.sel = defaultSel(); state.picked = false;
  state.euc = k === 8; state.badCell = k === 8 ? [IDX.cat, IDX.kitten] : null;

  steps: mySteps, resetCaption: 'Six words, two dimensions. Press Step.',
  play: $('ePlay'), step: $('eStep'), reset: $('eReset'), counter: $('eCounter'), caption: $('eCaption'),

/* ===== code blocks (numbers computed from the original coordinates) ===== */
(function codeBlocks() {
  const f1 = v => v.toFixed(1), tup = n => `(${f1(D(n)[0])}, ${f1(D(n)[1])})`;
  $('codeBlk1').textContent =
`# plain Python, standard library only: nothing to pip install
# → https://docs.python.org/3/library/math.html   (math.hypot, math.dist)
import math

def cosine(a, b):
    dot = sum(x * y for x, y in zip(a, b))
    return dot / (math.hypot(*a) * math.hypot(*b))

def euclid(a, b):
    return math.dist(a, b)

cat, kitten, dog = ${tup('cat')}, ${tup('kitten')}, ${tup('dog')}
print(cosine(cat, dog))        # ${fmt(cosine(D('cat'), D('dog')))}
print(cosine(cat, kitten))     # ${fmt(cosine(D('cat'), D('kitten')))}
print(euclid(cat, dog), euclid(cat, kitten))   # euclid ${fmt(euclid(D('cat'), D('dog')))} / ${fmt(euclid(D('cat'), D('kitten')))}`;
  $('codeBlk3').textContent =
`# pip install numpy
# → https://numpy.org/doc/stable/reference/generated/numpy.linalg.norm.html
import numpy as np

v = np.array([2.0, 1.0])
u = v / np.linalg.norm(v)
# after normalising, cosine == dot product`;
})();

/* keyboard: main animation = main */
document.addEventListener('keydown', e => {
  const ae = document.activeElement;
  if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(ae.tagName) && e.key !== 'Escape') return;
  if (ae.classList && ae.classList.contains('hit') && e.key !== 'Escape') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); main.pause(); main.step(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); main.pause(); main.go(main.k - 1); }
  else if (e.key === ' ') { e.preventDefault(); main.play(); }
  else if (e.key.toLowerCase() === 'r') { main.reset(); clearFocusStates(); }

/* URL params: ?step=N jumps the main animation; ?t=seconds maps onto its steps */
if (Q.has('step')) main.go(parseInt(Q.get('step'), 10) || 0);
else if (Q.has('t')) main.go(Math.floor((parseFloat(Q.get('t')) || 0) / 2.4));

/* ===== SELFTEST (spec values from _spec/3-embeddings.md) ===== */
(function selftest() {
  const fails = [];
  const near = (a, b, eps = 5e-4) => Math.abs(a - b) <= eps;
  const nearArr = (A, B, eps = 5e-4) => A.length === B.length && A.every((v, i) => near(v, B[i], eps));
  const check = (name, ok) => { if (!ok) fails.push(name); };
  const P = DEF.map(p => p.slice()), g = n => P[IDX[n]];
  check('cos cat,dog', near(cosine(g('cat'), g('dog')), 0.992));
  check('cos cat,kitten', near(cosine(g('cat'), g('kitten')), 1.0));
  check('cos dog,car', near(cosine(g('dog'), g('car')), 0.0));
  check('cos car,banana', near(cosine(g('car'), g('banana')), -0.912));
  check('cos cat,car', near(cosine(g('cat'), g('car')), -0.124));
  check('euclid cat,dog', near(euclid(g('cat'), g('dog')), 1.414));
  check('euclid cat,kitten', near(euclid(g('cat'), g('kitten')), 2.236));
  check('euclid car,truck', near(euclid(g('car'), g('truck')), 1.414));
  const COS = [1, 1, .992, -.124, -.179, -.294, 1, 1, .992, -.124, -.179, -.294, .992, .992, 1, 0, -.055, -.410,
    -.124, -.124, 0, 1, .998, -.912, -.179, -.179, -.055, .998, 1, -.888, -.294, -.294, -.410, -.912, -.888, 1];
  check('cos matrix', nearArr(cosMat(P).flat(), COS));
  const EUC = [0, 2.236, 1.414, 4.472, 5.831, 4.272, 2.236, 0, 1.000, 6.083, 7.280, 6.103, 1.414, 1.000, 0, 5.099, 6.325, 5.590,
    4.472, 6.083, 5.099, 0, 1.414, 6.500, 5.831, 7.280, 6.325, 1.414, 0, 7.826, 4.272, 6.103, 5.590, 6.500, 7.826, 0];
  check('euclid matrix', nearArr(eucMat(P, false).flat(), EUC));
  const ang = (a, b) => angleDeg(g(a), g(b));
  check('angles', near(ang('cat', 'kitten'), 0, 0.05) && near(ang('cat', 'dog'), 7.1, 0.05) && near(ang('dog', 'car'), 90, 0.05) &&
    near(ang('car', 'truck'), 3.2, 0.05) && near(ang('cat', 'car'), 97.1, 0.05) && near(ang('car', 'banana'), 155.8, 0.05));
  check('norms', near(norm2(g('cat')), 2.236) && near(norm2(g('kitten')), 4.472) && near(norm2(g('dog')), 3.606) && near(norm2(g('banana')), 3.041) && near(norm2(g('truck')), 5));
  check('dots', dotp(g('cat'), g('kitten')) === 10 && dotp(g('cat'), g('dog')) === 8 && dotp(g('cat'), g('car')) === -1 && dotp(g('dog'), g('car')) === 0);
  check('denominators', near(norm2(g('cat')) * norm2(g('dog')), 8.062));

  check('normalised euclid', near(NE[IDX.cat][IDX.kitten], 0) && near(NE[IDX.dog][IDX.car], 1.414) && near(NE[IDX.car][IDX.banana], 1.955));

    <h1>4 · Attention — a soft dictionary lookup, and the block built around it</h1>
    <p class="lede">Every token asks a question, every token advertises what it holds, and the match scores decide how much of each token's content is fetched. Compute one head by hand, mask it, split it into heads, wrap it in a Transformer block, then see why a set needs RoPE to know order.</p>
    <p class="hint">Keyboard: <kbd>→</kbd> step · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight. URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation, <code>?rope=N</code> jumps the RoPE animation, <code>?t=seconds</code> maps onto steps.</p>
  </div>
</header>

<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>The student glances around the desk</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">👀</div>
      <div>
        <p>The student sits at the desk (page 1) with the exam sheet cut into chunks (page 2), each chunk already in its seat (page 3). Reading one chunk, the student <b>glances around the desk</b>: "which other chunks help me understand this one?" Every chunk holds up a label (its Key); the student's glance carries a question (the Query); the better a label answers the question, the longer the glance; and what the student takes from each chunk is its content (the Value), in proportion to the glance. Because the glances are divided out to sum to 1, the result is a blend.</p>
        <p>The formula <code>softmax(QKᵀ/√d_k)·V</code> is that sentence in symbols. Doing it with several glance-styles at once (one for grammar, one for who-refers-to-whom…) is multi-head attention; wrapping it with a normaliser, an "add it back" wire and a small per-token calculator (FFN) is a Transformer block; stacking N blocks is the model.</p>
        <div class="metaphor">
          <div><b>Query</b>the question this token is asking</div>
          <div><b>Key</b>the label each token holds up</div>
          <div><b>Value</b>the content handed over</div>
          <div><b>Softmax</b>sharing one unit of glance across the desk</div>
          <div><b>Causal mask</b>you cannot glance at words not yet written</div>
          <div><b>RoPE</b>rotating labels by seat position so distance is visible</div>
        </div>
      </div>
    </div>
    <div class="hook" style="margin-top:20px">
      <span class="eyebrow">The counterintuitive part</span>
      <p><b>Attention is a dictionary lookup where every key matches a little.</b> A normal dictionary returns one value; attention returns a weighted average of all of them. The <code>÷√d_k</code> exists for one reason only: to stop the softmax from saturating into a hard one-hot lookup, so gradients keep flowing. And because the lookup is over a <i>set</i>, the model has no idea which word came first until positions are rotated in (RoPE).</p>
    </div>
  </div>
</section>

      <pre class="codeblk" id="code1"><code># pip install numpy
# → https://numpy.org/doc/stable/   (NumPy docs; plain NumPy, no other library)
import numpy as np

tokens = ["The", "cat", "sat", "on", "mat"]
Q = np.array([[1,0,1,0],[0,2,0,1],[1,1,0,0],[0,0,1,2],[2,0,0,1]], float)
K = np.array([[1,0,0,1],[0,2,1,0],[1,1,1,0],[0,1,0,2],[2,0,1,1]], float)
V = np.array([[1,0,0,1],[0,1,1,0],[1,1,0,0],[0,0,2,1],[2,0,1,0]], float)

def attention(Q, K, V, causal=False):
    d_k = Q.shape[1]
    S = Q @ K.T / np.sqrt(d_k)                       # steps 4-5: scores, then scaled
    if causal:                                       # step 12: no peeking ahead
        S = np.where(np.triu(np.ones_like(S), 1) == 1, -np.inf, S)
    P = np.exp(S - S.max(1, keepdims=True))          # steps 7-9: softmax, row by row
    P /= P.sum(1, keepdims=True)
    return P @ V, P                                  # steps 10-11: weighted sum of Values

O, P = attention(Q, K, V)
print(P[1].round(3))   # [0.079 0.355 0.131 0.355 0.079]   row "cat"</code></pre>

# → https://numpy.org/doc/stable/   (same attention() as above)
heads = [attention(Q[:, i:i+2], K[:, i:i+2], V[:, i:i+2]) for i in (0, 2)]   # two heads, d_k = 2
out = np.concatenate([h[0] for h in heads], axis=1)                          # concat back to [5, 4]
print(heads[0][1][1].round(3))   # head 1, row "cat": [0.037 0.623 0.152 0.152 0.037]
print(heads[1][1][1].round(3))   # head 2, row "cat": [0.199 0.098 0.098 0.404 0.199]</code></pre>
      <pre class="codeblk" id="code4"><code># pip install numpy
# → https://numpy.org/doc/stable/   (plain-Python pseudocode of the block; attn, ffn, g1, g2 are
#   the layer's learned pieces and are not defined here, so no library API is assumed)
def rmsnorm(x, g, eps=1e-5):
    return x / np.sqrt(np.mean(x**2, axis=-1, keepdims=True) + eps) * g

def block(x):
    h = x + attn(rmsnorm(x, g1))        # normalise a copy, attention, add back (residual)
    return h + ffn(rmsnorm(h, g2))      # normalise a copy, per-token MLP, add back

for layer in range(N):                  # N = 32 for Llama 3 8B, 80 for 70B (notes' config table)
    x = block(x)</code></pre>

  <div class="wrap">
    <span class="eyebrow">Secondary animation · RoPE</span>
    <h2>RoPE: rotate the labels by seat number</h2>
    <p class="hint-sm">Everything above treats the tokens as a set. RoPE injects order by rotating each (even, odd) pair of dimensions of Q and K by an angle proportional to the token's position. Below: one pair, drawn on a circle, with θ = 1 radian per position for clarity.</p>
    <div class="controls" role="group" aria-label="RoPE animation controls">
      <button class="btn primary" id="rPlay" aria-label="Play RoPE animation">▶ Play</button>
      <button class="btn" id="rStep" aria-label="Advance one RoPE step">Step ›</button>
      <button class="btn" id="rReset" aria-label="Reset RoPE animation">Reset</button>
      <div class="counter" id="rCounter" aria-live="polite">Step 0 of 8</div>
    </div>
    <div class="caption" id="rCaption" aria-live="polite">Two vectors on a circle; the slider is the token position.</div>

          <figure id="fig2" hidden><svg class="circ" id="ropeSvg2" viewBox="0 0 300 300" role="img" aria-label="Unit circle for the slow-rotating dimension pair"></svg><figcaption id="figB"></figcaption></figure>
        </div>
      </div>
      <div>
        <div class="sliderrow">
          <label for="posSlider">Position m of the query q = (1, 0) <span class="val" id="posVal">0</span></label>
          <input type="range" id="posSlider" min="0" max="7" step="1" value="0" aria-describedby="posHint">

        </div>
        <div class="sliderrow">
          <label for="posSlider2">Position n of the key k = (0.6, 0.8) <span class="val" id="posVal2">3</span></label>
          <input type="range" id="posSlider2" min="0" max="7" step="1" value="3" aria-describedby="posHint2">

        <table class="rt" id="ropeTab" style="margin-top:12px" aria-label="Rotated query at positions 0 to 7"></table>

    <div class="codelbl">Code for this section</div>
    <pre class="codeblk" id="code3"><code># pip install numpy
# → https://numpy.org/doc/stable/   (plain NumPy 2-D rotation)
import numpy as np
def rot(v, m, theta=1.0):                  # rotate a 2-D vector by m*theta radians
    a = m * theta
    c, s = np.cos(a), np.sin(a)
    return np.array([v[0]*c - v[1]*s, v[0]*s + v[1]*c])

q, k = np.array([1.0, 0.0]), np.array([0.6, 0.8])
for m, n in [(0, 3), (2, 5), (4, 7)]:      # same gap n - m = 3
    print(m, n, round(float(rot(q, m) @ rot(k, n)), 3))   # -0.707 every time

# --- the notes' full version (Section 57.4), for a real head ---
# pip install torch
# → https://pytorch.org/docs/stable/   (PyTorch docs)
import torch

def rope(x, positions, base=500_000.0):
    """
    x: [B, heads, n, head_dim]   positions: [n]
    Rotates pairs (x[..., 2i], x[..., 2i+1]) by angle positions * theta_i.
    """
    B, H, n, d = x.shape
    i = torch.arange(0, d, 2, device=x.device, dtype=torch.float32)   # 0, 2, 4, ..., d-2
    theta = base ** (-i / d)                        # [d/2]  frequency per dimension pair
    angles = positions[:, None].float() * theta[None, :]   # [n, d/2] = m * theta_i
    cos, sin = angles.cos(), angles.sin()           # [n, d/2]
    x1, x2 = x[..., 0::2], x[..., 1::2]             # even dims, odd dims  [B,H,n,d/2]
    # 2D rotation applied to each pair:  (x1, x2) -&gt; (x1 cos - x2 sin, x1 sin + x2 cos)
    out = torch.empty_like(x)
    out[..., 0::2] = x1 * cos - x2 * sin
    out[..., 1::2] = x1 * sin + x2 * cos
    return out

# Verify the relative-position property: q_m . k_n depends only on (n - m)
q = torch.randn(1, 1, 1, 128); k = torch.randn(1, 1, 1, 128)
s1 = (rope(q, torch.tensor([3])) * rope(k, torch.tensor([7]))).sum()     # positions 3, 7  (gap 4)
s2 = (rope(q, torch.tensor([10])) * rope(k, torch.tensor([14]))).sum()   # positions 10, 14 (gap 4)
assert torch.allclose(s1, s2, atol=1e-4)
print("RoPE: dot product depends only on relative position")</code></pre>

<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">The formula</div><div class="v">softmax(QKᵀ/√d_k)·V</div><div class="d">Scaled dot-product attention, defined in Vaswani et al. 2017, §3.2.1. <a href="https://arxiv.org/abs/1706.03762">Attention Is All You Need</a> <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">Why ÷√d_k</div><div class="v">Keeps score variance ≈ 1</div><div class="d">For unit-variance components, var(q·k) = d_k, so std = √d_k. Here d_k = 4: std 2, divide by 2. At d_k = 128 the std is √128 ≈ 11.3. Dividing restores std ≈ 1 so softmax does not saturate. The toy shows 0.527 vs 0.805 on <code>mat</code>. <span class="tag der">DERIVED</span></div></div>
      <div class="fact"><div class="k">Causal mask</div><div class="v">−∞ above the diagonal → weight exactly 0</div><div class="d">A token may attend only to positions ≤ its own; otherwise training leaks the answer. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Multi-head</div><div class="v">Several lookups in parallel, concatenated</div><div class="d">Each head has its own W_q, W_k, W_v; heads specialise (syntax, coreference…). <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">RoPE</div><div class="v">Rotate Q and K by position; Q·K depends on distance only</div><div class="d">R_mᵀ R_n = R_(n−m), with zero extra parameters. <a href="https://arxiv.org/abs/2104.09864">Su et al. 2021</a> <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">The block</div><div class="v">norm → attention → add → norm → FFN → add, × N</div><div class="d">Pre-norm with residual connections; the FFN is per-token. Llama 3 8B: 32 layers; 70B: 80 layers; head_dim 128 — taken from the notes' config table, not checked against a model card. <span class="tag unv">UNVERIFIED</span></div></div>
    </div>
  </div>
</section>

<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li>Q, K, V here are hand-picked integers "already projected"; in a model they are x·W_q, x·W_k, x·W_v with learned W's. The page skips that multiply so every number is checkable.</li>
        <li>√d_k with d_k = 4 only halves the scores; the saturation effect is dramatic at d_k = 128 (notes §57.4: std ≈ 11.3 without scaling). The toggle shows the direction of the effect, not its real size.</li>
        <li>Multi-head in practice also has an output projection W_o after the concatenation, and modern models share K/V across query heads (GQA). Neither is drawn.</li>
        <li>The block drawn is the modern pre-norm (RMSNorm) Llama-style block, not the 2017 post-norm original.</li>
        <li>RoPE's θ = 1 rad per position is the first frequency pair only; real heads use d/2 different frequencies, and the Llama 3 base of 500,000 is a model-card fact <span class="tag unv">UNVERIFIED</span> here.</li>
        <li>Layer counts and dimensions quoted from the notes (32/80 layers, 8192→28672) are config-file facts <span class="tag unv">UNVERIFIED</span>; verify on the model card before repeating.</li>
      </ul>
    </div>
  </div>
</section>

<section id="quiz">
  <div class="wrap quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. Explain attention as a dictionary lookup in two sentences.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">A normal dictionary returns one value for an exact key. Attention compares the query against every key, turns the match scores into weights that sum to 1 (softmax), and returns the weighted average of all values: a soft lookup where every key matches a little.</div></div>
    <div class="q"><p>2. Why divide by √d_k? The interviewer says "to make the numbers smaller".</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">That misses the point. Dot products of d-dimensional unit-variance vectors have variance d, so the scores grow like √d. Dividing by √d restores variance 1, so softmax stays soft and gradients flow. The page shows row <code>mat</code> going 0.527 → 0.805 on itself when the scaling is skipped, and at d_k = 128 the effect is much bigger.</div></div>
    <div class="q"><p>3. In the toy, why is row <code>mat</code> identical with and without the causal mask?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans"><code>mat</code> is the last token; it may see all five tokens either way, so nothing is masked in its row.</div></div>
    <div class="q"><p>4. Compute the causal softmax of row <code>cat</code> by hand.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Only <code>The</code> and <code>cat</code> are visible: scaled scores 0.5 and 2.0. exp = 1.649 and 7.389; sum 9.038 → 0.182 and 0.818. The other three weights are exactly 0.</div></div>
    <div class="q"><p>5. Page 3 gave "bank" one embedding. Where exactly does context get mixed in?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Step 10 of the animation: the output for a token is a weighted sum of the Values of all tokens. "bank" next to "river" pulls in river's Value and comes out as a different vector than "bank" next to "loan".</div></div>
    <div class="q"><p>6. Why do positions need RoPE if tokens already arrive in order in the prompt?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Attention is a set operation: permuting the tokens permutes the rows and columns but gives the same per-token outputs (step 16 recomputes it). RoPE rotates Q and K by position so the score Q·K depends on the gap n − m (−0.707 for every gap-3 pair in the demo).</div></div>

<script>
/* =====================================================================

const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const REDUCED = STILL || window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ?scrollto=<id>: bring a section to the top (used for headless screenshots; shifts instead of scrolling) */

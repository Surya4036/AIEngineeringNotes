<!-- ============ 5. FACTS ============ -->
<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">Context window</div><div class="v">The only memory</div><div class="d">Prompt plus everything generated so far. Exceed it and tokens are dropped or the call fails. Nothing carries over to the next request. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">In-context learning</div><div class="v">Pattern completion, not weight change</div><div class="d">Few-shot examples are read, not trained on; they vanish with the request. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Chain-of-thought</div><div class="v">"Think step by step" → intermediate tokens</div><div class="d">Wei et al. 2022 report that eliciting intermediate reasoning steps improves multi-step reasoning. <a href="https://arxiv.org/abs/2201.11903">arxiv.org/abs/2201.11903</a> <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">ReAct</div><div class="v">Thought → Action → Observation loop</div><div class="d">Yao et al. 2022 interleave reasoning with tool calls. <a href="https://arxiv.org/abs/2210.03629">arxiv.org/abs/2210.03629</a> <span class="tag doc">DOC</span> The reported gains (34 and 10 points absolute on ALFWorld and WebShop) are quoted from the notes, not checked here. <span class="tag unv">UNVERIFIED</span></div></div>
      <div class="fact"><div class="k">System vs user</div><div class="v">Both are tokens; training makes system weigh more</div><div class="d">More robust to override attempts, not immune. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Reproducible prompts</div><div class="v">Version prompt + model ID, T = 0, log, regression-eval</div><div class="d">Version the prompt text with the model ID, use T = 0 where possible, log the rendered prompt, and re-run an eval on every change. T = 0 is still not fully deterministic (page 5). <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">The few-shot desk</div><div class="v"><span data-n="fsTotal"></span> tokens ≈ <span data-n="fsPct"></span> % of an <span data-n="winDemo"></span>-token window</div><div class="d"><span data-n="fsSum"></span> = <span data-n="fsTotal"></span>; <span data-n="fsTotal"></span> ÷ <span data-n="winDemo"></span> = <span data-n="fsPct"></span> %. Every token is billed (page 2) and uses window; the two examples cost more than the real question. <span class="tag der">DERIVED</span></div></div>
    </div>
  </div>
</section>

<!-- ============ 6. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li><b>Token counts are estimates.</b> They use the 4-characters-per-token rule of thumb from page 2; a real tokenizer will differ, often by around ±20 %. <span class="tag">COMMON PRACTICE</span></li>
        <li><b>The outputs are illustrative.</b> <code>NEGATIVE</code>, the JSON ticket, <code>Answer: 3</code> and the weather line are the notes' example outputs, not recorded API responses. The weather reading (14°C, light rain) is invented. <span class="tag unv">UNVERIFIED</span></li>
        <li><b>"Few-shot is not learning" is a statement about weights.</b> Some research treats in-context learning as a kind of implicit optimisation. The safe wording: no parameter changes; behaviour is conditioned by the context.</li>
        <li><b>Reasoning models change the picture.</b> Models that think internally gain less from an explicit "step by step" instruction. The effect size depends on the model and the task, and I have not measured it here. <span class="tag unv">UNVERIFIED</span></li>
        <li><b>Model-selection advice is time-sensitive.</b> The notes' §3 model names, prices and release dates are not reproduced on this page because they could not be verified. The criteria are stable; the leaderboard is not.</li>
        <li><b>The ReAct harness is simplified.</b> Real agent loops stop generation before the model invents its own Observation, validate tool arguments, and cap iterations. The skeleton shows the shape only.</li>
      </ul>
    </div>
  </div>
</section>

<!-- ============ 7. QUIZ ============ -->
<section id="quiz">
  <div class="wrap quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. An interviewer says: "few-shot prompting teaches the model your format." Sharpen that.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">It conditions the model. The examples are tokens in the context that the model pattern-completes; no weights change (page 1) and nothing persists past the request. Remove the examples tomorrow and the format is gone.</div></div>
    <div class="q"><p>2. System prompt vs user message: what is the actual difference?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Both are tokens in the same window. The difference is training: models are fine-tuned to treat the system role as higher-priority instructions. That makes it more robust to override attempts, but not immune.</div></div>
    <div class="q"><p>3. Why does "think step by step" help a model that generates one token at a time (page 5)?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Each reasoning token is written to the desk and read back, so the computation is spread across many forward passes instead of one. Skipping straight to the answer forces a single pass to do all the arithmetic.</div></div>
    <div class="q"><p>4. In ReAct, who runs the tool?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">The harness (your code), not the model. The model writes an Action string; your code executes it and appends the Observation to the context; the model reads it on the next pass.</div></div>
    <div class="q"><p>5. The desk holds <span data-n="fsTotal"></span> tokens for the few-shot request. Where did that come from, and why does it matter?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans"><span data-n="fsSum"></span> = <span data-n="fsTotal"></span>: system, then two example pairs, then the real ask, by the ≈4-characters-per-token rule. Every one is billed (page 2) and consumes window; two examples here cost more than the actual question.</div></div>
    <div class="q"><p>6. How do you choose a model without quoting a leaderboard?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">By criteria: quality needed vs cost per token, whether data may leave your servers, whether you need to fine-tune (open weights), licence terms, context length, and a repeatable eval set to compare candidates on your own task.</div></div>
  </div>
</section>

<script>
/* =====================================================================
   Week-1 shared helpers (copy to every page; keep each file self-contained)
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const STILL = Q.has('still');
const REDUCED = STILL || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (STILL) {
  const s = document.createElement('style');
  s.textContent = 'html{scroll-behavior:auto!important}*,*::before,*::after{transition:none!important;animation:none!important}';
  document.head.appendChild(s);
}
/* ?scrollto=<id>: bring a section to the top (used for headless screenshots; shifts instead of scrolling) */
if (Q.has('scrollto')) window.addEventListener('load', () => {
  const el = document.getElementById(Q.get('scrollto'));
  if (el) { const top = el.getBoundingClientRect().top + window.scrollY; document.body.style.marginTop = (-top) + 'px'; }
});
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 3) => (Math.round(v * 10 ** d) / 10 ** d).toFixed(d);

/* Stepper: Play / Step / Reset with "Step N of M — caption".
   steps[k-1] is applied when at step k (1..M); step 0 is the reset state.
   render(k) must be idempotent: it draws the full state for step k.          */
function Stepper(o) {
  const M = o.steps.length;
  let k = 0, timer = null;
  const api = {
    get k() { return k; }, M,
    go(n, {silent = false} = {}) {
      k = clamp(n, 0, M);
      const st = k ? o.steps[k - 1] : null;
      o.counter.innerHTML = `Step <b>${k}</b> of ${M}` + (st && st.short ? ` — ${st.short}` : '');
      o.caption.innerHTML = (st && st.phase ? `<span class="phase">${st.phase}</span>` : '') + (st ? st.caption : o.resetCaption);
      o.render(k, silent);
      if (k >= M) api.pause();
    },
    step() { if (k >= M) return; api.go(k + 1); },
    play() {
      if (STILL) { api.step(); return; }          // ?still: Play degrades to a single Step
      if (timer) { api.pause(); return; }
      if (k >= M) api.go(0);
      o.play.setAttribute('aria-pressed', 'true'); o.play.textContent = '❚❚ Pause';
      api.step();
      timer = setInterval(() => { if (k >= M) api.pause(); else api.step(); }, o.interval || 2200);
    },
    pause() {
      if (timer) clearInterval(timer); timer = null;
      o.play.setAttribute('aria-pressed', 'false'); o.play.textContent = '▶ Play';
    },
    reset() { api.pause(); api.go(0); }
  };
  o.play.addEventListener('click', api.play);
  o.step.addEventListener('click', () => { api.pause(); api.step(); });
  o.reset.addEventListener('click', api.reset);
  api.go(0, {silent: true});
  return api;
}

/* Quiz reveal */
document.querySelectorAll('.quiz .q .btn').forEach(b => b.addEventListener('click', () => {
  const q = b.closest('.q'), open = !q.classList.contains('open');
  q.classList.toggle('open', open);
  b.setAttribute('aria-expanded', String(open));
  b.textContent = open ? 'Hide answer' : 'Show answer';
}));

/* Global "ways back": Esc and click-on-empty-space clear any focused/highlighted state */
const clearers = [];
function clearFocusStates() { clearers.forEach(f => f()); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearFocusStates(); });
document.addEventListener('click', e => {
  if (e.target === document.body || e.target.tagName === 'SECTION' || e.target.classList.contains('wrap')) clearFocusStates();
});

/* =====================================================================
   Page 6 — data (all numbers below are computed from these strings)
   ===================================================================== */
const estTokens = s => Math.ceil(s.length / 4);
const sumTok = bs => bs.reduce((a, b) => a + estTokens(b.text), 0);
const fmtN = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const COFFEE = 4, MUFFIN = 3, COFFEES = 3, PAID = 21;
const cotA = COFFEES * COFFEE;          // 12
const cotB = PAID - cotA;               // 9
const cotC = cotB / MUFFIN;             // 3
const COT_LINES = [
  `Step 1: ${COFFEES} coffees × $${COFFEE} = $${cotA}`,
  `Step 2: $${PAID} − $${cotA} = $${cotB} remaining`,
  `Step 3: $${cotB} ÷ $${MUFFIN} per muffin = ${cotC} muffins`,
  `Answer: ${cotC}`
];
const TXT = {
  zs: "Classify the sentiment as POSITIVE, NEGATIVE or NEUTRAL: " + "'The battery died after two days.' Reply with one word only.",
  zsOut: 'NEGATIVE',
  sys: "You convert customer support messages into structured JSON tickets. " + "Always return valid JSON with these keys: order_id, issue, urgency (low/medium/high).",
  u1: 'My order #551 never arrived.',
  a1: '{"order_id": "551", "issue": "not_delivered", "urgency": "high"}',
  u2: 'Order 887 is fine, just checking my points balance.',
  a2: '{"order_id": "887", "issue": "loyalty_inquiry", "urgency": "low"}',
  u3: 'Order 9012 arrived smashed, I need a replacement for a party tomorrow!',
  fsOut: '{"order_id": "9012", "issue": "damaged", "urgency": "high"}',
  cot: "Coffee costs $4, muffins cost $3. " + "Sam buys 3 coffees and some muffins and pays exactly $21. " + "How many muffins did Sam buy? " + "Think step by step, then write 'Answer: N' on the last line.",
  re: 'What is the current weather in the city where the Eiffel Tower is?'
};
const REACT = [
  {kind: 'T',   text: 'Thought: I need to find the city first, then get its weather.'},
  {kind: 'A',   text: 'Action: web_search("Eiffel Tower location")'},
  {kind: 'O',   text: 'Observation: The Eiffel Tower is located in Paris, France.'},
  {kind: 'T',   text: 'Thought: Now I know the city. Get the weather.'},
  {kind: 'A',   text: 'Action: get_weather("Paris, France")'},
  {kind: 'O',   text: 'Observation: 14°C, light rain, wind 15 km/h'},
  {kind: 'T',   text: 'Thought: I have all the information I need.'},
  {kind: 'ANS', text: 'Answer: The Eiffel Tower is in Paris, France. Current weather: 14°C, light rain.'}
];
const WHO = {sys: 'system', usr: 'user', asst: 'assistant', obs: 'tool result'};
const mk = (id, role, text) => ({id, role, who: WHO[role], text});
const reBlock = (s, i) => mk('re' + i, s.kind === 'O' ? 'obs' : 'asst', s.text);
const reBlocks = n => [mk('reU', 'usr', TXT.re)].concat(REACT.slice(0, n).map(reBlock));

let shots = 2;            // few-shot example pairs (slider)
let winSize = 8000;       // demo window (select)
const WIN_DEMO = 8000;

function fewBlocks(n, withAsk) {
  const b = [mk('fsS', 'sys', TXT.sys)];
  if (n >= 1) b.push(mk('fsU1', 'usr', TXT.u1), mk('fsA1', 'asst', TXT.a1));
  if (n >= 2) b.push(mk('fsU2', 'usr', TXT.u2), mk('fsA2', 'asst', TXT.a2));
  if (withAsk) b.push(mk('fsU3', 'usr', TXT.u3));
  return b;
}
const fewTotal = n => sumTok(fewBlocks(n, true));
const pctOf = (t, w) => fmt(t / w * 100, 1);

/* the state of the desk at step k (pure function of k, shots) */
function stateFor(k) {
  const S = {blocks: [], out: [], wipe: 'none', stagger: null, why: false, ph: 'The model\'s reply appears here after it has read the desk.'};
  if (k <= 1) { S.ph = 'Nothing yet: the model has not been asked anything.'; }
  else if (k === 2) { S.blocks = [mk('zs', 'usr', TXT.zs)]; }
  else if (k === 3) { S.blocks = [mk('zs', 'usr', TXT.zs)]; S.out = [{text: TXT.zsOut}]; S.wipe = 'after'; }
  else if (k === 4) { S.blocks = fewBlocks(0, false); }
  else if (k === 5) { S.blocks = fewBlocks(shots, false); }
  else if (k === 6) {
    S.blocks = fewBlocks(shots, true);
    S.out = shots === 2 ? [{text: TXT.fsOut}] : [{note: true, text: 'Format not pinned down: with ' + (shots ? 'one example' : 'no examples') + ' the reply could be JSON, prose, or different keys. (Not a recorded response.)'}];
  }
  else if (k === 7) { S.blocks = fewBlocks(shots, true); S.wipe = 'now'; S.ph = 'Request over: nothing was kept.'; }
  else if (k === 8) { S.blocks = [mk('cot', 'usr', TXT.cot)]; }
  else if (k === 9 || k === 10) {
    S.blocks = [mk('cot', 'usr', TXT.cot)].concat(COT_LINES.map((t, i) => mk('cotL' + i, 'asst', t)));
    S.out = COT_LINES.map(t => ({text: t}));
    if (k === 9) S.stagger = 1;
    if (k === 10) S.why = true;
  }
  else if (k === 11) { S.blocks = reBlocks(1); S.out = [{text: REACT[0].text}]; }
  else if (k === 12) { S.blocks = reBlocks(3); S.out = [{text: REACT[1].text}, {note: true, text: '→ the harness (your code) runs the tool and writes the Observation. The model only wrote text.'}]; }
  else if (k === 13) { S.blocks = reBlocks(6); S.out = [{text: REACT[3].text}, {text: REACT[4].text}]; }
  else if (k >= 14) { S.blocks = reBlocks(8); S.out = [{text: REACT[6].text}, {text: REACT[7].text}]; S.wipe = 'after'; }
  return S;
}
const tabOf = k => k >= 11 ? 3 : k >= 8 ? 2 : k >= 4 ? 1 : k >= 2 ? 0 : -1;
const codeOf = k => k <= 1 ? -1 : tabOf(k);

/* =====================================================================
   Code blocks (one per technique; faithful to notes §4)
   ===================================================================== */
const OPENAI_DOC = '<a href="https://platform.openai.com/docs/api-reference/chat">OpenAI chat API reference</a> <span class="tag doc">DOC</span>';
const CODE = [
  {head: 'Zero-shot. Library docs: ' + OPENAI_DOC, body:
`# pip install openai

client = OpenAI()   # reads OPENAI_API_KEY from environment variable
MODEL = "gpt-4o"    # placeholder — replace with your current model

def ask(messages, temperature=0.0):
    response = client.chat.completions.create(
        model=MODEL,
        messages=messages,
        temperature=temperature
    )
    return response.choices[0].message.content  # extract the text

    "role": "user",

`# pip install openai
# → https://platform.openai.com/docs/api-reference/chat   (ask() is the helper from the zero-shot step)
# Wei et al. (2022) showed this simple instruction greatly improves math & logic tasks
# → https://arxiv.org/abs/2201.11903
answer = ask([{"role": "user", "content":
    "Coffee costs $4, muffins cost $3. "

`# pip install openai   (only for ask(); the loop below is plain Python, no agent library)
# → https://platform.openai.com/docs/api-reference/chat
# ReAct pattern → https://arxiv.org/abs/2210.03629

def web_search(q):   return "stub: call your search tool here"   # stubs: replace with real tools
def get_weather(c):  return "stub: call your weather API here"
TOOLS = {"web_search": web_search, "get_weather": get_weather}

def parse_action(text):
    # plain-Python parse of a line like:  Action: web_search("Eiffel Tower location")
    line = [l for l in text.splitlines() if l.startswith("Action:")][-1]
    name, rest = line[len("Action:"):].strip().split("(", 1)
    return name, rest.rsplit(")", 1)[0].strip('"')

/* =====================================================================
   Interactive 1 — the desk
   ===================================================================== */
const deskEl = $('desk'), outEl = $('outBox'), whyEl = $('whyBox');
let lastIds = [], wipeT = null, revealT = null;
const blockHTML = (b, isNew) => `<div class="blk ${b.role}${isNew ? ' new' : ''}"><div class="who">${esc(b.who)}<small>${estTokens(b.text)} tok</small></div><div class="tx">${esc(b.text)}</div></div>`;

function setMeter(t) {
  $('mTok').textContent = fmtN(t);
  $('mWin').textContent = fmtN(winSize);
  $('mPct').textContent = pctOf(t, winSize) + ' % of the window';
  $('mBar').style.width = (t > 0 ? Math.max(0.6, t / winSize * 100) : 0) + '%';
}
function drawDesk(blocks, wipedWas) {
  if (wipedWas != null) {
    deskEl.innerHTML = `<div class="desk-wiped"><b>Desk wiped</b>It held ${fmtN(wipedWas)} tokens. The next request starts empty: nothing was kept.</div>`;
    lastIds = [];
  } else if (!blocks.length) {
    deskEl.innerHTML = '<div class="desk-empty">Empty desk. The model remembers nothing from any earlier request.</div>';
    lastIds = [];
  } else {
    deskEl.innerHTML = blocks.map(b => blockHTML(b, !REDUCED && lastIds.length && !lastIds.includes(b.id))).join('');
    lastIds = blocks.map(b => b.id);
  }
}
function drawOut(items, ph) {
  outEl.innerHTML = items.length
    ? items.map(o => o.note ? `<div class="ph">${esc(o.text)}</div>` : `<div>${esc(o.text)}</div>`).join('')
    : `<span class="ph">${esc(ph)}</span>`;
}
const workTok = estTokens(COT_LINES[0]) + estTokens(COT_LINES[1]) + estTokens(COT_LINES[2]);
function whyHTML() {
  return `<div class="why"><b>Why it helps.</b> The working is ${workTok} tokens (${estTokens(COT_LINES[0])} + ${estTokens(COT_LINES[1])} + ${estTokens(COT_LINES[2])}, by ⌈chars ÷ 4⌉), so ${workTok} extra forward passes run, each re-reading the desk, before the answer is written. <span class="tag der">DERIVED</span> Skipping straight to "Answer:" forces one pass to do the whole sum. Measured gain: <a href="https://arxiv.org/abs/2201.11903">Wei et al. 2022</a> <span class="tag doc">DOC</span>. Per the notes, reasoning models do this internally; CoT still helps smaller models and makes reasoning auditable. <span class="tag unv">UNVERIFIED</span></div>`;
}
function cancelTimers() { clearTimeout(wipeT); clearTimeout(revealT); }
function paint(S, n) {
  const vis = S.blocks.slice(0, n);
  drawDesk(vis, null);
  setMeter(sumTok(vis));
  drawOut(S.stagger != null ? S.out.slice(0, Math.max(0, n - S.stagger)) : S.out, S.ph);
}
function paintWiped(S) {
  drawDesk(null, sumTok(S.blocks));
  setMeter(0);
  drawOut(S.out, S.ph);
}
function renderMain(k, silent) {
  cancelTimers();
  const S = stateFor(k);
  whyEl.innerHTML = S.why ? whyHTML() : '';
  if (S.wipe === 'now') paintWiped(S);
  else if (S.wipe === 'after') {
    paint(S, S.blocks.length);
    if (REDUCED) paintWiped(S); else wipeT = setTimeout(() => paintWiped(S), 1100);
  } else if (S.stagger != null && !REDUCED && !silent) {
    let n = S.stagger; paint(S, n);
    const tick = () => { if (n < S.blocks.length) { n++; paint(S, n); revealT = setTimeout(tick, 650); } };
    revealT = setTimeout(tick, 650);
  } else paint(S, S.blocks.length);
  const c = codeOf(k);
  $('codeHead').innerHTML = c < 0 ? 'Code appears with step 2.' : CODE[c].head;
  $('codeBody').textContent = c < 0 ? '# Press Step: each technique brings its own snippet.' : CODE[c].body;
  const t = tabOf(k);
  ['tabZero', 'tabFew', 'tabCot', 'tabReact'].forEach((id, i) => $(id).setAttribute('aria-pressed', String(i === t)));
}

const n5 = () => shots === 2 ? `Two worked (user, assistant) pairs go on the desk: ${estTokens(TXT.u1)}+${estTokens(TXT.a1)} and ${estTokens(TXT.u2)}+${estTokens(TXT.a2)} tokens. The model is not trained on them; they are read, like any other tokens.`
  : shots === 1 ? `One worked pair goes on the desk: ${estTokens(TXT.u1)}+${estTokens(TXT.a1)} tokens. Read like any other tokens, not trained on.`
  : 'The slider is at 0: no examples go on the desk, only the system message.';
const n6 = () => `The real message (${estTokens(TXT.u3)} tokens). Desk: ${fewTotal(shots)} tokens. ` + (shots === 2
  ? 'The model continues the pattern: output is the third JSON in the series. This is in-context learning: pattern completion within the window.'
  : shots === 1 ? 'One example is a weak pattern: the format may or may not hold.' : 'With no examples nothing pins down the format.');

const mainSteps = [
  {short: 'empty desk', phase: 'Start', get caption() { return `A fresh request. The desk is empty; the student remembers nothing from any earlier request. ${fmtN(0)} / ${fmtN(winSize)} tokens.`; }},
  {short: 'zero-shot', phase: 'Zero-shot', get caption() { return `Put one bare instruction on the desk (${estTokens(TXT.zs)} tokens). No examples. Works when the task is common in training data.`; }},
  {short: 'answer', phase: 'Zero-shot', caption: 'Output: <b>NEGATIVE</b>. Then the desk is wiped.'},
  {short: 'few-shot: system', phase: 'Few-shot', get caption() { return `New request. First a system message: role + output format (${estTokens(TXT.sys)} tokens). Models are trained to weight this role more, but it is still just tokens.`; }},
  {short: 'few-shot: examples', phase: 'Few-shot', get caption() { return n5(); }},
  {short: 'few-shot: the real ask', phase: 'Few-shot', get caption() { return n6(); }},
  {short: 'wiped again', phase: 'Few-shot', caption: 'Request ends; desk wiped. Send the same message without the examples tomorrow and the format is gone. <b>Nothing was learned.</b>'},
  {short: 'chain-of-thought', phase: 'Chain-of-thought', get caption() { return `A reasoning question with "think step by step" (${estTokens(TXT.cot)} tokens). The instruction changes <em>what the model writes first</em>.`; }},
  {short: 'working on the desk', phase: 'Chain-of-thought', caption: `The model writes its working. Each step is appended to the desk and read back while producing the next token (page 5). Step 1: ${COFFEES} × $${COFFEE} = $${cotA}. Step 2: $${PAID} − $${cotA} = $${cotB}. Step 3: $${cotB} ÷ $${MUFFIN} = ${cotC}. Answer: ${cotC}.`},
  {short: 'why it helps', phase: 'Chain-of-thought', caption: 'Intermediate tokens are extra computation on the desk; skipping straight to "Answer:" forces one forward pass to do the whole sum. <a href="https://arxiv.org/abs/2201.11903">Wei et al. 2022</a> measured the gain. Reasoning models now do this internally; CoT still helps small models and makes the reasoning auditable.'},
  {short: 'ReAct: thought', phase: 'ReAct', caption: 'A question that needs a lookup. Thought: "I need to find the city first, then get its weather." Still just text on the desk.'},
  {short: 'ReAct: action → observation', phase: 'ReAct', caption: 'Action: <code>web_search("Eiffel Tower location")</code>. The harness runs the tool and writes the Observation back onto the desk: "The Eiffel Tower is located in Paris, France." The model never left the desk; the assistant did.'},
  {short: 'ReAct: loop', phase: 'ReAct', caption: 'Iteration 2: Thought → <code>get_weather("Paris, France")</code> → Observation "14°C, light rain…" (illustrative, not a real reading). The loop runs until a Thought says "I have all I need".'},
  {short: 'answer, then wiped', phase: 'ReAct', caption: 'Final answer assembled from observations on the desk. Then the desk is wiped: the agent\'s "memory" lived entirely in the prompt. Page 7 makes the lookup systematic: the librarian.'}
];
const main = Stepper({
  steps: mainSteps, resetCaption: 'An empty desk. Press Step to see what each technique actually puts on it.',
  play: $('pPlay'), step: $('pStep'), reset: $('pReset'), counter: $('pCounter'), caption: $('pCaption'),
  render: renderMain, interval: 2400
});
[['tabZero', 2], ['tabFew', 4], ['tabCot', 8], ['tabReact', 11]].forEach(([id, st]) => $(id).addEventListener('click', () => { main.pause(); main.go(st); }));

/* sliders */
function syncShots() {
  $('shotVal').textContent = shots;
  $('shotStrength').textContent = ['none', 'weak', 'established'][shots];
  $('shotSlider').setAttribute('aria-valuetext', `${shots} example pair${shots === 1 ? '' : 's'}, ${fewTotal(shots)} tokens on the desk with the real ask`);
}
$('shotSlider').addEventListener('input', e => { shots = clamp(parseInt(e.target.value, 10) || 0, 0, 2); syncShots(); main.go(main.k, {silent: true}); });
$('winSelect').addEventListener('change', e => { winSize = parseInt(e.target.value, 10) || WIN_DEMO; $('winVal').textContent = fmtN(winSize); main.go(main.k, {silent: true}); });
syncShots();
main.go(main.k, {silent: true});

/* =====================================================================
   Interactive 2 — ReAct loop, one slot at a time (independent of the main stepper)
   ===================================================================== */
let reState = 0;
const RE_TOTAL = REACT.length;
const RE_BTN = {reThought: 'T', reAction: 'A', reObserve: 'O', reAnswer: 'ANS'};
const RE_NODE = {T: 'nodeT', A: 'nodeA', O: 'nodeO', ANS: 'nodeAns'};
const reNextKind = s => s < RE_TOTAL ? REACT[s].kind : null;
const RE_CAP = {
  T: 'The model wrote a Thought. It is plain text on the desk; nothing has run yet.',
  A: 'The model wrote an Action as text. It has not run anything: a model can only write text.',
  O: 'The harness (your code) ran the tool and wrote the Observation onto the desk. The model never left the desk.',
  ANS: 'The model wrote the final Answer from the observations on the desk. After this the desk is wiped: the loop\'s memory was the prompt.'
};
function renderRe() {
  const s = reState, blocks = reBlocks(s);
  $('reCounter').innerHTML = `Slot <b>${s}</b> of ${RE_TOTAL}`;
  $('reTok').textContent = fmtN(sumTok(blocks));
  $('reTrace').innerHTML = blocks.map(b => blockHTML(b, false)).join('');
  const last = s ? REACT[s - 1].kind : null, nxt = reNextKind(s);
  Object.values(RE_NODE).forEach(id => $(id).classList.toggle('lit', last != null && RE_NODE[last] === id));
  Object.entries(RE_BTN).forEach(([id, kind]) => { const b = $(id); b.disabled = kind !== nxt; b.classList.toggle('next', kind === nxt); });
  $('reCaption').textContent = last ? RE_CAP[last] + (nxt ? '' : ' (Loop finished: press Reset loop.)') : 'Empty trace. The first move is a Thought.';
}
Object.entries(RE_BTN).forEach(([id, kind]) => $(id).addEventListener('click', () => {
  if (reNextKind(reState) !== kind) return;
  reState++; renderRe();
  const nx = reNextKind(reState), target = nx ? Object.keys(RE_BTN).find(i => RE_BTN[i] === nx) : 'reLoopReset';
  $(target).focus();
}));
$('reLoopReset').addEventListener('click', () => { reState = 0; renderRe(); });
if (Q.has('loop')) reState = clamp(parseInt(Q.get('loop'), 10) || 0, 0, RE_TOTAL);
renderRe();

/* =====================================================================
   Interactive 3 — model-selection chooser (criteria only: no names, no prices)
   ===================================================================== */
const CHOICES = [
  {id: 'quality', label: 'Best quality, pay per token', rule: '<b>Closed frontier API.</b> Pay per token and run no infrastructure. Compare two or three candidates on your own eval set before committing.'},
  {id: 'cost', label: 'Cost-sensitive at scale', rule: '<b>Small tier.</b> Use a smaller, cheaper tier of a model family and measure whether it passes your eval; reserve the larger tier for the hard requests.'},
  {id: 'private', label: 'Data must stay on my servers', rule: '<b>Open weights, self-hosted</b> (the notes serve them with vLLM). You take on GPUs and operations in exchange for control of where the data travels.'},
  {id: 'tune', label: 'Need to fine-tune', rule: '<b>Open weights.</b> You control the training and can host the result. Check that the licence allows your use.'},
  {id: 'long', label: 'Very long context', rule: '<b>Check the context limit</b> of every candidate, then test recall at that length on your own data: models can miss facts buried in the middle (<a href="https://arxiv.org/abs/2307.03172">Lost in the Middle</a> <span class="tag doc">DOC</span>).'}
];
const chosen = new Set();
function renderChoose() {
  $('chipGrid').innerHTML = CHOICES.map(c => `<button class="chip" data-c="${c.id}" aria-pressed="${chosen.has(c.id)}">${esc(c.label)}</button>`).join('');
  $('chipGrid').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.c; chosen.has(id) ? chosen.delete(id) : chosen.add(id); renderChoose();
    const again = $('chipGrid').querySelector(`[data-c="${id}"]`); if (again) again.focus();
  }));
  const picked = CHOICES.filter(c => chosen.has(c.id));
  $('ruleList').innerHTML = picked.length
    ? picked.map(c => `<div class="rule2">${c.rule} <span class="tag">COMMON PRACTICE</span></div>`).join('') + '<div class="rule2"><b>Always read the licence.</b> Open weights ≠ open source.</div>'
    : '<div class="hint" style="margin:0">Nothing pressed. With no constraints, the default is: compare two or three candidates on your own eval set.</div>';
  $('pReset').classList.toggle('attn', chosen.size > 0);
}
$('chooseClear').addEventListener('click', () => { chosen.clear(); renderChoose(); });
clearers.push(() => { if (chosen.size) { chosen.clear(); renderChoose(); } });
renderChoose();
$('pReset').addEventListener('click', clearFocusStates);

/* =====================================================================
   Computed numbers → fact boxes / quiz (data-n spans)
   ===================================================================== */
const FS_PARTS = [estTokens(TXT.sys), estTokens(TXT.u1), estTokens(TXT.a1), estTokens(TXT.u2), estTokens(TXT.a2), estTokens(TXT.u3)];
const FS_TOTAL = FS_PARTS.reduce((a, b) => a + b, 0);
const NVAL = {fsTotal: FS_TOTAL, fsSum: FS_PARTS.join(' + '), fsPct: pctOf(FS_TOTAL, WIN_DEMO), winDemo: fmtN(WIN_DEMO)};
document.querySelectorAll('[data-n]').forEach(el => { el.textContent = NVAL[el.dataset.n]; });

/* keyboard: main animation = main */
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(document.activeElement.tagName) && e.key !== 'Escape') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); main.pause(); main.step(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); main.pause(); main.go(main.k - 1); }
  else if (e.key === ' ') { e.preventDefault(); main.play(); }
  else if (e.key.toLowerCase() === 'r') { main.reset(); clearFocusStates(); }
});
/* URL params: ?step=N jumps the main animation; ?t=seconds maps onto its steps */
if (Q.has('step')) main.go(parseInt(Q.get('step'), 10) || 0);
else if (Q.has('t')) main.go(Math.floor((parseFloat(Q.get('t')) || 0) / 2.4));

/* ===== SELFTEST (spec values from _spec/6-prompting.md) ===== */
(function selftest() {
  const fails = [];
  const check = (name, ok) => { if (!ok) fails.push(name); };
  check('chars zero-shot 117', TXT.zs.length === 117);
  check('tokens zero-shot 30', estTokens(TXT.zs) === 30);
  check('tokens system 39', estTokens(TXT.sys) === 39 && TXT.sys.length === 153);
  check('tokens u1 7', estTokens(TXT.u1) === 7);
  check('tokens a1 16', estTokens(TXT.a1) === 16);
  check('tokens u2 13', estTokens(TXT.u2) === 13);
  check('tokens a2 17', estTokens(TXT.a2) === 17);
  check('tokens u3 18', estTokens(TXT.u3) === 18);
  check('few-shot total 110', FS_TOTAL === 110 && fewTotal(2) === 110);
  check('slider 0 shots 57', fewTotal(0) === 57);
  check('slider 1 shot 80', fewTotal(1) === 80);
  check('slider 2 shots 110', fewTotal(2) === 110);
  check('cot tokens 46', estTokens(TXT.cot) === 46 && TXT.cot.length === 182);
  check('react user tokens 17', estTokens(TXT.re) === 17 && TXT.re.length === 66);
  check('cot arithmetic', cotA === 12 && cotB === 9 && cotC === 3);
  check('cot lines', COT_LINES[0] === 'Step 1: 3 coffees × $4 = $12' && COT_LINES[1] === 'Step 2: $21 − $12 = $9 remaining' && COT_LINES[2] === 'Step 3: $9 ÷ $3 per muffin = 3 muffins' && COT_LINES[3] === 'Answer: 3');
  check('window pct 1.4', pctOf(110, 8000) === '1.4');
  check('react slot order', REACT.map(s => s.kind).join(',') === 'T,A,O,T,A,O,T,ANS');
  check('step 6 desk blocks', stateFor(6).blocks.length === 6 && sumTok(stateFor(6).blocks) === 110 && stateFor(6).out[0].text === TXT.fsOut);
  check('step 9 four lines', stateFor(9).out.length === 4 && stateFor(9).out[3].text === 'Answer: 3');
  check('step 7 wiped', stateFor(7).wipe === 'now');
  check('step 12 action then obs', stateFor(12).blocks.slice(-2).map(b => b.role).join(',') === 'asst,obs');
  check('main steps = 14', mainSteps.length === 14);
  if (fails.length) console.error('SELFTEST FAIL: ' + fails.join('; '));
  else console.log('SELFTEST OK');
})();

    <h1>7 · RAG — the librarian puts the right page on the desk</h1>
    <p class="lede">Two phases on one timeline: index the documents once (cut into overlapping chunks, give each a seat in meaning-space, file it), then for every question embed it, find the nearest chunks, put them on the desk and answer from them with a citation. Drag the sliders and watch the real text re-split.</p>

<!-- ============ 1. ANALOGY ============ -->
<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>The open-book exam: a librarian, a catalogue and a desk</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">📚</div>
      <div>
        <p>Two phases, one timeline. <b>Before the exam</b> (indexing, done once): the librarian takes every document, cuts it into overlapping <b>pages</b> (chunks), gives each page a seat in the meaning-room (an embedding, page 3) and files the seat numbers in a catalogue (the vector store).</p>
        <p><b>During the exam</b> (query, every request): the student's question also gets a seat. The librarian finds the <em>k</em> catalogue entries whose seats are at the smallest angle to it (cosine), carries those pages to the desk, and the student answers <em>only from the pages on the desk</em>, citing which page said what.</p>
        <p>The student is the same frozen student from page 1. If the right page was never cut cleanly (bad chunking), never filed where it would be found (bad embedding), or lost below the top-k cut, the student cannot answer well no matter how clever. That is exactly what the examiner (page 8) will measure.</p>
        <div class="metaphor">
          <div><b>The librarian</b>the retrieval pipeline</div>
          <div><b>Cutting pages</b>chunking with overlap</div>
          <div><b>Seat numbers in a catalogue</b>embeddings in a vector store</div>
          <div><b>Finding nearby seats</b>nearest-neighbour search by cosine</div>
          <div><b>Pages on the desk</b>retrieved context in the prompt</div>
          <div><b>Citing the page</b>grounded, cited answer</div>
        </div>
      </div>
    </div>
    <div class="hook" style="margin-top:22px">
      <span class="eyebrow">The layer most people haven't seen</span>
      <p><b>RAG does not make the student smarter; it makes the exam open-book.</b> The weights are untouched (page 1). What changes is what lies on the desk (page 6): a librarian fetches the few pages most similar to the question (page 3's cosine) and puts them next to it. Most production failures are therefore not "the model is dumb" but "the librarian brought the wrong page": a retrieval bug, fixed with chunking, embeddings or k, never with a cleverer prompt.</p>
    </div>
  </div>
</section>

<!-- ============ 3. FACT BOXES ============ -->
<section id="facts">
  <div class="wrap">
    <span class="eyebrow">Key facts to say out loud</span>
    <h2>Fact boxes</h2>
    <div class="facts">
      <div class="fact"><div class="k">The problem RAG solves</div><div class="v">Knowledge cutoff · private data · hallucination</div><div class="d">Fetch the relevant text and put it in the prompt; the model answers from what it can read. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Two phases</div><div class="v">Indexing once, offline · Query every request, online</div><div class="d">Documents → chunks → embeddings → store; question → embedding → nearest chunks → prompt → cited answer. <span class="tag">COMMON PRACTICE</span></div></div>
      <div class="fact"><div class="k">Chunk overlap</div><div class="v">step = size − overlap</div><div class="d"><span id="f3calc"></span> Shown live above. <span class="tag der">DERIVED</span></div></div>
      <div class="fact"><div class="k">Chroma</div><div class="v"><code>get_or_create_collection(…, metadata={"hnsw:space": "cosine"})</code></div><div class="d">Default space is L2, so set cosine explicitly, as the notes do. <a href="https://docs.trychroma.com/docs/overview/getting-started">Chroma getting started</a> <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">RAG paper</div><div class="v">Lewis et al. 2020</div><div class="d">Introduced retrieval-augmented generation for knowledge-intensive tasks. <a href="https://arxiv.org/abs/2005.11401">arXiv 2005.11401</a> <span class="tag doc">DOC</span></div></div>
      <div class="fact"><div class="k">Lost in the middle</div><div class="v">Put the best chunk first or last</div><div class="d">Models use information in the middle of a long context less reliably than at the ends. <a href="https://arxiv.org/abs/2307.03172">arXiv 2307.03172</a> <span class="tag doc">DOC</span></div></div>
    </div>
  </div>
</section>

<!-- ============ 4. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li>The 2-D chunk coordinates are hand-placed (for chunk size 200, overlap 40) to make the ranking sensible; at any other setting they come from a fixed spread. Real embeddings are 384–3,072 numbers and the cosines would differ. Only the chunking numbers (boundaries, counts, token estimates) are exact. <span class="tag der">DERIVED</span></li>
        <li>Character-count chunking is the simplest baseline; production systems chunk by structure (headings, paragraphs) or by tokens. The notes' table lists the upgrades: hybrid search, reranking, query rewriting, metadata filters. <span class="tag">COMMON PRACTICE</span></li>
        <li>The 0.30 threshold for “I don't know” is a page device. Real systems rarely hard-threshold cosine; they rely on the prompt instruction and on evaluation. <span class="tag unv">UNVERIFIED</span></li>
        <li>The expected answers (“No. Digital goods are non-refundable…”) are illustrative, written by this page from the notes' comments, not recorded model responses.</li>
        <li>Chroma's default distance and API names are quoted from its docs as of writing; newer releases may configure the space differently, so verify against the version you install. <span class="tag unv">UNVERIFIED</span></li>
        <li>Token counts use the page-6 rule of thumb ⌈chars ÷ 4⌉, and ignore the few tokens of the <code>&lt;context&gt;</code> tags and <code>[Source: …]</code> labels. A real tokenizer will give different numbers. <span class="tag">COMMON PRACTICE</span></li>
      </ul>
    </div>
  </div>
</section>

<!-- ============ 5. QUIZ ============ -->
<section id="quiz">
  <div class="wrap quiz">
    <span class="eyebrow">Check yourself</span>
    <h2>Say the answer out loud before you reveal it</h2>
    <div class="q"><p>1. Your RAG system gives a confident wrong answer. Where do you look first?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Retrieval, before touching the prompt: was the right chunk retrieved (context recall)? If not, fix chunking, embeddings or k. If yes, did the model use it faithfully? Page 8 measures both.</div></div>
    <div class="q"><p>2. Why overlap chunks at all? Give the concrete example from this page.</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">A sentence that straddles a boundary is cut in one chunk but whole in the neighbour. With (200, 0) “Express shi|pping takes 1-2…” is split at char 200; with overlap 40 the band [160,200) is in both chunks, so chunk 1 holds the whole phrase.</div></div>
    <div class="q"><p>3. With size 200 and overlap 40, where does chunk 2 start, and why?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">At 320: starts advance by step = 200 − 40 = 160, so 0, 160, 320, 480.</div></div>
    <div class="q"><p>4. Page 3 said cosine ignores length. Why does that matter for the librarian?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Chunk and question embeddings can differ in length for irrelevant reasons (text length, word frequency). Comparing directions finds “about the same thing” regardless, which is what nearest-neighbour retrieval needs.</div></div>
    <div class="q"><p>5. Why must the question be embedded with the same model used at indexing?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">Each model defines its own meaning-room. Coordinates from different models are not comparable, so the angles would be meaningless.</div></div>
    <div class="q"><p>6. What does RAG not fix (page 1 reminder)?</p><button class="btn" aria-expanded="false">Show answer</button><div class="ans">The student's weights. RAG changes the desk, not the student: reasoning ability, instruction following and the tendency to ignore context are unchanged.</div></div>
  </div>
</section>

      const st = k ? o.steps[k - 1] : null;
      o.counter.innerHTML = `Step <b>${k}</b> of ${M}` + (st && st.short ? ` — ${st.short}` : '');
      o.caption.innerHTML = (st && st.phase ? `<span class="phase">${st.phase}</span>` : '') + (st ? st.caption : o.resetCaption);
      o.render(k, silent);
      if (k >= M) api.pause();
    },
    step() { if (k >= M) return; api.go(k + 1); },
    play() {
      if (STILL) { api.step(); return; }          // ?still: Play degrades to a single Step
      if (timer) { api.pause(); return; }
      if (k >= M) api.go(0);
      o.play.setAttribute('aria-pressed', 'true'); o.play.textContent = '❚❚ Pause';
      api.step();
      timer = setInterval(() => { if (k >= M) api.pause(); else api.step(); }, o.interval || 2200);
    },
    pause() {
      if (timer) clearInterval(timer); timer = null;
      o.play.setAttribute('aria-pressed', 'false'); o.play.textContent = '▶ Play';
    },
    reset() { api.pause(); api.go(0); }
  };
  o.play.addEventListener('click', api.play);
  o.step.addEventListener('click', () => { api.pause(); api.step(); });
  o.reset.addEventListener('click', api.reset);
  api.go(0, {silent: true});
  return api;
}

const wait = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
const fmtS = v => fmt(v, 3).replace('-', '−');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const TEXT = "Customers may request a full refund within 30 days of delivery. Items must be unused and in original packaging. Digital goods are non-refundable. Standard shipping takes 3-5 business days. Express shipping takes 1-2 business days and costs $15 extra. We ship to the US, Canada, and EU only. All electronics include a 1-year limited warranty covering manufacturing defects. Accidental damage is not covered. Contact support@shop.com to initiate a warranty claim. Gift cards never expire and can be redeemed online or in store. Price-match requests must be submitted within 7 days of purchase with a link to the competitor's listing.";
const INSTRUCTION = 'Answer the question using ONLY the information in the <context> below. If the answer isn\'t in the context, say "I don\'t know based on available information." Always cite your source in [brackets] at the end of your answer.';
const REFUSAL = "I don't know based on available information.";
const estTokens = s => Math.ceil(s.length / 4);          // page-6 rule of thumb: ceil(chars / 4)

/* the notes' chunk(): starts 0, step, 2*step ... while start < max(len - overlap, 1); text[i : i+size] */
function chunk(text, size, overlap) {
  const out = [], step = size - overlap, lim = Math.max(text.length - overlap, 1);
  for (let i = 0; i < lim; i += step) out.push({start: i, end: Math.min(i + size, text.length)});
  return out;
}

/* toy 2-D "embeddings": hand-placed for (200, 40), a fixed spread otherwise */
const HAND_PTS = [[0.90, 0.30], [0.60, 0.80], [-0.50, 0.85], [-0.90, -0.20]];
const HAND_TOPIC = ['refund + shipping start', 'shipping', 'warranty', 'gift cards / price-match'];
function chunkPoints(n, size, overlap) {
  if (size === 200 && overlap === 40 && n === 4) return HAND_PTS.map(p => p.slice());
  if (n === 1) return [[1, 0]];
  return Array.from({length: n}, (_, i) => { const f = 1.25 - i * (2.5 / (n - 1)); return [Math.cos(f), Math.sin(f)]; });
}
const QS = [
  {text: "Can I return an e-book I bought last week?", v: [0.95, 0.20], span: "Digital goods are non-refundable.", lead: "No. "},
  {text: "How long does express shipping take?",       v: [0.70, 0.70], span: "Express shipping takes 1-2 business days", lead: ""},
  {text: "What is the CEO's salary?",                  v: [0.10, -0.95], span: null, lead: ""}
];
QS.forEach(q => { q.at = q.span ? TEXT.indexOf(q.span) : -1; q.to = q.span ? q.at + q.span.length : -1; });

const cosine = (a, b) => (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]));
function rankChunks(qv, pts) {
  return pts.map((p, i) => ({i, cos: cosine(qv, p)})).sort((a, b) => b.cos - a.cos || a.i - b.i);
}

/* ---- page state ---- */
const S = {size: 200, ov: 40, kk: 2, thr: 0.30, userQ: 0, sel: -1, hov: -1};
const THRESHOLD_DEFAULT = 0.30;

/* everything the renders need, recomputed from the inputs on every call */
function model(k) {
  const chunks = chunk(TEXT, S.size, S.ov);
  const n = chunks.length;
  const pts = chunkPoints(n, S.size, S.ov);
  const qi = (k === 13) ? 2 : S.userQ;
  const q = QS[qi];
  const ranked = rankChunks(q.v, pts);
  const best = ranked[0];
  const pass = best.cos >= S.thr;
  const kEff = Math.min(S.kk, n);
  const carried = pass ? ranked.slice(0, kEff).map(r => r.i) : [];
  /* grounded answer: the model may only use what is on the desk */
  let ans;
  if (!pass) ans = {text: REFUSAL, refuse: true, why: `best cosine ${fmtS(best.cos)} (c${best.i}) is below the threshold ${fmt(S.thr, 2)}: nothing is carried to the desk`};
  else if (!q.span) ans = {text: REFUSAL, refuse: true, why: 'the answer is not in the knowledge base, so the instruction tells the model to refuse (illustrative)'};
  else {
    const hit = carried.find(i => chunks[i].start <= q.at && q.to <= chunks[i].end);
    if (hit === undefined) ans = {text: REFUSAL, refuse: true, why: 'retrieval miss: no chunk on the desk holds the whole sentence, so the model cannot cite it'};
    else ans = {text: q.lead + q.span.replace(/\.$/, '') + ` [Source: doc-chunk-${hit}].`, refuse: false, hit, why: `the sentence sits at chars [${q.at},${q.to}), whole inside chunk ${hit}`};
  }
  const desk = carried.map(i => ({i, text: TEXT.slice(chunks[i].start, chunks[i].end)}));
  const tokens = {ins: estTokens(INSTRUCTION), chunks: desk.map(d => estTokens(d.text)), q: estTokens(q.text)};
  tokens.total = tokens.ins + tokens.chunks.reduce((a, b) => a + b, 0) + tokens.q;
  return {chunks, n, pts, qi, q, ranked, best, pass, kEff, carried, ans, desk, tokens};
}
const boundsStr = ch => ch.map(c => `[${c.start},${c.end})`).join(' ');

}

function drawDesk(k, m) {
  if (k < 11) { $('deskBody').innerHTML = `<p class="none">${k >= 10 ? 'Top-k chosen. ' : ''}The desk stays empty until step 11 (prompt assembly).</p>`; return; }
  const ctx = m.desk.length
    ? m.desk.map(d => `[Source: doc-chunk-${d.i}]\n${esc(d.text)}`).join('\n\n')
    : '(empty: nothing cleared the threshold, so no chunk is carried)';
  const pre = `<span class="ins">${esc(INSTRUCTION)}</span>\n\n<span class="tg">&lt;context&gt;</span>\n${ctx}\n<span class="tg">&lt;/context&gt;</span>\n\n<span class="ql">Question: ${esc(m.q.text)}</span>`;
  const t = m.tokens;
  const parts = [`instruction <b>${t.ins}</b>`, ...t.chunks.map((c, j) => `chunk ${m.desk[j].i} <b>${c}</b>`), `question <b>${t.q}</b>`];
  $('deskBody').innerHTML = `<pre class="promptpre" tabindex="0" aria-label="The assembled prompt">${pre}</pre>` +
    `<p class="meter">Token meter ⌈chars÷4⌉: ${parts.join(' + ')} = <b>${t.total}</b> tokens <span class="tag der">DERIVED</span> <span class="hint">(INSTRUCTION is ${INSTRUCTION.length} chars → ⌈${INSTRUCTION.length}÷4⌉ = ${t.ins}; tags and labels not counted)</span></p>` +
    `<p class="sub">The model may use ONLY what is inside <code>&lt;context&gt;</code>. Put the best chunk first or last (lost in the middle).</p>`;
}

function drawCode(k) {
  const c = CODE[codeIndexFor(k)];
  $('codeTitle').textContent = c.title;
  $('codeText').textContent = c.text;
}

/* ---- selection (hover / click a chunk anywhere highlights it everywhere) ---- */
function applySel() {
  const c = S.sel >= 0 ? S.sel : S.hov;
  document.querySelectorAll('#rag-section .sel').forEach(e => e.classList.remove('sel'));
  if (c >= 0) document.querySelectorAll('#rag-section [data-c]').forEach(e => {
    if (e.getAttribute('data-c').split(' ').includes(String(c))) e.classList.add('sel');
  });
  $('gReset').classList.toggle('attn', S.sel >= 0);
}
clearers.push(() => { S.sel = -1; S.hov = -1; applySel(); });
(function wireSel() {
  const root = $('rag-section');
  root.addEventListener('mouseover', e => {
    const t = e.target.closest('[data-c]'); if (!t || S.sel >= 0) return;
    S.hov = parseInt(t.getAttribute('data-c').split(' ')[0], 10); applySel();
  });
  root.addEventListener('mouseout', e => { if (S.hov >= 0 && S.sel < 0) { S.hov = -1; applySel(); } });
  root.addEventListener('click', e => {
    const t = e.target.closest('[data-c]'); if (!t) return;
    const c = parseInt(t.getAttribute('data-c').split(' ')[0], 10);
    S.sel = (S.sel === c) ? -1 : c; S.hov = -1; applySel();
  });
})();

function renderMain(k) {
  const m = model(k);
  if (S.sel >= m.n) S.sel = -1;
  $('sizeVal').textContent = S.size; $('overlapVal').textContent = S.ov; $('kVal').textContent = S.kk;
  drawPhase(k); drawDoc(k, m); drawPlane(k, m); drawSide(k, m); drawCat(k, m); drawDesk(k, m); drawCode(k);
  $('diagPan').style.display = k >= 14 ? 'block' : 'none';
  [0, 1, 2].forEach(i => $('chip' + i).setAttribute('aria-pressed', String(i === m.qi)));
  applySel();
}

/* =====================================================================
   The 14 steps (captions are computed from the current inputs)
   ===================================================================== */
const stepDef = (kStep, short, phase, fn) => ({short, phase, get caption() { return fn(model(kStep)); }});
const listCos = m => m.pts.map((p, i) => fmtS(m.ranked.find(r => r.i === i).cos)).join(', ');
const mainSteps = [
  stepDef(1, 'the document', 'Indexing', m => `Indexing phase, done once, offline. One ${TEXT.length}-character policy document (three of the notes' shop docs plus two sentences).`),
  stepDef(2, 'cut into chunks', 'Indexing', m => `Cut into ${S.size}-character pages advancing ${S.size - S.ov} at a time: starts at ${startsOf(m.chunks)} → ${m.n} chunks; the last is ${m.chunks[m.n - 1].end - m.chunks[m.n - 1].start} chars.`),
  stepDef(3, 'overlap', 'Indexing', m => {
    if (S.ov === 0 || m.n < 2) return `Overlap is 0, so there is no shared band: a sentence cut at a boundary is cut for good (see the red flag under the text). Slide “overlap” up to share the edge.`;
    return `The ${m.chunks[0].end - m.chunks[1].start} characters at [${m.chunks[1].start},${m.chunks[0].end}) belong to both chunk 0 and chunk 1, so a sentence cut at the boundary (“Express shi|pping…”) survives whole in at least one chunk. Slide “overlap” to 0 and watch it break.`;
  }),
  stepDef(4, 'embed each chunk', 'Indexing', m => `Each chunk gets a seat in meaning-space (page 3). Here 2-D: c0 ${vecStr(m.pts[0])} … c${m.n - 1} ${vecStr(m.pts[m.n - 1])}. In code: all-MiniLM-L6-v2 → 384 numbers <span class="tag">COMMON PRACTICE</span>`),
  stepDef(5, 'store', 'Indexing', m => `File (id, text, embedding, metadata {source}) in the vector store: ${m.n} rows. <code>col.upsert(ids, documents, metadatas)</code>.`),
  stepDef(6, 'indexing done', 'Indexing', m => `${m.n} pages catalogued. This never runs again until the documents change.`),
  stepDef(7, 'a question arrives', 'Query', m => `Query phase, every request. “${esc(m.q.text)}”`),
  stepDef(8, 'embed the question', 'Query', m => `Same embedding model → q${m.qi + 1} at ${vecStr(m.q.v)}. It must be the SAME model as indexing or the seats don't line up.`),
  stepDef(9, 'nearest neighbours', 'Query', m => `cosine(q, c) = ${listCos(m)}. Rank by angle: ${m.ranked.map(r => 'c' + r.i).join(', ')}.`),
  stepDef(10, 'top-k', 'Query', m => m.pass
    ? `k = ${m.kEff}: carry ${m.carried.map(i => 'c' + i).join(' and ')} to the desk. k is a dial: too small misses the page, too large buries it in noise (page 8 measures both).`
    : `Best cosine ${fmtS(m.best.cos)} is below the threshold ${fmt(S.thr, 2)}: nothing is carried to the desk.`),
  stepDef(11, 'assemble the prompt', 'Query', m => `The desk now holds: instruction (${m.tokens.ins} tokens) + “&lt;context&gt;” with the ${m.desk.length} cited chunk${m.desk.length === 1 ? '' : 's'} (${m.tokens.chunks.length ? '≈ ' + m.tokens.chunks.join(' + ') + ' tokens' : 'empty'}) + the question (${m.tokens.q} tokens) = ${m.tokens.total} tokens. The model may use ONLY what is inside &lt;context&gt;.`),
  stepDef(12, 'grounded answer', 'Query', m => `Student answers from the page: “${esc(m.ans.text)}” — ${esc(m.ans.why)}.`),
  stepDef(13, 'a question with no page', 'Query', m => `q3 “${esc(m.q.text)}” → best cosine ${fmtS(m.best.cos)} (c${m.best.i}). ${m.pass ? 'Above' : 'Below'} the ${fmt(S.thr, 2)} threshold → “${esc(m.ans.text)}” Refusing is correct here; a plain LLM would bluff.`),
  stepDef(14, 'where it breaks', 'Query', m => `Confident wrong answer? Look at retrieval FIRST: was the right chunk retrieved? (context recall) Then: did the model use it? (faithfulness). Fix chunking/embeddings/k for the first; prompt/model for the second. Page 8 turns this into four numbers.`)
];
const main = Stepper({
  steps: mainSteps, resetCaption: 'One document, two phases. Press Step.',
  play: $('gPlay'), step: $('gStep'), reset: $('gReset'), counter: $('gCounter'), caption: $('gCaption'),
  render: renderMain, interval: 2600
});
$('gReset').addEventListener('click', () => { S.sel = -1; S.hov = -1; applySel(); });

/* ---- sliders, threshold, question chips ---- */
const refresh = minStep => { main.pause(); main.go(Math.max(main.k, minStep)); };
function clampOverlap() {
  const maxOv = Math.floor(S.size / 2 / 20) * 20;      // keep step >= size/2 so a character is in at most 2 chunks
  if (S.ov > maxOv) S.ov = maxOv;
  $('overlapSlider').value = S.ov;
}
$('sizeSlider').addEventListener('input', e => { S.size = parseInt(e.target.value, 10); clampOverlap(); refresh(3); });
$('overlapSlider').addEventListener('input', e => { S.ov = parseInt(e.target.value, 10); clampOverlap(); refresh(3); });
$('kSlider').addEventListener('input', e => { S.kk = parseInt(e.target.value, 10); refresh(11); });
$('thrInput').addEventListener('input', e => {
  const v = parseFloat(e.target.value); if (Number.isNaN(v)) return;
  S.thr = clamp(v, -1, 1); refresh(10);
});
[0, 1, 2].forEach(i => $('chip' + i).addEventListener('click', () => {
  S.userQ = i; main.pause();
  const k = main.k; main.go(k < 9 ? 9 : (k >= 13 ? 12 : k));
}));
$('f3calc').textContent = (() => { const c = chunk(TEXT, 200, 40); return `(200, 40) on this document: step = 200 − 40 = ${200 - 40} → starts ${startsOf(c)}.`; })();

/* keyboard: main animation = main */
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(document.activeElement.tagName) && e.key !== 'Escape') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); main.pause(); main.step(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); main.pause(); main.go(main.k - 1); }
  else if (e.key === ' ') { e.preventDefault(); main.play(); }
  else if (e.key.toLowerCase() === 'r') { main.reset(); clearFocusStates(); }
});
/* URL params: ?step=N jumps the main animation; ?t=seconds maps onto its steps */
if (Q.has('step')) main.go(parseInt(Q.get('step'), 10) || 0);
else if (Q.has('t')) main.go(Math.floor((parseFloat(Q.get('t')) || 0) / 2.6));

/* ===== SELFTEST (spec values from _spec/7-rag.md) ===== */
(function selftest() {
  const fails = [];
  const near = (a, b, eps = 5e-4) => Math.abs(a - b) <= eps;
  const nearArr = (A, B, eps = 5e-4) => A.length === B.length && A.every((v, i) => near(v, B[i], eps));
  const check = (name, ok) => { if (!ok) fails.push(name); };
  const bnd = (s, o) => JSON.stringify(chunk(TEXT, s, o).map(c => [c.start, c.end]));
  check('TEXT.length 631', TEXT.length === 631);
  check('chunk 200/40', bnd(200, 40) === '[[0,200],[160,360],[320,520],[480,631]]');
  check('chunk 300/60', bnd(300, 60) === '[[0,300],[240,540],[480,631]]');
  check('chunk 200/0', bnd(200, 0) === '[[0,200],[200,400],[400,600],[600,631]]');
  check('chunk 200/60 starts', chunk(TEXT, 200, 60).map(c => c.start).join() === '0,140,280,420,560' && chunk(TEXT, 200, 60).length === 5);
  check('chunk 150/30', bnd(150, 30) === '[[0,150],[120,270],[240,390],[360,510],[480,630],[600,631]]');
  check('chunk 100/20 count', chunk(TEXT, 100, 20).length === 8);
  check('chunk 400/80', bnd(400, 80) === '[[0,400],[320,631]]');
  check('last chunk 151 chars', (() => { const c = chunk(TEXT, 200, 40); return c[3].end - c[3].start === 151; })());
  const pts = chunkPoints(4, 200, 40);
  const cs = qi => pts.map(p => cosine(QS[qi].v, p));
  check('cos q1', nearArr(cs(0), [0.993, 0.752, -0.319, -1.000]));
  check('cos q2', nearArr(cs(1), [0.894, 0.990, 0.251, -0.844]));
  check('cos q3', nearArr(cs(2), [-0.215, -0.733, -0.910, 0.114]));
  const rk = qi => rankChunks(QS[qi].v, pts).map(r => r.i).join();
  check('rank q1', rk(0).startsWith('0,1,2,3'));
  check('rank q2', rk(1).startsWith('1,0,2,3'));
  check('q3 best c3 0.114', rankChunks(QS[2].v, pts)[0].i === 3 && near(rankChunks(QS[2].v, pts)[0].cos, 0.114) && 0.114 < THRESHOLD_DEFAULT);
  check('indexOf digital goods 112', TEXT.indexOf('Digital goods are non-refundable.') === 112 && QS[0].to === 145);
  check('INSTRUCTION 222 chars / 56 tokens', INSTRUCTION.length === 222 && estTokens(INSTRUCTION) === 56);
  check('chunk tokens 50/50', estTokens(TEXT.slice(0, 200)) === 50 && estTokens(TEXT.slice(160, 360)) === 50);
  if (fails.length) console.error('SELFTEST FAIL: ' + fails.join('; '));
  else console.log('SELFTEST OK');
})();
<\/script>

<script type="text/plain" id="src-8" data-file="8-ragas.html" data-title="8 · RAGAS — the examiner grades the librarian and the student separately">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8 · RAGAS — the examiner grades the librarian and the student separately</title>
<style>
/* ===== Week-1 shared palette (copy this block to every page) ===== */
:root{
  --bg:#121416;         /* page background */
  --bg2:#1a1d20;        /* card background */
  --bg3:#23272b;        /* inset / code background */
  --line:#2f343a;       /* hairline borders */
  --fg:#e8e6e1;         /* primary text  (contrast on --bg ≈ 13:1) */
  --fg2:#b4b0a8;        /* secondary text (≈ 8:1) */
  --fg3:#8c8880;        /* tertiary text  (≈ 5:1) */
  --amber:#f2a83b;      /* THE one accent */
  --amber2:#ffd089;     /* lighter amber for text on dark */
  --amber-dim:rgba(242,168,59,.14);
  --ok:#9fd3a5;         /* soft success (used sparingly, never a theme) */
  --bad:#e08a8a;        /* soft error */
  --radius:14px;
  --maxw:1180px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--amber2);text-decoration-color:rgba(255,208,137,.45)}
a:hover{text-decoration-color:var(--amber2)}
a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:650;letter-spacing:-.01em}
h1{font-size:clamp(34px,4vw,52px)}
h2{font-size:clamp(26px,2.6vw,34px);margin-top:0}
h3{font-size:21px;color:var(--amber2)}
p{margin:.6em 0}
code,kbd,.mono{font-family:var(--mono);font-size:.92em}
code{background:var(--bg3);padding:.1em .4em;border-radius:5px;color:var(--amber2)}
kbd{background:var(--bg3);border:1px solid var(--line);border-bottom-width:2px;padding:0 .45em;border-radius:5px;font-size:.85em}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
header.top{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#171a1d,var(--bg))}
header.top .wrap{padding-top:28px;padding-bottom:36px}
.crumbs{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--fg3);font-size:15px;margin-bottom:22px}
.crumbs .pill{border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--fg2)}
.crumbs .pill.accent{border-color:rgba(242,168,59,.5);color:var(--amber2);background:var(--amber-dim)}
.crumbs a{color:var(--fg2)}
.lede{font-size:21px;color:var(--fg2);max-width:62ch}

section{padding:56px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:12px;font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
.card+.card{margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}

/* analogy strip */
.analogy{display:grid;grid-template-columns:140px 1fr;gap:26px;align-items:start}
.analogy .glyph{font-size:72px;line-height:1;text-align:center;padding-top:6px;filter:saturate(.7)}
.metaphor{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.metaphor div{background:var(--bg3);border-radius:10px;padding:12px 14px;font-size:16px}
.metaphor b{color:var(--amber2);display:block;margin-bottom:2px}

/* hook box */
.hook{border-left:4px solid var(--amber);background:var(--amber-dim);padding:20px 24px;border-radius:0 var(--radius) var(--radius) 0}
.hook .eyebrow{margin-bottom:6px}
.hook p{font-size:19px}

/* stepper controls (shared) */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 10px}
.btn{font:inherit;font-size:16px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:10px 18px;cursor:pointer;transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:#2b3035;border-color:#3b4147}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1200}
.btn.primary:hover{background:#ffb84f}
.btn[aria-pressed="true"]{background:var(--amber);color:#1a1200;border-color:var(--amber)}
.btn.attn{animation:pulse 1.4s ease-in-out infinite;border-color:var(--amber)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,168,59,.0)}50%{box-shadow:0 0 0 7px rgba(242,168,59,.28)}}
@media (prefers-reduced-motion:reduce){.btn.attn{animation:none;box-shadow:0 0 0 3px rgba(242,168,59,.4)}}
.counter{margin-left:auto;font-family:var(--mono);font-size:15px;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);padding:8px 14px;border-radius:10px;min-width:260px}
.counter b{color:var(--amber2);font-weight:600}
.caption{min-height:3.2em;font-size:19px;color:var(--fg);margin:8px 0 0;padding:14px 18px;background:var(--bg3);border-radius:10px;border:1px solid var(--line)}
.caption .phase{display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-right:10px;font-weight:700;vertical-align:middle}
.hint{font-size:15px;color:var(--fg3);margin-top:8px}

/* toggle look */
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:16px;cursor:pointer;user-select:none}
.toggle .track{width:46px;height:26px;border-radius:13px;background:#3a4047;position:relative;transition:background .2s;border:1px solid var(--line)}
.toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#cfcbc3;transition:transform .2s}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle input:checked+.track{background:var(--amber)}
.toggle input:checked+.track::after{transform:translateX(20px);background:#1a1200}
.toggle input:focus-visible+.track{outline:3px solid var(--amber);outline-offset:3px}

/* fact boxes */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.fact{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.fact .k{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);margin-bottom:6px}
.fact .v{font-size:19px;font-weight:600;color:var(--fg)}
.fact .d{font-size:15.5px;color:var(--fg2);margin-top:6px}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--fg2);vertical-align:middle;margin-left:4px;background:var(--bg3)}
.tag.doc{color:var(--amber2);border-color:rgba(242,168,59,.5)}
.tag.unv{color:var(--bad);border-color:rgba(224,138,138,.5)}
.tag.der{color:#b9c8e8;border-color:rgba(185,200,232,.5)}

/* uncertainty */
.uncertain{border:1px dashed rgba(224,138,138,.55);border-radius:var(--radius);padding:22px 26px;background:rgba(224,138,138,.05)}
.uncertain h3{color:var(--bad)}
.uncertain li{margin:.4em 0}

/* quiz */
.quiz .q{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:14px}
.quiz .q p{margin:0 0 10px;font-size:18px}
.quiz .ans{display:none;margin-top:12px;padding:14px 16px;background:var(--bg3);border-radius:10px;color:var(--fg2);font-size:17px;border-left:3px solid var(--amber)}
.quiz .q.open .ans{display:block}
.quiz .q.open .btn{background:var(--amber);color:#1a1200;border-color:var(--amber)}

footer{padding:40px 0 60px;color:var(--fg3);font-size:15px}
.navrow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}

/* shared extras (same as page 1) */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip:hover{border-color:var(--amber)}
.chip[aria-pressed="true"]{background:var(--amber);color:#1a1200;border-color:var(--amber);font-weight:600}

<body>
<header class="top">
  <div class="wrap">
    <div class="crumbs">
      <a href="0-index.html">Week 1 map</a>
      <span class="pill">Page 8 of 9</span>
      <span class="pill accent">Section 12 · RAGAS</span>
      <span class="pill">Running metaphor: the student, the desk, the librarian, the examiner</span>
      <span style="margin-left:auto"><a href="9-build-it.html">Next: 9 · Build it →</a></span>
    </div>
    <h1>RAGAS: the examiner grades the librarian and the student separately</h1>
    <p class="lede">A wrong RAG answer is two different bugs hiding behind one symptom. Four numbers (context precision, context recall, faithfulness, answer relevancy) tell you which stage to open. You will watch each one computed from claims, ranks, sentences and cosines, then diagnose failures yourself.</p>
    <p class="hint">Keyboard: <kbd>→</kbd> step · <kbd>Space</kbd> play/pause · <kbd>R</kbd> reset · <kbd>Esc</kbd> clears any highlight. URL: <code>?still</code> freezes motion, <code>?step=N</code> jumps the main animation, <code>?t=seconds</code> maps onto steps.</p>
  </div>
</header>

<!-- ============ 1. ANALOGY ============ -->
<section id="analogy">
  <div class="wrap">
    <span class="eyebrow">Plain-language analogy first</span>
    <h2>The examiner marks the librarian and the student separately</h2>
    <div class="card analogy">
      <div class="glyph" aria-hidden="true">📝</div>
      <div>
        <p>Enter the <b>examiner</b>. After every open-book exam (page 7) the examiner grades two people. For the <b>librarian</b>: <em>of the pages you carried to the desk, were the useful ones on top?</em> (context precision) and <em>did you bring every fact the model answer needed?</em> (context recall). For the <b>student</b>: <em>is every sentence you wrote backed by a page on the desk?</em> (faithfulness) and <em>did you actually answer the question asked, not a neighbouring one?</em> (answer relevancy).</p>
        <p>The examiner has no access to the student's head, only to the desk, the answer, the question and, for recall, a reference answer written by a human. That is why the four scores form a 2×2 grid: two for the librarian's stage, two for the student's. Reading the grid tells you which room to walk into.</p>
        <div class="metaphor">
          <div><b>The examiner</b>RAGAS</div>
          <div><b>Pages on top</b>context precision</div>
          <div><b>Nothing missing</b>context recall</div>
          <div><b>Every sentence backed</b>faithfulness</div>
          <div><b>Answered the question asked</b>answer relevancy</div>
          <div><b>The reference answer</b>ground truth written by a human</div>
        </div>
      </div>
    </div>

    <div class="hook" style="margin-top:22px">
      <span class="eyebrow">The layer most people haven't seen</span>
      <p><b>A wrong RAG answer is two different bugs, and the fix for one makes the other worse.</b> Either the librarian fetched the wrong page (retrieval: context precision / context recall) or the student ignored the page that was on the desk (generation: faithfulness / answer relevancy). Tuning the prompt when retrieval failed, or re-chunking when the model hallucinated, wastes a week. Four numbers tell you which stage to open.</p>
    </div>
  </div>
</section>

<!-- ============ 2. MAIN ANIMATION ============ -->
<section id="ragas-section">
  <div class="wrap">
    <span class="eyebrow">Interactive 1 · four metrics, one exam paper</span>

      <button class="cell empty" id="cellCR" data-cell="CR" aria-label="Context recall cell: open its working"><span class="nm">Context recall</span><span class="big" id="valCR">—</span><span class="bar"><i id="barCR"></i></span><span class="sub">nothing missing?</span><span class="flag" id="flagCR"></span></button>

      <pre class="codeblk" id="codeA"><code># pure Python; no install needed
# (plain-Python re-implementation of this page's four formulas; NOT the ragas library)
from math import sqrt

<span class="hl" data-fn="F">def faithfulness(claims_supported):        # supported claims / total claims
    return sum(claims_supported) / len(claims_supported)
</span>
<span class="hl" data-fn="CP">def context_precision(v):                 # v = relevance flags in rank order
    if sum(v) == 0:
        return 0.0                             # defined as 0 when nothing is relevant
    hits, total = 0, 0.0
    for k, rel in enumerate(v, start=1):
        hits += rel
        total += (hits / k) * rel              # Precision@k * v_k
    return total / sum(v)                      # / relevant items
</span>
<span class="hl" data-fn="CR">def context_recall(attributable):          # reference statements found / total
    return sum(attributable) / len(attributable)
</span>
<span class="hl" data-fn="AR">def cos(a, b):
    return (a[0]*b[0] + a[1]*b[1]) / (sqrt(a[0]**2 + a[1]**2) * sqrt(b[0]**2 + b[1]**2))

def answer_relevancy(q, gens):            # mean cosine(question, generated questions)
    return sum(cos(q, g) for g in gens) / len(gens)
</span>
print(faithfulness([1, 1, 0]))            # 0.666... -> 0.667
print(context_precision([1, 0, 1, 0]))    # 0.8333... -> 0.833
print(context_precision([0, 0, 1, 1]))    # 0.4166... -> 0.417
print(context_recall([1, 1, 1, 0]))       # 0.75
q = (0.95, 0.20)
print(answer_relevancy(q, [(0.90, 0.30), (0.80, 0.50), (0.97, 0.10)]))   # 0.9757 -> 0.976
print(answer_relevancy(q, [(0.20, 0.90), (-0.30, 0.80), (0.50, 0.70)]))  # 0.3330 -> 0.333</code></pre>

<!-- ============ 5. HONEST UNCERTAINTY ============ -->
<section id="uncertainty">
  <div class="wrap">
    <div class="uncertain">
      <h3>Where this picture is a simplification (say so if asked)</h3>
      <ul>
        <li>The ✓/✗ judgements here are given by the page. In RAGAS an LLM judge makes them, so scores are noisy (±0.1 run to run is normal). Treat single-sample scores as diagnostics, not truth. <span class="tag unv">UNVERIFIED</span> (the ±0.1 figure is a rule of thumb, not a measured value)</li>
        <li>The 2-D cosines for answer relevancy are a toy. The library uses a real embedding model, so absolute numbers will differ. Cosine can in theory fall outside 0 to 1; the docs say so <span class="tag doc">DOC</span> (<a href="https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/answer_relevance/">answer relevancy page</a>).</li>
        <li>The paper (2023) defines three metrics. "Context precision/recall" with these exact formulas come from the library docs, whose API has changed across versions: the docs mark the legacy <code>ragas.metrics</code> pattern as slated for deprecation in favour of a collections API <span class="tag doc">DOC</span>. The notes' snippet uses the legacy import and is reproduced as written; check the docs for your installed version <span class="tag unv">UNVERIFIED</span>.</li>
        <li>Context recall as defined needs a human-written reference. Without one you can only measure precision-type signals; the docs describe a response-based variant for that case <span class="tag doc">DOC</span> (<a href="https://docs.ragas.io/en/stable/concepts/metrics/available_metrics/context_precision/">context precision page</a>).</li>
        <li>A 2×2 diagnosis is a heuristic, not a theorem: a low faithfulness score can also come from a judge that fails to see an inference the context supports. The 0.70 "low" cut-off in the game is invented for practice.</li>
      </ul>
    </div>
  </div>
</section>

function Stepper(o) {
  const M = o.steps.length;

  const api = {
    get k() { return k; }, M,
    go(n, {silent = false} = {}) {
      k = clamp(n, 0, M);

      o.render(k, silent);
      if (k >= M) api.pause();
    },
    step() { if (k >= M) return; api.go(k + 1); },
    play() {

      if (timer) clearInterval(timer); timer = null;
      o.play.setAttribute('aria-pressed', 'false'); o.play.textContent = '▶ Play';
    },
    reset() { api.pause(); api.go(0); }

/* ---------- the four metrics (the SELFTEST checks these exact functions) ---------- */
const sum1 = a => a.reduce((s, x) => s + (x ? 1 : 0), 0);

  const R = sum1(v); if (!R) return 0;

const S = {claims: null, stmts: null, order: null, rel: null, ans: 'good', gens: null, ov: null};
